.fresh strong{display:block;font-size:1.05rem}
.fresh small{display:block;color:var(--muted)}
.fresh.ok strong{color:#6ee7b7}
.fresh.warn{background:#3a2a07;border-color:#d97706}
.fresh.warn strong{color:var(--amber2)}
.fresh.bad{background:#3b1212;border-color:#b91c1c}
.fresh.bad strong{color:#fca5a5}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(13rem,1fr));gap:1rem;margin-bottom:1.5rem}
.stat{background:var(--card);border:1px solid var(--line);border-radius:1rem;padding:1rem}
.stat .k{color:var(--muted);font-size:.85rem}
.stat .v{font-size:1.6rem;color:#fff;font-weight:700;line-height:1.3}
.stat .v small{font-size:.9rem;color:var(--muted);font-weight:400}
.note{color:var(--muted);font-size:.85rem}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.85rem}
.hash{word-break:break-all;background:#071510;border:1px solid var(--line);border-radius:.5rem;padding:.5rem .75rem;margin:0 0 .5rem}
.copy{background:transparent;border:1px solid var(--line);color:#a7f3d0;border-radius:.375rem;font-size:.75rem;padding:.05rem .5rem;cursor:pointer;font-family:inherit}

.val{display:inline-flex;align-items:center;gap:.4rem;flex-wrap:wrap;justify-content:flex-end}
.tw{overflow-x:auto}

.b-sin_clasificar{background:#3a2a07;border-color:#d97706;color:var(--amber2)}
.b-reclamo{background:#3a2406;border-color:#f7931a;color:#fdba6a}
.b-liquidez{background:#0a2a3a;border-color:#38bdf8;color:#7dd3fc}
.b-gasto{background:#2a1f45;border-color:#a78bfa;color:#c4b5fd}
.b-retiro{background:#3d1630;border-color:#f472b6;color:#f9a8d4}
.pos{color:#6ee7b7}
.neg{color:#e5e7eb}
.warnbox{background:#3a2a07;border:1px solid #d97706;border-radius:.75rem;padding:.75rem 1rem;margin-bottom:1.5rem}

.warnbox ul{margin:0;padding-left:1.25rem}
.okbox{background:#0b3a2a;border:1px solid #10b981;border-radius:.75rem;padding:.75rem 1rem;margin:.75rem 0;color:#a7f3d0}
.badbox{background:#3b1212;border:1px solid #b91c1c;border-radius:.75rem;padding:.75rem 1rem;margin:.75rem 0;color:#fecaca}
.center{text-align:center}
pre.cmd{background:#071510;border:1px solid var(--line);border-radius:.5rem;padding:.75rem;overflow-x:auto;white-space:pre-wrap;overflow-wrap:anywhere;margin:0 0 .5rem;color:#e5e7eb}

dl.leg dt{margin-top:.6rem}
dl.leg dd{margin:0;color:var(--soft)}
/* persianas: cerradas ocupan una linea; se abren con un clic o con el teclado */
details.pers{background:var(--card);border:1px solid var(--line);border-radius:1rem;margin:0 0 .65rem}
details.pers>summary{position:relative;list-style:none;cursor:pointer;padding:.8rem 2.8rem .8rem 1.1rem;color:var(--orange);font-size:1.08rem;line-height:1.35;border-radius:1rem}
details.pers[open]>summary{border-radius:1rem 1rem 0 0}
details.pers>summary::-webkit-details-marker{display:none}
details.pers>summary::after{content:'';position:absolute;right:1.15rem;top:50%;width:.55rem;height:.55rem;margin-top:-.45rem;border-right:2px solid var(--amber);border-bottom:2px solid var(--amber);transform:rotate(45deg);transition:transform .25s ease,margin-top .25s ease}
details.pers[open]>summary::after{transform:rotate(-135deg);margin-top:-.1rem}

details.pers .cuerpo{padding:.1rem 1.25rem 1.1rem}

details.pers .cuerpo .note{color:var(--muted)}

details.pers.mini>summary{padding:.3rem 1.8rem .3rem 0;color:var(--amber2);font-size:.95rem;border-radius:.4rem}
details.pers.mini>summary::after{right:.3rem}
details.pers.mini .cuerpo{padding:.25rem 0 .4rem}

  details.pers{interpolate-size:allow-keywords}
  details.pers::details-content{block-size:0;overflow:hidden;transition:block-size .28s ease,content-visibility .28s allow-discrete}
  details.pers[open]::details-content{block-size:auto}
}
@media (prefers-reduced-motion:reduce){
  details.pers::details-content,details.pers>summary::after{transition:none}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.chip .mono{font-size:.74rem;color:var(--soft)}

.enlace .hilo{stroke:#1d7a63;stroke-width:2.5;fill:none}
.enlace .a{fill:var(--card);stroke:var(--ca,#4b7a6e);stroke-width:3}

  table.mov td.r{text-align:right}
  .bloque{width:10.5rem}
  details.pers>summary{font-size:1rem}
  details.pers .cuerpo{padding:.1rem 1rem 1rem}
}

      h('div', { class: 'bq-chips' }, chip(t.blkPrev, shaIx(S.total), t.blkStart)),

  }
  // el eslabon entre el bloque de la izquierda (izq, el mas nuevo) y el de su derecha (der): lleva los colores de la huella de der.
  // Sale rojo si el bloque izq ya se leyo y dice venir de una huella distinta de la que el indice da para der (es una comparacion de datos, no el calculo del SHA-256: ese es el boton de abajo).
  function eslabon(izq, der, t) {
    var abierto = izq === S.total + 1, esperado = shaIx(der), bi = abierto ? null : S.blq[izq];
    var dice = bi ? bi.anterior : undefined;
    var roto = !!bi && !!esperado && dice !== esperado;
    var sha = roto ? null : (esperado || (typeof dice === 'string' ? dice : null)), c = colores(sha);
    var d = h('div', { class: 'enlace' + (abierto ? ' abierto' : '') + (roto ? ' roto' : '') });
    d.innerHTML = ESLABON;
    if (c) { d.style.setProperty('--ca', c[0]); d.style.setProperty('--cb', c[1]); }
    var msg = roto ? fmt(t.linkBad, { a: num(izq), b: num(der) }) : (abierto ? fmt(t.linkOpen, { b: num(der) }) : fmt(t.linkOk, { a: num(izq), b: num(der) }));
    d.setAttribute('title', msg);
    if (roto) { d.setAttribute('role', 'img'); d.setAttribute('aria-label', msg); d.appendChild(h('b', { class: 'ojo', 'aria-hidden': 'true' }, '!')); }
    else d.setAttribute('aria-hidden', 'true');
    return d;
  }
  function vistaCadena(t, abiertos) {
    var e = S.estado, u = e.ultimo_bloque, carril = [];
    carril.push(tarjetaAbierta(t, abiertos.slice().reverse()));
    var hasta = Math.max(1, S.total - S.carril + 1);
    for (var n = S.total; n >= hasta; n--) { carril.push(eslabon(n + 1, n, t)); carril.push(tarjeta(n, t)); }
    if (hasta > 1) carril.push(h('div', { class: 'mas-bloques' }, h('button', { type: 'button', class: 'btn', 'data-fid': 'carril-mas', onclick: masBloques }, t.olderBtn)));
    var sec = [h('h2', null, t.chainTitle), h('p', { class: 'note' }, t.chainHelp),
      h('div', { class: 'carril', role: 'region', tabindex: '0', 'data-fid': 'carril', 'aria-label': t.carrilLabel }, carril)];
    if (u && typeof u === 'object') {

        h('div', { class: 'note' }, t.lastHash),

    }
    return h('section', { class: 'card', id: 'cadena' }, sec);
  }

  // Los avisos los escribe el generador en espanol con 3 frases fijas; aqui se reconocen y se traducen. Una frase desconocida
  // se muestra tal cual (con la nota "texto original, en espanol"), para no esconder nada.
  var ALERTAS = [
    { re: /^hay (\d{1,12}) movimiento\(s\) ya sellado\(s\) que phoenixd ya no lista$/, k: 'al_falta', v: function (m) { return { n: num(+m[1]) }; } },
    { re: /^el saldo calculado de un bloque salia negativo \((-?\d{1,15}) sats\): se publico 0$/, k: 'al_neg', v: function (m) { return { a: num(+m[1]) }; } },
    { re: /^diferencia contable de (-?\d{1,15}) sats entre el saldo del nodo \((-?\d{1,15})\) y el saldo inicial mas los movimientos \((-?\d{1,15})\); puede ser transitoria \(pagos en curso\)$/, k: 'al_dif', v: function (m) { return { a: num(+m[1]), b: num(+m[2]), c: num(+m[3]) }; } }
  ];
  function alertaTraducida(a, t) {
    for (var i = 0; i < ALERTAS.length; i++) {
      var m = ALERTAS[i].re.exec(a);
      if (m && t[ALERTAS[i].k]) return fmt(t[ALERTAS[i].k], ALERTAS[i].v(m));
    }
    return null;
  }

  // ---------------------------------------------------------------- vista
  function vistaListo(t) {
    var e = S.estado, out = [];
    out.push(frescura());
    if (Array.isArray(e.alertas) && e.alertas.length) {
      var crudas = 0;
      var items = e.alertas.map(function (a) { var x = alertaTraducida(String(a), t); if (x === null) { crudas++; return h('li', null, String(a)); } return h('li', null, x); });
      out.push(h('div', { class: 'warnbox' }, h('h2', null, t.alertTitle), h('ul', null, items), crudas ? h('p', { class: 'note' }, t.alertNote) : null));
    }
    out.push(h('div', { class: 'stats' },
      h('div', { class: 'stat' }, h('div', { class: 'k' }, t.sBalance), h('div', { class: 'v', id: 'saldo' }, num(e.saldo_sat), ' ', h('small', null, t.sats)), h('div', { class: 'note' }, t.balNote)),
      h('div', { class: 'stat' }, h('div', { class: 'k' }, t.sBlocks), h('div', { class: 'v', id: 'bloques' }, num(e.bloques))),
      h('div', { class: 'stat' }, h('div', { class: 'k' }, t.sMovs), h('div', { class: 'v', id: 'sellados' }, num(e.movimientos_sellados)))));
    var abiertos = Array.isArray(e.abierto) ? e.abierto.filter(function (m) { return m && typeof m === 'object'; }).reverse() : [];

    out.push(h('section', { class: 'card', id: 'abiertos' }, h('h2', null, t.openTitle),
      persiana('abierto', t.openWhat, h('p', null, t.openHelp), true),
      abiertos.length ? tabla(abiertos, t) : h('p', { class: 'note' }, t.openNone)));
    var sec = [h('h2', null, t.movTitle)];
    if (S.movs.length) sec.push(tabla(S.movs, t));
    else if (!S.cargandoMas) sec.push(h('p', { class: 'note' }, t.noMovs));
    if (S.fallaLectura) sec.push(h('p', { class: 'note' }, t.readFail));
    if (S.siguiente >= 1 || S.cargandoMas) {
      sec.push(h('p', { class: 'center' }, h('button', { type: 'button', class: 'btn', 'data-fid': 'mas', 'aria-disabled': S.cargandoMas ? 'true' : null, onclick: cargarMas }, S.cargandoMas ? t.loadingMore : fmt(t.more, { k: POR_PAGINA }))));
    }
    sec.push(persiana('leyenda', t.legTitle, [
      h('dl', { class: 'leg' }, TIPOS.map(function (k) { return [h('dt', null, insignia(k, t)), h('dd', null, t[{ entrada: 'legEntrada', reclamo: 'legReclamo', liquidez: 'legLiquidez', gasto: 'legGasto', retiro: 'legRetiro', sin_clasificar: 'legSin' }[k]])]; })),
      h('p', { class: 'note' }, t.legSlots + ' ' + t.legFee + ' ' + t.legHash)], true));
    out.push(h('section', { class: 'card', id: 'movimientos' }, sec));
    out.push(h('p', { class: 'masl' }, t.moreLabel));
    out.push(persiana('funciona', t.funTitle, lista('ol', t.funL)));
    out.push(persiana('limites', t.limTitle, [
      h('h3', null, t.limYesTitle), lista('ul', t.limYes, 'lim'),
      h('h3', null, t.limNoTitle), lista('ul', t.limNo, 'lim'),
      h('p', null, t.limCheck),
      h('h3', null, t.bcTitle), h('p', null, t.bcP1), h('p', null, t.bcP2),
      h('p', { class: 'note' }, t.privText + ' ', h('a', { href: '/privacy/' }, t.privLink))]));
    out.push(persiana('verificar', t.vTitle, vistaVerificacion(t)));
    var cmd = 'git clone ' + REPO + '\ncd takepower-ledger\npython3 verify_ledger.py --url ' + origen() + BASE;
    var r = e.reglas && typeof e.reglas === 'object' ? e.reglas : null;
    out.push(persiana('independiente', t.howTitle, [
      h('p', null, t.howIntro), h('pre', { class: 'cmd mono' }, cmd), botonCopiar(cmd, t),
      h('p', null, h('a', { href: REPO, target: '_blank', rel: 'noopener noreferrer' }, t.lnkRepo)),
      h('p', null, t.lnkFiles + ': ', h('a', { href: BASE + 'estado.json' }, 'estado.json'), ' · ', h('a', { href: BASE + 'indice.json' }, 'indice.json'), ' · ', h('a', { href: BASE + 'bloques/000001.json' }, 'bloques/000001.json')),
      persiana('tecnicos', t.detTitle, h('dl', { class: 'det mono' },
        h('dt', null, t.detNode), h('dd', null, e.nodo === undefined ? '—' : String(e.nodo)),
        h('dt', null, t.detFormat), h('dd', null, String(e.formato)),
        h('dt', null, t.detRules), h('dd', null, r ? fmt(t.rules, { a: r.movimientos_por_bloque, b: r.horas_maximas, c: r.latido_dias, d: r.gracia_minutos }) : '—'),
        h('dt', null, t.detCredit), h('dd', null, num(e.credito_comisiones_sat) + ' ' + t.sats)), true)]));
    return out;
  }
  function cita(t) {
    return h('figure', { class: 'cita' },
      h('blockquote', null, h('p', null, t.citaTrad)),
      h('figcaption', null, CITA_AUTOR));
  }
  function nav(t) {
    return h('nav', { class: 'nav', 'aria-label': t.navLabel }, NAV.map(function (it) {
      var marca = h('span', { 'aria-hidden': 'true' });
      if (it.icono) marca.innerHTML = ICONOS[it.icono]; else marca.textContent = it.glifo;
      return h('a', { class: it.clase, href: HOME + it.ruta, 'data-fid': 'nav-' + it.id }, marca, t[it.clave]);
    }));
  }
  function vista() {
    var t = TXT[S.lang];
    var botones = LANGS.map(function (l) {
      return h('button', { type: 'button', class: 'btn', 'data-fid': 'lang-' + l, 'aria-pressed': S.lang === l ? 'true' : 'false', 'aria-label': NOMBRES[l], lang: l === 'pt' ? 'pt-BR' : l, onclick: function () { setLang(l); } }, l === 'pt' ? 'BR' : l.toUpperCase());
    });

    else if (S.fase === 'vacio') cuerpo.push(h('section', { class: 'card', id: 'vacio' }, h('p', null, t.empty)));
    else if (S.fase === 'error') cuerpo.push(h('section', { class: 'card', id: 'error' }, h('p', { role: 'alert' }, t.error), h('button', { type: 'button', class: 'btn', 'data-fid': 'reintentar', onclick: function () { cargar(false); } }, t.retry)));
    else cuerpo = vistaListo(t);

      h('header', { class: 'hero' },

      h('main', null,
        persiana('experimento', t.expTitle, [h('p', null, t.expP1), h('p', null, t.expP2), h('h3', null, t.expPrinc), lista('ul', t.expL), h('p', null, t.expP3)]),
        cuerpo),
      h('div', { class: 'foot' }, cita(t), h('a', { href: HOME }, '₿ takepower.world')));
  }
  function render() {
    var t = TXT[S.lang];
    var foco = document.activeElement && document.activeElement.getAttribute ? document.activeElement.getAttribute('data-fid') : null;
    document.documentElement.lang = S.lang === 'pt' ? 'pt-BR' : S.lang;
    document.title = t.docTitle;
    var meta = document.querySelector('meta[name=description]');
    if (meta) meta.setAttribute('content', t.metaDesc);
    var app = document.getElementById('app');
    var viejo = app.querySelector('.carril'), izq = viejo ? viejo.scrollLeft : 0;
    app.textContent = '';
    var v = vista();
    app.appendChild(v);
    var nuevo = app.querySelector('.carril');
    if (nuevo && izq) nuevo.scrollLeft = izq;
    if (foco) { var n = app.querySelector('[data-fid="' + foco + '"]'); if (n) n.focus({ preventScroll: true }); }
    if (S.irA && !S.cargandoMas && !S.cargandoCarril) {
      var dest = document.getElementById(S.irA);
      if (dest) { S.irA = null; dest.scrollIntoView(); }
    }
  }
  function setLang(l) {
    S.lang = l;
    try { localStorage.setItem('lang', l); } catch (e) {}
    render();
  }
  // un enlace como /ledger/#verificar abre esa persiana y baja hasta ella
  function abrirPorHash() {
    var id = String(location.hash || '').replace(/^#/, '');
    if (HASHES.indexOf(id) < 0) return;
    S.abiertas[id] = true;
    S.irA = id;
  }

  // ---------------------------------------------------------------- arranque
  try { var g = localStorage.getItem('lang'); if (LANGS.indexOf(g) >= 0) S.lang = g; } catch (e) {}
  abrirPorHash();
  window.addEventListener('hashchange', function () { abrirPorHash(); render(); });
  render();
  cargar(false);
  setInterval(function () {
    var f = document.getElementById('fresh');
    if (f && S.estado) f.parentNode.replaceChild(frescura(), f);
  }, 30000);
  setInterval(function () { cargar(true); }, REFRESCO_MS);
})();
