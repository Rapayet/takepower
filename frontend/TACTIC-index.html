    // ═══════════════════════════════════════════
    //  LESSONS (DIAGNOSIS)
    // ═══════════════════════════════════════════
    const lessons = [
      { num: "1", title: "Nunca imponer por ley", text: "El Salvador mandó aceptar Bitcoin por decreto en septiembre de 2021. Para 2024, el 92% de la población evitaba transacciones con Bitcoin y el 48.5% pensaba que la ley debería abolirse. En enero de 2025, la Asamblea Legislativa revocó el estatus de curso legal como condición para un préstamo de $1,400M del FMI. El gobierno gastó $329M (0.7% del PIB) en un proyecto que la gente no quería. La adopción nace de la utilidad percibida, no de la obligación legal.", source: "El Salvador" },
      { num: "2", title: "Nunca depender de una app gubernamental", text: "Chivo Wallet fue un desastre técnico: crashes constantes, robo de identidad, vulnerabilidades de seguridad, y filtración del código fuente en 2024. El 62.9% de quienes la descargaron nunca la usaron o la usaron solo una vez. Las herramientas deben ser código abierto y controladas por la comunidad, no por el gobierno.", source: "Chivo Wallet" },
      { num: "3", title: "El turismo como base económica es insostenible", text: "Bitcoin Beach, Bitcoin Jungle, Bitcoin Island — todos dependen del flujo de visitantes ricos. La pandemia de COVID demostró lo frágil que es este modelo: cuando los vuelos pararon, las economías turísticas colapsaron de un día para otro. Pero más allá de la fragilidad, hay un problema estructural: necesitamos reducir drásticamente la quema de combustible fósil, no construir economías que dependan de que la gente siga volando alrededor del mundo. Una economía circular que requiere turismo internacional para funcionar es una contradicción ecológica.", source: "Patrón global" },
      { num: "4", title: "Sin producción local, no hay circularidad", text: "Los sats necesitan una razón para circular internamente. Si la comunidad no produce nada que se consuma localmente, los sats salen inmediatamente a comprar insumos externos. Los modelos que funcionan están basados en energía y alimentos — necesidades universales con demanda constante, no dependientes de modas ni flujos turísticos.", source: "Todas las economías circulares" },
      { num: "5", title: "Los pagos instantáneos gubernamentales matan a Lightning donde Lightning solo ofrece velocidad", text: "Praia Bitcoin (Jericoacoara, Brasil) cerró en febrero de 2026 porque PIX — gratuito, instantáneo, gubernamental — eliminó la ventaja de conveniencia de Lightning. En Kenia, M-PESA domina con la misma lógica. Lightning tiene que ofrecer algo que el fiat local no pueda: ahorro duro, resistencia a censura, o pagos transfronterizos sin comisiones bancarias.", source: "Praia Bitcoin, Afribit" },
      { num: "6", title: "La volatilidad es devastadora sin colchón", text: "Bitcoin Ekasi (Sudáfrica) paga el 100% de salarios en Bitcoin. Cuando BTC cae 30% en una semana, un trabajador que gana $5/día pasa a ganar $3.50. El colchón necesario no es un fondo de cobertura — es el apoyo mutuo de la comunidad: fondos comunitarios de estabilización, reservas colectivas, y redes de trueque local que amortigüen la caída. El juego de Bitcoin debe jugarse en grupo, no en individual — un trabajador solo es aplastado por las ballenas, una comunidad organizada resiste.", source: "Bitcoin Ekasi" },
      { num: "7", title: "Los fundadores no deben acumular propiedades", text: "En El Zonte, los fundadores de Bitcoin Beach acumularon 14 propiedades mientras el precio del terreno subía de $34/m² a más de $1,000/m². La gentrificación destruye la legitimidad del proyecto y desplaza a la comunidad que supuestamente se beneficia. Si el proyecto enriquece a los fundadores y empobrece a los vecinos, no es economía circular — es especulación inmobiliaria con narrativa social.", source: "Bitcoin Beach" },
      { num: "8", title: "Densidad antes que dispersión", text: "La FBCE (Federación de Economías Circulares de Bitcoin, cofundada en 2024, red en 19+ países, 42 proyectos financiados) lo confirmó: hay que concentrarse en una ubicación específica y alcanzar masa crítica antes de expandir. La adopción dispersa no genera el efecto de red necesario para que los sats circulen sin necesidad de salir a fiat.", source: "FBCE" },
      { num: "9", title: "Bitcoin no se regula — se trasciende", text: "El Salvador operó en un vacío regulatorio: opacidad, beneficio para cercanos al presidente, intervención del FMI. Praia Bitcoin intentó registrarse como 'Banco Comunitario Bitcoin' y el gobierno lo rechazó. Pero la lección no es 'necesitamos mejor regulación' — es que Bitcoin, por diseño, no puede ser regulado por estados. Es transparente (toda transacción es pública) pero ingobernable (nadie puede censurar una transacción). La pregunta real es: ¿cómo se financian bienes comunes sin impuestos coercitivos? La respuesta está en la autonomía comunitaria: inversiones de impacto decididas por consentimiento dentro de cada círculo, fondos comunitarios transparentes en la blockchain, y rendición de cuentas directa entre vecinos — no entre ciudadano y burócrata.", source: "El Salvador, Praia Bitcoin" },
      { num: "10", title: "El 'problema del reabastecimiento' es real", text: "Afribit en Kibera (Nairobi) lo enfrenta a diario: un comerciante acepta sats por tomates, pero su proveedor no acepta sats. Necesita reconvertir a shilling keniano para comprar inventario. La solución no es purismo — es integración pragmática. Herramientas como Tando permiten reconversión a M-PESA mientras la red crece. Que el comerciante convierta lo que necesite; la presión es que cada vez necesite convertir menos.", source: "Afribit" },
      { num: "11", title: "La minería es andamiaje, no destino", text: "Gridless en Zambia lo entiende: cuando la planta hidroeléctrica de Zengamina se conecte a la red nacional, el contenedor de minería se irá. La minería es temporal — sirve para hacer viable la planta mientras la demanda local crece. El objetivo es electrificación y producción, no minería perpetua. Es radicalmente distinto a Bitcoin Beach, donde si el turista se va, todo colapsa.", source: "Gridless, Zengamina" },
      { num: "12", title: "Bottom-up siempre supera a top-down", text: "Cada proyecto exitoso empezó pequeño y orgánico. Cada fracaso empezó con un decreto, un anuncio en una conferencia de Miami, o una donación millonaria sin raíces comunitarias. El Salvador gastó $329 millones en un proyecto que el 92% rechazó. Bitcoin Lake creció con $200 de donación inicial. La semilla pequeña echa raíces; el decreto grande las arranca.", source: "Todos los casos" }
    ];

    // ═══════════════════════════════════════════
    //  MODELS
    // ═══════════════════════════════════════════
    const models = [
      { title: "⚡ Gridless — Minería como subsidio energético", location: "Kenya, Malawi, Zambia · Desde 2022 · Respaldada por Block (Jack Dorsey)", text: `<p>El modelo de Gridless demuestra que <strong>la economía circular de Bitcoin es posible — pero su base debe ser la producción energética, no el turismo.</strong> Gridless usa Bitcoin como comprador de último recurso de energía renovable sobrante.</p><p>El mecanismo: una comunidad rural tiene una microhidroelétrica que genera 1 MW pero solo consume 200 kW. El 80% se desperdicia — se devuelve al río. Gridless instala un contenedor con mineros ASIC que absorben ese excedente. El ingreso de la minería hace viable la planta entera, lo que permite bajar el precio de la electricidad para la comunidad.</p><h3>Resultados concretos</h3><ul><li><strong>Murang'a, Kenya:</strong> Una microhidroelétrica de río generaba más energía de la que 500 familias podían consumir. Gridless instaló mineros que absorben el excedente. Resultado: el precio de electricidad bajó de $0.35 a $0.25/kWh para 2,000 personas. La planta pasó de ser financieramente frágil a rentable. Los sats generados por la minería financian la operación de la planta — la comunidad se beneficia con electricidad más barata, no necesita saber nada de Bitcoin para que el modelo funcione.</li><li><strong>Bondo, Malawi:</strong> 1,800 hogares obtuvieron electricidad que antes no existía</li><li><strong>Zengamina, Zambia:</strong> La minería aporta el 30% de los ingresos de una planta que sirve a 15,000 personas</li></ul><h3>Diseño adaptativo</h3><p>Cuando la comunidad necesita energía (picos de 6 AM y 6 PM), los mineros bajan automáticamente. Cuando la demanda cae, los mineros suben. <strong>La comunidad siempre tiene prioridad.</strong></p><p><strong>Gridless planea irse de Zengamina.</strong> Cuando la planta se conecte a la red nacional, el contenedor se muda. La minería es andamiaje temporal — su éxito se mide por cuándo deja de ser necesaria. También desarrollan <strong>"Jua Kali Miner"</strong> (open-source) para que agricultores minen con excedente solar.</p>` },
      { title: "🌿 BigBlock — Minería + producción alimentaria", location: "Virunga (RD Congo) y Liouesso (Rep. Congo) · Desde 2020", text: `<p>Sébastien Gouspillou instaló minería hidroeléctrica en el Parque Nacional de Virunga — hogar de la mitad de los gorilas de montaña del mundo. El turismo había colapsado (ingresos cayeron 40%). La minería lo reemplazó como fuente de financiación.</p><h3>¿Cómo funciona el dinero?</h3><p>BigBlock opera los contenedores de minería y <strong>paga al operador de la planta hidroeléctrica por la electricidad consumida.</strong> Ese pago es lo que hace viable la planta y permite extender la red eléctrica. Los bitcoins minados los recibe BigBlock como empresa, que los vende para cubrir costos operativos, salarios locales, mantenimiento de equipos, y reinversión. El parque de Virunga también opera 3 contenedores propios, cuyos bitcoins van directamente a financiar la conservación del parque. En el modelo ideal a futuro, la comunidad misma operaría la minería — los sats quedarían en manos locales.</p><h3>La innovación clave: calor productivo</h3><p><strong>El calor residual de los mineros seca cacao y frutas.</strong> Esto transforma un subproducto desperdiciado en producción alimentaria real.</p><h3>Resultados</h3><ul><li>10 contenedores (7 de BigBlock, 3 del parque), ~$500,000/año para conservación</li><li>15 empleos full-time en minería + <strong>50-60 part-time en secado de cacao y frutas</strong></li><li>Potencial de escalar a 100-300 empleos con la operación de secado</li><li>Liouesso, Rep. Congo: planta de 20 MW usando solo 2-3 MW. BigBlock instaló 12 MW. El proveedor ahora puede extender líneas a aldeas que <strong>nunca tuvieron electricidad</strong></li></ul><blockquote>"Cuando le das dinero al productor de electricidad, cambias la vida de una región." — Gouspillou</blockquote>` },
      { title: "🌱 Invernaderos + Minería — El modelo de calor", location: "Manitoba (Canadá), Suecia, Noruega, Holanda · Desde 2024-2026", text: `<p>Manitoba (enero 2026): 360 mineros de refrigeración líquida cuyo calor residual (75°C+) calienta invernaderos de tomates a -30°C. El 90% de la electricidad se recupera como calor útil, a $0.035/kWh.</p><h3>Evidencia</h3><ul><li><strong>Suecia:</strong> datacenter de 1 MW fortalece autosuficiencia alimentaria local hasta 8%</li><li><strong>ScienceDirect (2025):</strong> ganancias de hasta $1.5M/año para invernaderos integrados</li><li><strong>Manitoba:</strong> acuaponía — lechugas + 800 truchas árticas, calentadas por ASICs</li><li><strong>Noruega:</strong> 600 kW provee calor para 300m² de invernadero a -30°C</li><li><strong>Holanda:</strong> BitcoinBloem — tulipanes calentados por mineros</li></ul><p><strong>La minería puede ser la fuente de calor más barata para producción alimentaria en climas fríos.</strong> Doble retorno de la misma energía.</p>` },
      { title: "🌍 Green Africa Mining Alliance", location: "Kenya, Congo, Etiopía, Zambia · Desde 2024", text: `<p>Alianza operativa: Gridless y Sukuma Ventures (Kenya), BigBlock (Congo), QRB (Etiopía — generó $200M+), Quantum Hash (Zambia), Trojan Mining (entrena jóvenes).</p><h3>Los números del continente</h3><ul><li>África: <strong>300+ GW de potencial hidroeléctrico sin explotar</strong> (IRENA)</li><li><strong>65%+ de mini-redes no son comercialmente viables</strong> — dependen de subsidios</li><li>KenGen (Kenya) invitó oficialmente a mineros a usar geotérmica abundante</li><li>Etiopía: electricidad a $0.0314/kWh</li></ul><p>Bitcoin mining cierra la brecha. <strong>No es el destino — es el puente.</strong></p>` },
      { title: "📊 Contexto global de la minería", location: "Datos a mid-2025", text: `<ul><li><strong>Consumo total:</strong> ~168 TWh/año (Cambridge)</li><li><strong>Renovables:</strong> 52% (arriba del ~30% en 2022)</li><li><strong>Texas:</strong> mineros como "amortiguadores" — se apagan en picos para estabilizar la red (Riot ganó $31.7M en agosto 2023 solo por apagarse)</li><li><strong>Cornell:</strong> minería pre-comercial podría generar $47M para 32 proyectos renovables en Texas</li></ul>` }
    ];

    // ═══════════════════════════════════════════
    //  BLUEPRINT PHASES
    // ═══════════════════════════════════════════
    const phases = [
      { num: "1", title: "Energía", subtitle: "Hacer viable la planta con minería", text: `<p>Identificar una fuente renovable subutilizada: hidroeléctrica de río, solar con excedente, geotérmica. Instalar minería como comprador de último recurso. El ingreso subsidia electricidad barata para la comunidad.</p><p><strong>Modelo:</strong> Gridless en Kenya/Malawi/Zambia.</p><p><strong>Requisitos:</strong> Fuente con excedente verificable. Acuerdo con operador. Software adaptativo que priorice comunidad. Personal local. Compromiso de que la minería es temporal.</p>` },
      { num: "2", title: "Producción", subtitle: "Electricidad barata + calor residual = alimentos locales", text: `<p>Usar la electricidad subsidiada y el calor de los ASICs para producción alimentaria local: invernaderos, secado de granos/frutas/cacao, acuaponía, almacenamiento en frío.</p><p><strong>Modelos:</strong> BigBlock secando cacao en Virunga. Invernaderos en Manitoba. Acuaponía en Canadá.</p><p><strong>La ventaja brutal sobre el turismo:</strong> el alimento se consume localmente. No hay fuga de valor. No necesitas que un nómada digital de Berlín venga a comprar un açaí bowl.</p>` },
      { num: "3", title: "Circulación", subtitle: "Densidad de red para que los sats no salgan", text: `<p>Con producción + consumo local, los sats circulan. Agricultor → mercado → transportista → mecánico. Cada eslabón es producción real.</p><p><strong>Pragmatismo durante la transición:</strong> Integrar con fiat para el "problema de reabastecimiento" mientras la red crece. Pero el objetivo es claro: con el <a href="/energystandard/" style="color:#f7931a">Patrón Energético</a> — donde el valor de cada producto se mide en la energía real que costó producirlo — el fiat debe ser abandonado con prontitud. El poder adquisitivo real está en los trabajadores que producen energía y alimentos, no en el banco central que imprime papel. Cada comerciante que deja de necesitar convertir a fiat es un eslabón más de soberanía.</p><p><strong>Concentrar en una ubicación.</strong> Masa crítica en radio pequeño antes de expandir.</p>` },
      { num: "4", title: "Soberanía", subtitle: "Propiedad colectiva de los medios de producción", text: `<p>Cuando la densidad circular es suficiente, la comunidad controla colectivamente los tres pilares: <strong>los medios de emisión monetaria</strong> (nodos Bitcoin, minería), <strong>la infraestructura energética</strong> (planta renovable, distribución), y <strong>los medios de producción</strong> (invernaderos, tierras agrícolas, herramientas). Los sats ya no necesitan salir.</p><p><strong>La diferencia fundamental:</strong> la fuente de sats no es un donante ni un turista — es la producción energética de la propia comunidad. Lo que esos sats compran no es un servicio para visitantes — es comida local. Y la infraestructura que lo hace posible no pertenece a una empresa externa — pertenece a quienes la operan.</p><p>Esta es la socialización real de los medios de producción: no por decreto estatal sino por construcción comunitaria. No por confiscación sino por creación. Los trabajadores que producen la energía, cultivan los alimentos y mantienen los nodos son los dueños legítimos — porque son quienes aportan el trabajo real.</p>` }
    ];

    // ═══════════════════════════════════════════
    //  RENDER
    // ═══════════════════════════════════════════

    const TR = {
      en: {
        diagnosis: `<details class="bg-[#081a14] rounded-2xl border border-emerald-800/30 mb-8"><summary class="cursor-pointer p-6 flex items-center justify-between list-none"><h2 class="text-xl md:text-2xl font-bold text-emerald-200 m-0">The Polycrisis</h2><span class="text-amber-400 text-2xl flex-shrink-0 ml-4 summary-arrow">▸</span></summary><div class="p-6 pt-0">

<p class="text-gray-300 leading-relaxed mb-4">The institutions that promised peace and sustainability have failed. The UN turns 80 in an existential crisis: its budget was cut by 25%, the US withdrew from 35 organizations and 31 specialized agencies in January 2026, UNHCR fired 30% of its staff while the world's displaced doubled to 118 million, and the Security Council remains paralyzed by great power vetoes — 14 members voted for a ceasefire in Gaza in June 2025 and one alone blocked it. Meanwhile, in Sudan the largest humanitarian crisis of the 21st century unfolds: over 150,000 dead (including the El Fasher massacre with 60,000 victims), 14 million displaced, 19 million children out of school, 460 people massacred inside a hospital. In Congo, decades of war over minerals remain unresolved. In Gaza, bombings of hospitals and refugee camps pile up before the impotence of international law. Nation-states, designed to protect their citizens, have proven they protect interests before people.</p>

<p class="text-gray-300 leading-relaxed mb-4">On the ecological front, the 2030 Agenda for Sustainable Development Goals lies in ruins: none of its targets will be met on time. The World Meteorological Organization warns that 2025 could be the first year to exceed 1.5°C of warming for twelve consecutive months — the threshold scientists declared catastrophic. The four largest donors in the world (US, Germany, France and UK) cut development aid simultaneously for the first time in 30 years. Global military spending exceeds $2.5 trillion annually while UN humanitarian financing received just 12.7% of what was requested for 2025. The equation is obscene: there is plenty of money for weapons, not enough for drinking water.</p>

<p class="text-gray-300 leading-relaxed mb-6"><strong class="text-amber-300">The revolution cannot wait any longer.</strong> It will not come from the UN, whose forums have become empty ceremonies where powers block any real action. It will not come from nation-states, whose leaders prioritize reelection over ecological survival. It will not come from climate summits that have spent 30 years producing broken promises. It will come from below — from communities that take control of their energy, their money and their food production. The 12 lessons that follow document the errors of the first attempts at circular economies with Bitcoin. But they also point the way: local production, radical cooperation, energy sovereignty. We don't need more diagnoses — we need action.</p>

<div class="bg-[#071510] rounded-xl p-5 border border-emerald-800/30">
<h3 class="text-lg font-bold text-emerald-300 mb-4">To go deeper: 7 essential documentaries</h3>
<div class="space-y-3 text-sm">
<div class="flex gap-3 items-start"><span class="text-amber-400 font-bold flex-shrink-0">1.</span><div><strong class="text-white">Breaking Boundaries: The Science of Our Planet</strong> <span class="text-gray-400">(2021, Netflix)</span> — <span class="text-gray-300">David Attenborough and scientist Johan Rockström reveal the nine planetary boundaries humanity has already crossed and why we stand at the edge of ecological collapse.</span></div></div>
<div class="flex gap-3 items-start"><span class="text-amber-400 font-bold flex-shrink-0">2.</span><div><strong class="text-white">HyperNormalisation</strong> <span class="text-gray-400">(2016, BBC / Adam Curtis)</span> — <span class="text-gray-300">How governments and financiers built a fake world to maintain power. From the fall of Damascus to the rise of Trump, Curtis shows how we grew accustomed to living in a lie.</span></div></div>
<div class="flex gap-3 items-start"><span class="text-amber-400 font-bold flex-shrink-0">3.</span><div><strong class="text-white">Koyaanisqatsi</strong> <span class="text-gray-400">(1982, Godfrey Reggio / Philip Glass)</span> — <span class="text-gray-300">"Life out of balance" in the Hopi language. Without a single word, only images and music, this masterpiece forces you to feel the imbalance between humanity and Nature. Pure visual poetry.</span></div></div>
<div class="flex gap-3 items-start"><span class="text-emerald-400 font-bold flex-shrink-0">4.</span><div><strong class="text-white">The Internet's Own Boy: The Story of Aaron Swartz</strong> <span class="text-gray-400">(2014, Brian Knappenberger)</span> — <span class="text-gray-300">Aaron Swartz co-founded Reddit, created RSS at age 14 and fought for free access to human knowledge. The system destroyed him at 26. His story mirrors everything the manifesto defends: open source, decentralization and knowledge as a universal right.</span></div></div>
<div class="flex gap-3 items-start"><span class="text-emerald-400 font-bold flex-shrink-0">5.</span><div><strong class="text-white">Fantastic Fungi</strong> <span class="text-gray-400">(2019, Louie Schwartzberg / Netflix)</span> — <span class="text-gray-300">Mycelium as Nature's underground internet: a network connecting trees, regenerating soils and proving that cooperation — not competition — is the fundamental principle of life. Sociocracy already exists in the forest.</span></div></div>
<div class="flex gap-3 items-start"><span class="text-emerald-400 font-bold flex-shrink-0">6.</span><div><strong class="text-white">Colombia: The Long Road to Peace</strong> <span class="text-gray-400">(2022, DW Documentary)</span> — <span class="text-gray-300">After 50 years of civil war, former FARC combatants accepted responsibility for war crimes before the Special Jurisdiction for Peace. 6,804 guerrillas surrendered 8,994 weapons. Reconciliation is possible — but it demands truth, restorative justice and the will to listen to the other.</span></div></div>
<div class="flex gap-3 items-start"><span class="text-emerald-400 font-bold flex-shrink-0">7.</span><div><strong class="text-white">The Communes of Rojava: A Model in Practice</strong> <span class="text-gray-400">(2016, Debbie Bookchin)</span> — <span class="text-gray-300">Amid the Syrian civil war, Kurdish communities built a direct democracy without a state: neighborhood assemblies, cooperatives, mandatory female co-leadership and multiethnic equality. Inspired by anarchist Murray Bookchin, Rojava proves self-governance works — even under bombs.</span></div></div>

<h1 class="text-2xl md:text-3xl font-bold text-amber-400 mb-2">The diagnosis: 12 lessons from the failures</h1>
<div class="prose max-w-none mb-6"><p>Between 2019 and 2026, a dozen experiments attempted to build circular economies with Bitcoin. From El Salvador's legal tender law to the beaches of Costa Rica and Kenya's informal settlements. We studied each one in the <a href="/learn/" style="color:#f7931a">Observatory</a>. Here we distill the lessons.</p><p><strong>Central thesis:</strong> Most Bitcoin circular economies failed because they depended on tourism as their source of sats. Tourism is an unsustainable base: it depends on wealthy visitors flying around the world — something the pandemic proved fragile and the climate crisis makes irresponsible. That's not sovereignty — it's dependency disguised as innovation.</p></div>
<div class="lesson-card bg-[#071510] rounded-xl p-5 border border-emerald-800/50 mb-4"><div class="flex items-start gap-3"><span class="inline-flex items-center justify-center w-8 h-8 bg-amber-500 text-black rounded-full font-bold text-sm flex-shrink-0 mt-0.5">1</span><div class="flex-1"><h3 class="text-lg font-bold text-white mb-2" style="margin-top:0">Never impose by law</h3><p class="text-gray-300 leading-relaxed mb-2">El Salvador mandated Bitcoin acceptance by decree in September 2021. By 2024, 92% of the population avoided Bitcoin transactions and 48.5% thought the law should be abolished. In January 2025, the Legislative Assembly revoked legal tender status as a condition for a $1.4B IMF loan. The government spent $329M (0.7% of GDP) on a project the people didn't want. Adoption stems from perceived utility, not legal obligation.</p><span class="text-xs text-emerald-400/70 italic">↳ El Salvador</span></div></div></div><div class="lesson-card bg-[#071510] rounded-xl p-5 border border-emerald-800/50 mb-4"><div class="flex items-start gap-3"><span class="inline-flex items-center justify-center w-8 h-8 bg-amber-500 text-black rounded-full font-bold text-sm flex-shrink-0 mt-0.5">2</span><div class="flex-1"><h3 class="text-lg font-bold text-white mb-2" style="margin-top:0">Never depend on a government app</h3><p class="text-gray-300 leading-relaxed mb-2">Chivo Wallet was a technical disaster: constant crashes, identity theft, security vulnerabilities, and source code leaked in 2024. 62.9% of those who downloaded it never used it or used it only once. Tools must be open source and community-controlled, not government-run.</p><span class="text-xs text-emerald-400/70 italic">↳ Chivo Wallet</span></div></div></div><div class="lesson-card bg-[#071510] rounded-xl p-5 border border-emerald-800/50 mb-4"><div class="flex items-start gap-3"><span class="inline-flex items-center justify-center w-8 h-8 bg-amber-500 text-black rounded-full font-bold text-sm flex-shrink-0 mt-0.5">3</span><div class="flex-1"><h3 class="text-lg font-bold text-white mb-2" style="margin-top:0">Tourism as an economic base is unsustainable</h3><p class="text-gray-300 leading-relaxed mb-2">Bitcoin Beach, Bitcoin Jungle, Bitcoin Island — all depend on the flow of wealthy visitors. The COVID pandemic proved how fragile this model is: when flights stopped, tourist economies collapsed overnight. But beyond fragility, there's a structural problem: we need to drastically reduce fossil fuel burning, not build economies that depend on people flying around the world. A circular economy that requires international tourism to function is an ecological contradiction.</p><span class="text-xs text-emerald-400/70 italic">↳ Global pattern</span></div></div></div><div class="lesson-card bg-[#071510] rounded-xl p-5 border border-emerald-800/50 mb-4"><div class="flex items-start gap-3"><span class="inline-flex items-center justify-center w-8 h-8 bg-amber-500 text-black rounded-full font-bold text-sm flex-shrink-0 mt-0.5">4</span><div class="flex-1"><h3 class="text-lg font-bold text-white mb-2" style="margin-top:0">Without local production, there's no circularity</h3><p class="text-gray-300 leading-relaxed mb-2">Sats need a reason to circulate internally. If the community doesn't produce anything consumed locally, sats immediately leave to buy external supplies. Models that work are based on energy and food — universal needs with constant demand, not dependent on trends or tourist flows.</p><span class="text-xs text-emerald-400/70 italic">↳ All circular economies</span></div></div></div><div class="lesson-card bg-[#071510] rounded-xl p-5 border border-emerald-800/50 mb-4"><div class="flex items-start gap-3"><span class="inline-flex items-center justify-center w-8 h-8 bg-amber-500 text-black rounded-full font-bold text-sm flex-shrink-0 mt-0.5">5</span><div class="flex-1"><h3 class="text-lg font-bold text-white mb-2" style="margin-top:0">Government instant payments kill Lightning where Lightning only offers speed</h3><p class="text-gray-300 leading-relaxed mb-2">Praia Bitcoin (Jericoacoara, Brazil) closed in February 2026 because PIX — free, instant, government-run — eliminated Lightning's convenience advantage. In Kenya, M-PESA dominates with the same logic. Lightning must offer something the local fiat system can't: hard savings, censorship resistance, or borderless payments without bank fees.</p><span class="text-xs text-emerald-400/70 italic">↳ Praia Bitcoin, Afribit</span></div></div></div><div class="lesson-card bg-[#071510] rounded-xl p-5 border border-emerald-800/50 mb-4"><div class="flex items-start gap-3"><span class="inline-flex items-center justify-center w-8 h-8 bg-amber-500 text-black rounded-full font-bold text-sm flex-shrink-0 mt-0.5">6</span><div class="flex-1"><h3 class="text-lg font-bold text-white mb-2" style="margin-top:0">Volatility is devastating without a cushion</h3><p class="text-gray-300 leading-relaxed mb-2">Bitcoin Ekasi (South Africa) pays 100% of salaries in Bitcoin. When BTC drops 30% in a week, a worker earning $5/day now earns $3.50. The necessary cushion isn't a hedge fund — it's the community's mutual aid: community stabilization funds, collective reserves, and local barter networks that absorb the fall. The Bitcoin game must be played as a group, not individually — a lone worker is crushed by whales, an organized community resists.</p><span class="text-xs text-emerald-400/70 italic">↳ Bitcoin Ekasi</span></div></div></div><div class="lesson-card bg-[#071510] rounded-xl p-5 border border-emerald-800/50 mb-4"><div class="flex items-start gap-3"><span class="inline-flex items-center justify-center w-8 h-8 bg-amber-500 text-black rounded-full font-bold text-sm flex-shrink-0 mt-0.5">7</span><div class="flex-1"><h3 class="text-lg font-bold text-white mb-2" style="margin-top:0">Founders must not accumulate properties</h3><p class="text-gray-300 leading-relaxed mb-2">In El Zonte, Bitcoin Beach founders accumulated 14 properties while land prices rose from $34/m² to over $1,000/m². Gentrification destroys the project's legitimacy and displaces the community supposedly being helped. If the project enriches founders and impoverishes neighbors, it's not a circular economy — it's real estate speculation with a social narrative.</p><span class="text-xs text-emerald-400/70 italic">↳ Bitcoin Beach</span></div></div></div><div class="lesson-card bg-[#071510] rounded-xl p-5 border border-emerald-800/50 mb-4"><div class="flex items-start gap-3"><span class="inline-flex items-center justify-center w-8 h-8 bg-amber-500 text-black rounded-full font-bold text-sm flex-shrink-0 mt-0.5">8</span><div class="flex-1"><h3 class="text-lg font-bold text-white mb-2" style="margin-top:0">Density before dispersion</h3><p class="text-gray-300 leading-relaxed mb-2">The FBCE (Federation of Bitcoin Circular Economies, co-founded 2024, network in 19+ countries, 42 funded projects) confirmed it: concentrate on a specific location and achieve critical mass before expanding. Dispersed adoption doesn't generate the network effect needed for sats to circulate without needing to exit to fiat.</p><span class="text-xs text-emerald-400/70 italic">↳ FBCE</span></div></div></div><div class="lesson-card bg-[#071510] rounded-xl p-5 border border-emerald-800/50 mb-4"><div class="flex items-start gap-3"><span class="inline-flex items-center justify-center w-8 h-8 bg-amber-500 text-black rounded-full font-bold text-sm flex-shrink-0 mt-0.5">9</span><div class="flex-1"><h3 class="text-lg font-bold text-white mb-2" style="margin-top:0">Bitcoin can't be regulated — it's transcended</h3><p class="text-gray-300 leading-relaxed mb-2">El Salvador operated in a regulatory vacuum: opacity, benefit for the president's inner circle, IMF intervention. Praia Bitcoin tried to register as a 'Community Bitcoin Bank' and the government rejected it. But the lesson isn't 'we need better regulation' — it's that Bitcoin, by design, cannot be regulated by states. It's transparent (every transaction is public) but ungovernable (no one can censor a transaction). The real question is: how do you fund public goods without coercive taxes? The answer lies in community autonomy: impact investments decided by consent within each circle, transparent community funds on the blockchain, and direct accountability between neighbors — not between citizen and bureaucrat.</p><span class="text-xs text-emerald-400/70 italic">↳ El Salvador, Praia Bitcoin</span></div></div></div><div class="lesson-card bg-[#071510] rounded-xl p-5 border border-emerald-800/50 mb-4"><div class="flex items-start gap-3"><span class="inline-flex items-center justify-center w-8 h-8 bg-amber-500 text-black rounded-full font-bold text-sm flex-shrink-0 mt-0.5">10</span><div class="flex-1"><h3 class="text-lg font-bold text-white mb-2" style="margin-top:0">The 'restocking problem' is real</h3><p class="text-gray-300 leading-relaxed mb-2">Afribit in Kibera (Nairobi) faces this daily: a merchant accepts sats for tomatoes, but their supplier doesn't accept sats. They need to convert to Kenyan shillings for inventory. The solution isn't purism — it's pragmatic integration. Tools like Tando allow M-PESA conversion while the network grows. Let the merchant convert what they need; the pressure is to need less conversion over time.</p><span class="text-xs text-emerald-400/70 italic">↳ Afribit</span></div></div></div><div class="lesson-card bg-[#071510] rounded-xl p-5 border border-emerald-800/50 mb-4"><div class="flex items-start gap-3"><span class="inline-flex items-center justify-center w-8 h-8 bg-amber-500 text-black rounded-full font-bold text-sm flex-shrink-0 mt-0.5">11</span><div class="flex-1"><h3 class="text-lg font-bold text-white mb-2" style="margin-top:0">Mining is scaffolding, not destination</h3><p class="text-gray-300 leading-relaxed mb-2">Gridless in Zambia understands this: when the Zengamina hydroelectric plant connects to the national grid, the mining container will leave. Mining is temporary — it makes the plant viable while local demand grows. The goal is electrification and production, not perpetual mining. Radically different from Bitcoin Beach, where the tourist's departure = collapse.</p><span class="text-xs text-emerald-400/70 italic">↳ Gridless, Zengamina</span></div></div></div><div class="lesson-card bg-[#071510] rounded-xl p-5 border border-emerald-800/50 mb-4"><div class="flex items-start gap-3"><span class="inline-flex items-center justify-center w-8 h-8 bg-amber-500 text-black rounded-full font-bold text-sm flex-shrink-0 mt-0.5">12</span><div class="flex-1"><h3 class="text-lg font-bold text-white mb-2" style="margin-top:0">Bottom-up always beats top-down</h3><p class="text-gray-300 leading-relaxed mb-2">Every successful project started small and organic. Every failure started with a decree, an announcement at a Miami conference, or a millionaire donation with no community roots. El Salvador spent $329 million on a project 92% rejected. Bitcoin Lake grew from a $200 initial donation. The small seed takes root; the grand decree uproots.</p><span class="text-xs text-emerald-400/70 italic">↳ All cases</span></div></div></div>
<div class="prose max-w-none mt-6"><p><strong>The pattern is clear:</strong> a circular economy that depends on tourism depends on international flights, on the rich staying interested, and on there not being another pandemic — all of that has an expiration date. One based on food and energy production depends on people needing to eat and turn on lights — which is forever.</p></div>`,
        models: `<h1 class="text-2xl md:text-3xl font-bold text-amber-400 mb-2">Models that work: energy and production</h1>
<div class="prose max-w-none mb-6"><p>While tourist-based projects stagnated, a radically different model emerged in Africa and Canada. It's not based on convincing tourists, but on using mining to make renewable energy viable where there isn't enough local demand.</p><p><strong>The fundamental difference:</strong> the source of sats isn't a donor or a tourist — it's the community's own energy production.</p></div>
<div class="model-card bg-[#071510] rounded-xl p-6 border border-emerald-800/50 mb-6"><h2 class="text-xl font-bold text-amber-400 mb-1" style="margin-top:0">⚡ Gridless — Mining as energy subsidy</h2><p class="text-emerald-400 text-sm mb-4">Kenya, Malawi, Zambia · Since 2022 · Backed by Block (Jack Dorsey)</p><div class="prose max-w-none"><p>The Gridless model demonstrates that <strong>a Bitcoin circular economy is possible — but its base must be energy production, not tourism.</strong> Gridless uses Bitcoin as buyer of last resort for surplus renewable energy.</p><p>The mechanism: a rural community has a micro-hydro plant generating 1 MW but only consuming 200 kW. The remaining 80% is wasted — returned to the river. Gridless installs a container with ASIC miners that absorb the surplus. Mining revenue makes the entire plant viable, allowing electricity prices to drop for the community.</p><h3>Concrete results</h3><ul><li><strong>Murang'a, Kenya:</strong> A run-of-river micro-hydro generated more energy than 500 families could consume. Gridless installed miners to absorb the surplus. Result: electricity price dropped from $0.35 to $0.25/kWh for 2,000 people. The plant went from financially fragile to profitable. The sats generated by mining fund the plant's operation — the community benefits from cheaper electricity, they don't need to know anything about Bitcoin for the model to work.</li><li><strong>Bondo, Malawi:</strong> 1,800 households gained electricity that didn't exist before</li><li><strong>Zengamina, Zambia:</strong> Mining provides 30% of revenue for a plant serving 15,000 people</li></ul><h3>Adaptive design</h3><p>When the community needs energy (6 AM, 6 PM peaks), miners automatically scale down. When demand drops, miners scale up. <strong>The community always has priority.</strong></p><p><strong>Gridless plans to leave Zengamina.</strong> When the plant connects to the national grid, the container moves. Mining is temporary scaffolding — its success is measured by when it's no longer needed. They also develop <strong>"Jua Kali Miner"</strong> (open-source) so farmers can mine with solar surplus.</p></div></div><div class="model-card bg-[#071510] rounded-xl p-6 border border-emerald-800/50 mb-6"><h2 class="text-xl font-bold text-amber-400 mb-1" style="margin-top:0">🌿 BigBlock — Mining + food production</h2><p class="text-emerald-400 text-sm mb-4">Virunga (DR Congo) & Liouesso (Rep. Congo) · Since 2020</p><div class="prose max-w-none"><p>Sébastien Gouspillou installed hydroelectric mining in Virunga National Park — home to half the world's mountain gorillas. Tourism had collapsed (revenue fell 40%). Mining replaced it as the funding source.</p><h3>How does the money work?</h3><p>BigBlock operates the mining containers and <strong>pays the hydroelectric plant operator for the electricity consumed.</strong> That payment is what makes the plant viable and allows the electrical grid to expand. The mined bitcoins go to BigBlock as a company, which sells them to cover operational costs, local salaries, equipment maintenance, and reinvestment. Virunga Park also operates 3 of its own containers, whose bitcoins go directly to fund park conservation. In the ideal future model, the community itself would operate the mining — the sats would stay in local hands.</p><h3>The key innovation: productive heat</h3><p><strong>Residual heat from miners dries cocoa and fruits.</strong> This transforms a wasted byproduct into real food production.</p><h3>Results</h3><ul><li>10 containers (7 BigBlock, 3 park-owned), ~$500,000/year for conservation</li><li>15 full-time mining jobs + <strong>50-60 part-time in cocoa and fruit drying</strong></li><li>Potential to scale to 100-300 jobs with the drying operation</li><li>Liouesso, Rep. Congo: 20 MW plant using only 2-3 MW. BigBlock installed 12 MW. The provider can now extend lines to villages that <strong>never had electricity</strong></li></ul><blockquote>"When you give money to the electricity producer, you change the life of a region." — Gouspillou</blockquote></div></div><div class="model-card bg-[#071510] rounded-xl p-6 border border-emerald-800/50 mb-6"><h2 class="text-xl font-bold text-amber-400 mb-1" style="margin-top:0">🌱 Greenhouses + Mining — The heat model</h2><p class="text-emerald-400 text-sm mb-4">Manitoba (Canada), Sweden, Norway, Netherlands · Since 2024-2026</p><div class="prose max-w-none"><p>Manitoba (January 2026): 360 liquid-cooled miners whose residual heat (75°C+) heats tomato greenhouses at -30°C. 90% of electricity is recovered as useful heat, at $0.035/kWh.</p><h3>Evidence</h3><ul><li><strong>Sweden:</strong> 1 MW datacenter strengthens local food self-sufficiency by up to 8%</li><li><strong>ScienceDirect (2025):</strong> profits up to $1.5M/year for integrated greenhouses</li><li><strong>Manitoba:</strong> aquaponics — lettuce + 800 Arctic char, heated by ASICs</li><li><strong>Norway:</strong> 600 kW provides heat for 300m² greenhouse at -30°C</li><li><strong>Netherlands:</strong> BitcoinBloem — tulips heated by miners</li></ul><p><strong>Mining can be the cheapest heat source for food production in cold climates.</strong> Double return from the same energy.</p></div></div><div class="model-card bg-[#071510] rounded-xl p-6 border border-emerald-800/50 mb-6"><h2 class="text-xl font-bold text-amber-400 mb-1" style="margin-top:0">🌍 Green Africa Mining Alliance</h2><p class="text-emerald-400 text-sm mb-4">Kenya, Congo, Ethiopia, Zambia · Since 2024</p><div class="prose max-w-none"><p>Operational alliance: Gridless and Sukuma Ventures (Kenya), BigBlock (Congo), QRB (Ethiopia — generated $200M+), Quantum Hash (Zambia), Trojan Mining (trains youth).</p><h3>Continental numbers</h3><ul><li>Africa: <strong>300+ GW of untapped hydroelectric potential</strong> (IRENA)</li><li><strong>65%+ of mini-grids aren't commercially viable</strong> — they depend on subsidies</li><li>KenGen (Kenya) officially invited miners to use abundant geothermal</li><li>Ethiopia: electricity at $0.0314/kWh</li></ul><p>Bitcoin mining closes the gap. <strong>It's not the destination — it's the bridge.</strong></p></div></div><div class="model-card bg-[#071510] rounded-xl p-6 border border-emerald-800/50 mb-6"><h2 class="text-xl font-bold text-amber-400 mb-1" style="margin-top:0">📊 Global mining context</h2><p class="text-emerald-400 text-sm mb-4">Data as of mid-2025</p><div class="prose max-w-none"><ul><li><strong>Total consumption:</strong> ~168 TWh/year (Cambridge)</li><li><strong>Renewables:</strong> 52% (up from ~30% in 2022)</li><li><strong>Texas:</strong> miners as "shock absorbers" — they switch off during peaks to stabilize the grid (Riot earned $31.7M in August 2023 just for switching off)</li><li><strong>Cornell:</strong> pre-commercial mining could generate $47M for 32 renewable projects in Texas</li></ul></div></div>
<div class="prose max-w-none mt-4"><p><strong>The emerging pattern:</strong> where tourism injects sats from outside and creates dependency, mining generates sats from within using local resources. Where mining only generates sats, heat reuse adds food production to the cycle. The source of value is the community's own energy — not a visitor's wallet.</p></div>`,
        blueprint: `<h1 class="text-2xl md:text-3xl font-bold text-amber-400 mb-2">The blueprint: 4 phases</h1>
<div class="prose max-w-none mb-6"><p>If we had to design a new Bitcoin circular economy experiment from scratch, based exclusively on evidence, these are the four phases.</p><blockquote>The question isn't "where is Bitcoin accepted?" but "what does the community produce?"</blockquote></div>
<div class="phase-line"><div class="flex items-center gap-3 mb-3"><span class="inline-flex items-center justify-center w-10 h-10 bg-emerald-600 text-white rounded-full font-bold text-lg flex-shrink-0">1</span><div><h3 class="text-xl font-bold text-white" style="margin:0;color:#fff">Energy</h3><p class="text-emerald-300 text-sm" style="margin:0">Make the plant viable with mining</p></div></div><div class="prose max-w-none"><p>Identify an underutilized renewable source: run-of-river hydro, solar with surplus, geothermal. Install mining as buyer of last resort. Mining revenue subsidizes cheap electricity for the community.</p><p><strong>Model:</strong> Gridless in Kenya/Malawi/Zambia.</p><p><strong>Requirements:</strong> Source with verifiable surplus. Agreement with operator. Adaptive software that prioritizes community. Local staff. Commitment that mining is temporary.</p></div></div><div class="phase-line"><div class="flex items-center gap-3 mb-3"><span class="inline-flex items-center justify-center w-10 h-10 bg-emerald-600 text-white rounded-full font-bold text-lg flex-shrink-0">2</span><div><h3 class="text-xl font-bold text-white" style="margin:0;color:#fff">Production</h3><p class="text-emerald-300 text-sm" style="margin:0">Cheap electricity + residual heat = local food</p></div></div><div class="prose max-w-none"><p>Use mining-subsidized electricity and ASIC heat for local food production: greenhouses, grain/fruit/cocoa drying, aquaponics, cold storage.</p><p><strong>Models:</strong> BigBlock drying cocoa in Virunga. Greenhouses in Manitoba. Aquaponics in Canada.</p><p><strong>The brutal advantage over tourism:</strong> food is consumed locally. There's no value leakage. You don't need a Berlin digital nomad to buy an açaí bowl.</p></div></div><div class="phase-line"><div class="flex items-center gap-3 mb-3"><span class="inline-flex items-center justify-center w-10 h-10 bg-emerald-600 text-white rounded-full font-bold text-lg flex-shrink-0">3</span><div><h3 class="text-xl font-bold text-white" style="margin:0;color:#fff">Circulation</h3><p class="text-emerald-300 text-sm" style="margin:0">Network density so sats don't leave</p></div></div><div class="prose max-w-none"><p>With local production + local consumption, sats circulate. Farmer → market → transporter → mechanic. Every link is real production.</p><p><strong>Pragmatism during the transition:</strong> Integrate with fiat for the "restocking problem" while the network grows. But the goal is clear: with the <a href="/energystandard/" style="color:#f7931a">Energy Standard</a> — where each product's value is measured by the real energy it cost to produce — fiat must be abandoned promptly. Real purchasing power lies with workers who produce energy and food, not with the central bank printing paper. Every merchant who stops needing to convert to fiat is another link of sovereignty.</p><p><strong>Concentrate in one location.</strong> Critical mass in a small radius before expanding.</p></div></div><div class="phase-line"><div class="flex items-center gap-3 mb-3"><span class="inline-flex items-center justify-center w-10 h-10 bg-emerald-600 text-white rounded-full font-bold text-lg flex-shrink-0">4</span><div><h3 class="text-xl font-bold text-white" style="margin:0;color:#fff">Sovereignty</h3><p class="text-emerald-300 text-sm" style="margin:0">Collective ownership of the means of production</p></div></div><div class="prose max-w-none"><p>When circular density is sufficient, the community collectively controls three pillars: <strong>the means of monetary issuance</strong> (Bitcoin nodes, mining), <strong>energy infrastructure</strong> (renewable plant, distribution), and <strong>the means of production</strong> (greenhouses, farmland, tools). Sats no longer need to leave.</p><p><strong>The fundamental difference:</strong> the source of sats isn't a donor or a tourist — it's the community's own energy production. What those sats buy isn't a service for visitors — it's local food. And the infrastructure that makes it possible doesn't belong to an external company — it belongs to those who operate it.</p><p>This is the real socialization of the means of production: not by state decree but by community construction. Not by confiscation but by creation. The workers who produce the energy, grow the food, and maintain the nodes are the legitimate owners — because they are the ones contributing real work.</p></div></div>
<div class="prose max-w-none mt-6">
<h2>Phase 4 tools</h2><h3>Community Land Trusts — land off the market</h3><p>Bitcoin Beach's worst problem was gentrification. The solution already exists: <strong>Community Land Trusts</strong> (CLTs) — community trusts that have existed since 1969. A nonprofit buys the land and holds it permanently. Residents own their homes but the land is never sold. If you leave, the house is resold at a regulated price.</p><p><strong>Evidence:</strong> 300+ CLTs in the US with 40,000+ units. The first was founded in Georgia by civil rights activists. In Scotland, 500,000+ acres collectively managed for 25,000+ residents. Champlain Housing Trust (Vermont, 1984). Lower default rates than the open market. For the circular economy: <strong>land can't be bought by speculators because it's not for sale.</strong></p><h3>Sociocracy — governance by consent</h3><p>How are decisions made? By sociocratic consent: a decision passes when no one has a reasoned objection. The community organizes in autonomous circles (energy, production, circulation, land). <strong>Buurtzorg</strong> (Netherlands) operates with 14,000+ people, zero managers, 900+ teams. If it works there, it works with 500 families.</p>
<h2>What remains to be solved</h2><p>We don't pretend this blueprint is complete. Open problems:</p><ul><li><strong>Initial investment:</strong> Panels, ASICs, greenhouses require capital. Mining pays back faster than selling electricity alone (3.5 vs 8.1 years per one study), but it's still a barrier for communities without credit access.</li><li><strong>Governance without a State:</strong> Bitcoin can't be regulated with traditional laws. Communities need their own mechanisms for funding public goods: impact investments decided by consent, transparent blockchain funds, accountability between neighbors.</li><li><strong>Halvings:</strong> Every 4 years the mining reward halves. Models must survive multiple halvings — depending increasingly on transaction fees and long-term appreciation.</li><li><strong>AI and computing power:</strong> AI data centers compete for the same cheap energy and cooling. This makes the transformation of the energy matrix urgent.</li></ul>
<h2>The thesis</h2><p>AI and Bitcoin are products of humanity's collective knowledge — not of any company or individual. Large Language Models (LLMs) don't exist without decades of public university research. Bitcoin doesn't exist without declassified cryptography, without the internet (DARPA project), without decades of cypherpunk work. They are fruits of the common tree. <strong>Privatizing them is illegitimate.</strong></p><p>The World Economic Forum proposes tokenizing all the world's assets — including physical ones. If everything is a token, everything is hackable by whoever has the most computing power. This generates a permanent war between factions for control of digital tokens: the continuation of financial warfare by other means.</p><p>Bitcoin is the exception: its security is thermodynamic, not computational. You can't hack it with a better algorithm — you need more energy than the entire network. That's why Bitcoin must be the global monetary base: <strong>it's the only system that resists an adversarial AI.</strong></p><p>But defense isn't enough. Just as we unify our monetary effort in a global social currency, we must unify knowledge and computing power in a <strong>just AI: open source, distributed governance, coded restrictions against surveillance and violence.</strong> Not a centralized AI — a network of AIs, like Bitcoin is a network of nodes. Collective ownership of the tools that can dominate the species — not for ideology, for survival.</p><p>Both issues — the global social currency and collective artificial intelligence — require the same thing: a <strong>planetary cooperation to transform the energy matrix</strong> (from fossil to renewable, from centralized to distributed), a <strong>radical transformation of governance</strong> (from nation-states to sociocracy of interconnected communities), and a <strong>transformation of our ethics with Nature</strong> (from extractivism to symbiosis). There is no just currency and no just intelligence on a plundered planet.</p></div>`,
        sociocracy: `<h1 class="text-2xl md:text-3xl font-bold text-amber-400 mb-2">Sociocracy: governing without states</h1>
<div class="prose max-w-none">
<p>All the evidence in this document points to communities that self-govern by producing energy and food. But the key question remains: <strong>how are decisions made when there's no boss, no mayor, no president?</strong></p><p>The answer already exists: <strong>sociocracy</strong>. And it has real evidence at massive scale.</p>
<h2>What is it?</h2><p>Sociocracy (from Latin <em>socius</em> — companion, and Greek <em>kratos</em> — governance) means "governance by those who associate together." The term dates to 1851. It was developed as a management system in the 1970s by Gerard Endenburg, a Dutch electrical engineer inspired by cybernetics.</p><p>Its core principle: <strong>consent</strong>. A decision passes when no one has a reasoned, irrefutable objection. It's not consensus (everyone agrees, which paralyzes). It's not majority (which ignores minorities). It's faster than both: if no one can demonstrate the proposal causes real harm, it's approved and tested. If it fails, it's adjusted.</p>
<h3>The 4 principles</h3><ul><li><strong>Consent:</strong> Decisions pass when there are no reasoned objections. An objection isn't "I don't like it" — it's "this causes demonstrable harm to the group's goal." This separates personal preferences from functional arguments.</li><li><strong>Circles:</strong> The organization is structured in nested autonomous circles, each with clear purpose and authority to self-organize. No pyramid — a network.</li><li><strong>Double linking:</strong> Each circle connected to the next by two people — one chosen by the upper circle, one by the lower. Information flows both ways, not just top-down.</li><li><strong>Election by consent:</strong> Roles are assigned by group consent. No candidacies or campaigns — open nominations, transparent reasoning.</li></ul>

<h2>The seed to dissolve borders</h2><p>Nation-states exist because they control three things: monetary issuance, the military, and access to land. Bitcoin eliminates the first. Distributed energy production erodes the second (without state dependence for energy, its coercive power weakens). Community Land Trusts challenge the third.</p><p>When self-sufficient communities in energy, food, and governance connect via Bitcoin — trading cocoa from Congo for medicine from India without banks, tariffs, or government permission — nation-states become irrelevant. We don't destroy them: <strong>we make them obsolete.</strong></p><p>Sociocracy is the governance protocol. Bitcoin is the economic protocol. Renewable energy is the material base. Together they make possible something never before technically viable: <strong>world peace and global cooperation without centralization of power.</strong></p>
<p class="mt-4">🔗 <a href="https://www.sociocracyforall.org/" target="_blank" class="text-emerald-400 hover:underline">Sociocracy For All — resources and training</a></p>
</div>`,
        praxis: `<h1 class="text-2xl md:text-3xl font-bold text-amber-400 mb-2">Praxis: the society of access</h1>
<div class="prose max-w-none">
<p>In <em>Star Trek</em>, the United Federation of Planets didn't abolish money by decree. It made it obsolete: when energy became practically unlimited (dilithium, antimatter, replicators), accumulating wealth lost its purpose. The economy reorganized around access to energy, not ownership of capital. Social status was measured by contribution, not accumulation.</p><p>We're not in the 24th century. But the direction is the same: <strong>make exclusive private property increasingly irrelevant through universal access to energy, food, and tools.</strong> Bitcoin isn't the destination — it's the nervous system that makes it possible during the transition.</p>
<h2>Philosophy: from having to using</h2><p>We don't want to replace property titles with tokens. We want to create a system where the question "who owns it?" is as absurd as asking "who owns the air?" Access is managed by reputation for responsible use and community consensus, not by transferable property rights.</p><p>This isn't state collectivism. It's a <strong>communism of flow:</strong> guaranteed access, responsible use, no property title.</p>
<h2>Housing: usufruct cooperatives</h2><p>Built collectively with BTC (cryptographic pools like Fedimint). Instead of a title or token, you receive the <strong>right to use a home while you contribute to maintenance.</strong> If you leave, you lose the right of use. You can't sell it. New member admission is by neighbors' consent — based on need and compatibility, not ability to pay.</p><p><strong>Real evidence:</strong> Community Land Trusts already operate with this logic. Over 300 in the US with 40,000+ units. Champlain Housing Trust (Vermont, co-founded 1984). In Scotland, 500,000+ acres for 25,000+ residents. Land permanently exits the speculative market.</p>

<h2>Land and food: collective custody</h2><p>A group uses a BTC fund to buy farmland and place it under an irrevocable trust that prohibits future sale. The land is dedicated to agroforestry and permaculture. Anyone in the community can work there and take food home. Surplus is exchanged or given away — not sold for speculation.</p><blockquote>"The land belongs to no one; it's for everyone who cares for it."</blockquote>

<h2>Governance by custom, not by police</h2><p>In a community of voluntarily cooperating individuals, there is no "government." There is custom, consent (sociocracy), and as a last resort, avoidance. If someone abuses the system — hoards, damages — the community simply stops interacting. Their cryptographic identity is isolated. No jail, no fine. In a world where survival depends on cooperation, social ostracism is the ultimate consequence.</p><p>For conflicts: <strong>restorative circles</strong> mediated by respected community members whose power is persuasive, not coercive.</p>
<blockquote>"We're not building a new property system. We're making property obsolete. We're not creating a new government. We're making government unnecessary. The future isn't a smart city. It's a global village of free people."</blockquote>
</div>`,
        liberation: `<h1 class="text-2xl md:text-3xl font-bold text-amber-400 mb-2">Economic disobedience</h1>

        ethics: `<h1 class="text-2xl md:text-3xl font-bold text-amber-400 mb-2">Ethics: the power of existing</h1>
<div class="prose max-w-none">
<p><strong>Ethics is the discipline that investigates what is good, what is just, and how we should live.</strong> It is not about rules imposed from outside, but about understanding which actions increase genuine well-being — our own and collective.</p>
<p>In Baruch Spinoza's <em>Ethics</em> (1677), the power of existing — the <em>conatus</em> — is the fundamental effort by which every being, and especially the human being, perseveres in their own being and seeks to increase their capacity to act and understand. For Spinoza, power is not a mere possibility, but the actual expression of the necessity of living: what is good is what increases the power to act; what is bad is what diminishes it.</p>
<p>Spinoza's ethics, set forth in <em>Ethics Demonstrated in Geometrical Order</em>, is based on understanding the causes of affects and passions in order to strengthen this power through the understanding of the laws of Nature.</p>
<h2>Monism and Nature</h2><p>God, Substance, and Nature are the same. Human power is a part of God's infinite power, though limited by external causes. There is no separation between the sacred and the material — everything is one and the same substance expressing itself in infinite ways.</p>
<h2>Immanent Ethics</h2><p>There is no good or evil pre-established by an external divinity. Goodness is measured by the expansion of the power of existing in the individual and in the community. Joy, knowledge, and cooperation increase power. Fear, superstition, and blind obedience diminish it.</p>
<h2>Freedom and Necessity</h2><p>True freedom is not the absence of determination, but the comprehension of natural necessity, which allows one to act according to reason and not be enslaved by passions. A community of free people, who cooperate because they understand that collective power surpasses individual power, is stronger than any empire founded on fear.</p>
<h2>Why living ethically is best for the individual</h2><p>Spinoza demonstrates — he does not preach, he demonstrates with axioms and propositions chained like theorems — that the human being who understands their affects and acts from reason experiences more joy, more freedom, and more power than one who lives dragged by passions they do not understand. It is not a moral sacrifice: it is a logical consequence. Those who cooperate are more powerful than those who compete. Those who understand are freer than those who obey. Ethics is not a duty — it is a real advantage.</p>
<h2>The geometrical order and Bitcoin</h2><p>Spinoza chose the geometrical method — definitions, axioms, propositions, demonstrations — because he wanted to build an ethics that did not depend on faith or authority, but on verifiable reason. Bitcoin operates with the same logic, its protocol does not depend on trust in a central bank nor on a politician's goodwill. It works because mathematics works. Just as Spinoza's ethics is sustained by axioms anyone can verify, Bitcoin is sustained by cryptography anyone can audit. A currency whose rules are transparent, verifiable, and immutable is a more ethical currency — because it cannot be manipulated by those who hold class privilege, the power of weapons, or the power of rhetoric.</p>
<p>The Common Chest operates from this principle: no one forces you to participate. You do it because you understand that the flow of energy between equals increases the power of all.</p>
<p>📖 <a href="https://www.ecosia.org/search?q=Spinoza+Ethics+complete+book+PDF" target="_blank" class="text-emerald-400 hover:underline">Search for Spinoza's "Ethics" online</a></p>
