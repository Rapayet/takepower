          <p>Para exibir as páginas, seu navegador carrega recursos de terceiros que, por esse simples fato, recebem seu IP e dados do seu navegador: Google Fonts (tipografias), Tailwind CSS (estilos, cdn.tailwindcss.com), cdnjs da Cloudflare (a biblioteca que desenha os códigos QR) e, para mostrar a potência da rede Bitcoin, blockchain.info e mempool.space. Não controlamos o que eles fazem com esses dados; consulte as políticas deles.</p>

          <h3>8. Livro público de movimentos</h3>
          <p>O Baú publica um livro aberto com todos os pagamentos que entram ou saem do seu nó Lightning: doações, depósitos, reivindicações, liquidez, despesas e retiradas. De cada pagamento é publicado somente isto: a <strong>hora</strong> (UTC, ao milissegundo), o <strong>tipo</strong>, o <strong>valor</strong>, a <strong>taxa</strong> e o <strong>hash do pagamento</strong> (ou, se o movimento ocorre na rede Bitcoin, o identificador da transação). Não são publicados seu IP, sua Lightning Address, a identidade do seu nó, faturas, descrições nem mensagens. Cada bloco inclui, isso sim, a chave pública do nó do próprio Baú (a mesma que qualquer fatura Lightning emitida pelo Baú já mostra): ela não é secreta, não dá acesso a nada e não identifica quem paga nem quem reivindica. O livro é uma lista de pagamentos, não de pessoas: não diz quem reivindicou nem quem doou.</p>
          <p>Mesmo assim, há três coisas que convém saber. Primeiro, quem tiver o hash do próprio pagamento (por exemplo, no comprovante da sua carteira) consegue encontrar essa linha no livro e, se você mostrar esse comprovante a outra pessoa, ela poderá ver que o pagamento foi seu. Segundo, a hora exata e o valor podem ser cruzados com o que alguém já saiba sobre você, por exemplo, que viu você reivindicar em certo horário. Terceiro, <strong>o que é publicado no livro não pode ser apagado nem corrigido</strong>: cada bloco fica encadeado ao anterior, copiado no GitHub e selado no Bitcoin (item 9). Se você nos pedir para apagar seus dados, poderemos remover o que está somente no nosso banco de dados, mas não o que já está no livro público nem em suas cópias.</p>
