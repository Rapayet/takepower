      observatoryContent: `
          <p class="text-gray-400 mb-6">Bitcoin is not just theory. Around the world, communities are building economies where Bitcoin circulates hand to hand — no exchanges, no banks, no intermediaries. These are some of the most significant experiments. None is perfect. All are brave.</p>
          <div class="space-y-6">
            <div class="bg-[#1a1a1a] border border-white/20 rounded-xl p-6">
              <h3 class="text-xl font-bold text-amber-400 mb-1">🏖️ Bitcoin Beach — El Zonte, El Salvador</h3>
              <p class="text-sm text-gray-500 mb-3">Since 2019 · The first Bitcoin circular economy in the world</p>
              <p class="text-gray-300">An anonymous Bitcoin donation to a coastal town of 3,000 started it all. Mike Peterson and Román Martínez built an ecosystem where over 500 families and 120 businesses use Bitcoin via Lightning Network for daily payments: electricity, lunches, salaries. The project directly inspired El Salvador to adopt Bitcoin as legal tender in September 2021 — the first country in the world to do so.</p>
              <p class="text-gray-400 mt-2"><strong>Challenges today:</strong> Severe gentrification — land prices multiplied and some founders accumulated properties. Many local merchants returned to cash. Real adoption among ordinary Salvadorans remains limited outside tourist zones.</p>
            </div>
            <div class="bg-[#1a1a1a] border border-white/20 rounded-xl p-6">
              <h3 class="text-xl font-bold text-amber-400 mb-1">🌴 Bitcoin Jungle — Uvita/Dominical, Costa Rica</h3>
              <p class="text-sm text-gray-500 mb-3">Since 2021 · 380+ merchants accepting Bitcoin</p>
              <p class="text-gray-300">Open-source project on the South Pacific coast. Unlike El Zonte, Costa Rica already has a stable banking system — the problem was payment friction for tourists and expats. They created their own wallet, integrated BTCPay Server, and got farmers' markets, marine conservation centers, and hardware stores to accept sats. 80% of users are Costa Rican.</p>
              <p class="text-gray-400 mt-2"><strong>Challenges today:</strong> Depends on Bitcoin tourism. Integration with SINPE (local banking system) reduces the incentive to hold Bitcoin without converting to colones. Operates as a nonprofit with no stable funding.</p>
            </div>
            <div class="bg-[#1a1a1a] border border-white/20 rounded-xl p-6">
              <h3 class="text-xl font-bold text-amber-400 mb-1">🏄 Bitcoin Ekasi — Mossel Bay, South Africa</h3>
              <p class="text-sm text-gray-500 mb-3">Since 2021 · African Bitcoin Circular Economy of the Year (2025)</p>
              <p class="text-gray-300">Born as an extension of The Surfer Kids, an NGO teaching surfing to township youth. All salaries are paid 100% in Bitcoin. 30+ merchants accept Lightning for basic goods. 16-year-olds run their own Lightning nodes. The model is being replicated in Zambia and Kenya.</p>
              <p class="text-gray-400 mt-2"><strong>Challenges today:</strong> Small scale (fewer than 50 active bitcoiners). Digital literacy barriers. Volatility disproportionately affects workers earning everything in Bitcoin who need to buy food daily.</p>
            </div>
            <div class="bg-[#1a1a1a] border border-white/20 rounded-xl p-6">
              <h3 class="text-xl font-bold text-amber-400 mb-1">🌊 Praia Bitcoin — Jericoacoara, Brazil</h3>
              <p class="text-sm text-gray-500 mb-3">Since 2021 · Brazil's first Bitcoin circular economy (closed Feb 2026)</p>
              <p class="text-gray-300">Fernando Motolese started with a 0.02 BTC donation in a tourist village with no ATMs. Installed nodes, point-of-sale machines, and distributed NFC cards to municipal school students. Received 1,300+ donations. Attempted to register as a "Community Bitcoin Bank" but the Brazilian government rejected the application.</p>
              <p class="text-gray-400 mt-2"><strong>Challenges today:</strong> Closed operations in February 2026. Brazil has PIX (free instant government payment system), eliminating Lightning's convenience advantage. Lack of regulation was used as an excuse to deny institutional recognition.</p>
            </div>
            <div class="bg-[#1a1a1a] border border-white/20 rounded-xl p-6">
              <h3 class="text-xl font-bold text-amber-400 mb-1">🏔️ Bitcoin Lake — Panajachel, Guatemala</h3>
              <p class="text-sm text-gray-500 mb-3">Since 2022 · Bitcoin + environmental cleanup</p>
              <p class="text-gray-300">Patrick Melder brought the model to Lake Atitlán. Unlike other projects, it uses Bitcoin mining with recycled cooking oil to generate income and clean the lake simultaneously. 60+ merchants accept Bitcoin, 90% without prior banking access. The local school was the first in Guatemala to receive the "Mi Primer Bitcoin" course.</p>
              <p class="text-gray-400 mt-2"><strong>Challenges today:</strong> Weak electrical infrastructure and cash dependency. The circular economy hasn't extended to B2B (business to business). 60% of Guatemala's population lacks banking access — the opportunity is immense, but the adoption curve is slow.</p>
            </div>
            <div class="bg-[#1a1a1a] border border-white/20 rounded-xl p-6">
              <h3 class="text-xl font-bold text-amber-400 mb-1">🏝️ Bitcoin Island — Boracay, Philippines</h3>
              <p class="text-sm text-gray-500 mb-3">Since 2022 · Tourism + remittances</p>
              <p class="text-gray-300">120+ businesses accept Bitcoin via Lightning, powered by the Pouch wallet. The approach combines tourism with the massive Filipino remittance market ($35 billion/year) where traditional fees consume up to 7%. Highest density of Bitcoin-accepting merchants outside El Salvador.</p>
              <p class="text-gray-400 mt-2"><strong>Challenges today:</strong> Depends on a single company (Pouch). Adoption driven by tourism rather than local need. Volatility as an obstacle for local workers.</p>
            </div>
            <div class="bg-[#1a1a1a] border border-white/20 rounded-xl p-6">
              <h3 class="text-xl font-bold text-amber-400 mb-1">🌍 Afribit — Kibera/Nairobi, Kenya</h3>
              <p class="text-sm text-gray-500 mb-3">Since 2024 · 200+ merchants in one of Africa's largest informal settlements</p>
              <p class="text-gray-300">Ronnie Mdawida transformed Kibera into a circular economy with 200+ merchants accepting sats for basic needs: food, water, washrooms. Integration with M-PESA through tools like Tando allows merchants to convert back to local currency, solving the "restocking problem."</p>
              <p class="text-gray-400 mt-2"><strong>Challenges today:</strong> Extreme poverty makes any volatility devastating. Direct competition with M-PESA. Sustainability depends on external donations.</p>
            </div>
          </div>
          <div class="mt-8 p-6 bg-[#111] border border-amber-400/30 rounded-xl">
            <h3 class="text-amber-400 font-bold text-lg mb-3">📡 Federation of Bitcoin Circular Economies (FBCE)</h3>
            <p class="text-gray-300">In 2024, Bitcoin Beach co-founded with Bitcoin Ekasi and other projects the <strong>FBCE</strong> — a global network that connects, funds, and advises circular economies in 19+ countries. In two rounds, they distributed grants to 42 projects. The main lesson: <strong>focus on a specific location and achieve critical mass there before expanding</strong>. Dispersed adoption doesn't work — density does.</p>
            <p class="text-gray-400 mt-2">These experiments demonstrate that Bitcoin can work as everyday money. They also demonstrate there are no shortcuts: education, infrastructure, patience, and the honesty to acknowledge what doesn't work are all required. <strong>A circular economy isn't decreed — it's built, transaction by transaction.</strong></p>
          </div>
        `,
      navGlossary: "Glossary",
        glossaryTitle: "Glossary",
        glossarySubtitle: "Key terms to understand Bitcoin, decentralization, and the paradigm shift.",
        glossaryContent: `
          <div class="columns-1 md:columns-2 gap-4 space-y-4">
            <div class="break-inside-avoid bg-[#1a1a1a] rounded-xl p-4 border border-white/20 hover:border-white/40 transition"><h3 class="text-cyan-400 font-bold">ASIC</h3><p class="text-gray-400 text-sm mt-1">Application-Specific Integrated Circuit. Hardware designed exclusively for Bitcoin mining.</p></div>
            <div class="break-inside-avoid bg-[#1a1a1a] rounded-xl p-4 border border-white/20 hover:border-white/40 transition"><h3 class="text-cyan-400 font-bold">Ajurí</h3><p class="text-gray-400 text-sm mt-1">Collective work practice of the Tikuna peoples of the Amazon. The community gathers voluntarily to rebuild houses, clear land, or prepare harvests. No one forces, no one charges. Cooperation as method.</p></div>
            <div class="break-inside-avoid bg-[#1a1a1a] rounded-xl p-4 border border-white/20 hover:border-white/40 transition"><h3 class="text-cyan-400 font-bold">Biocentrism</h3><p class="text-gray-400 text-sm mt-1">Ethical perspective recognizing intrinsic value in all life forms. A biocentric economy would measure wealth in ecosystem health, not capital accumulation.</p></div>
            <div class="break-inside-avoid bg-[#1a1a1a] rounded-xl p-4 border border-white/20 hover:border-white/40 transition"><h3 class="text-cyan-400 font-bold">Bitcoin</h3><p class="text-gray-400 text-sm mt-1">Decentralized consensus technology and monetary system created in 2009.</p></div>
            <div class="break-inside-avoid bg-[#1a1a1a] rounded-xl p-4 border border-white/20 hover:border-white/40 transition"><h3 class="text-cyan-400 font-bold">Blockchain</h3><p class="text-gray-400 text-sm mt-1">Public, immutable record of all transactions. Each block cryptographically linked to the previous.</p></div>
            <div class="break-inside-avoid bg-[#1a1a1a] rounded-xl p-4 border border-white/20 hover:border-white/40 transition"><h3 class="text-cyan-400 font-bold">Climate adaptation</h3><p class="text-gray-400 text-sm mt-1">Strategies to adjust systems to climate change. Requires massive, rapid, direct financial flows.</p></div>
            <div class="break-inside-avoid bg-[#1a1a1a] rounded-xl p-4 border border-white/20 hover:border-white/40 transition"><h3 class="text-cyan-400 font-bold">Disobedience</h3><p class="text-gray-400 text-sm mt-1">A virtue that demonstrates individual freedom and the sovereignty of one’s inner conscience. Disobeying an unjust law is not a crime — it is an act of conscience. Thoreau went to jail for refusing to fund war and slavery. Every deep social transformation began with someone who said “no.” Blind obedience is servitude; reasoned disobedience is the first act of a free person.</p></div>
            <div class="break-inside-avoid bg-[#1a1a1a] rounded-xl p-4 border border-white/20 hover:border-white/40 transition"><h3 class="text-cyan-400 font-bold">Cooperation</h3><p class="text-gray-400 text-sm mt-1">Coordinated action toward shared goals. Evolutionary biology shows cooperation — not competition — is the dominant force in complex system evolution.</p></div>
            <div class="break-inside-avoid bg-[#1a1a1a] rounded-xl p-4 border border-white/20 hover:border-white/40 transition"><h3 class="text-cyan-400 font-bold">Crypto</h3><p class="text-gray-400 text-sm mt-1">Short for cryptography/cryptocurrency. Most "cryptos" are speculative tokens without real decentralization or proof of work.</p></div>
            <div class="break-inside-avoid bg-[#1a1a1a] rounded-xl p-4 border border-white/20 hover:border-white/40 transition"><h3 class="text-cyan-400 font-bold">Direct action</h3><p class="text-gray-400 text-sm mt-1">Acting on a problem rather than delegating to an authority. In economics, exchanging value directly between people.</p></div>
            <div class="break-inside-avoid bg-[#1a1a1a] rounded-xl p-4 border border-white/20 hover:border-white/40 transition"><h3 class="text-cyan-400 font-bold">Ecosocialism</h3><p class="text-gray-400 text-sm mt-1">Fusing ecological and socialist critiques. Infinite accumulation on a finite planet as the root of crisis.</p></div>
            <div class="break-inside-avoid bg-[#1a1a1a] rounded-xl p-4 border border-white/20 hover:border-white/40 transition"><h3 class="text-cyan-400 font-bold">Halving</h3><p class="text-gray-400 text-sm mt-1">Every ~4 years mining reward halves. Ensures max 21 million BTC.</p></div>
            <div class="break-inside-avoid bg-[#1a1a1a] rounded-xl p-4 border border-white/20 hover:border-white/40 transition"><h3 class="text-cyan-400 font-bold">Hashpower</h3><p class="text-gray-400 text-sm mt-1">Total computing power in mining. Higher = more secure.</p></div>
            <div class="break-inside-avoid bg-[#1a1a1a] rounded-xl p-4 border border-white/20 hover:border-white/40 transition"><h3 class="text-cyan-400 font-bold">Holocracy</h3><p class="text-gray-400 text-sm mt-1">Organizational system distributing authority across autonomous, interconnected circles. Tensions detected by any member drive change. Complex order emerges without centralized control.</p></div>
            <div class="break-inside-avoid bg-[#1a1a1a] rounded-xl p-4 border border-white/20 hover:border-white/40 transition"><h3 class="text-cyan-400 font-bold">Holobiont</h3><p class="text-gray-400 text-sm mt-1">Organism composed of host and all symbiotic microorganisms. Each individual is a social holobiont in symbiosis with community and biosphere.</p></div>
            <div class="break-inside-avoid bg-[#1a1a1a] rounded-xl p-4 border border-white/20 hover:border-white/40 transition"><h3 class="text-cyan-400 font-bold">Lightning Network</h3><p class="text-gray-400 text-sm mt-1">Payment layer on Bitcoin for instant, near-free transactions.</p></div>
            <div class="break-inside-avoid bg-[#1a1a1a] rounded-xl p-4 border border-white/20 hover:border-white/40 transition"><h3 class="text-cyan-400 font-bold">Mining</h3><p class="text-gray-400 text-sm mt-1">Computers validate transactions by transforming energy into cryptographic security.</p></div>
            <div class="break-inside-avoid bg-[#1a1a1a] rounded-xl p-4 border border-white/20 hover:border-white/40 transition"><h3 class="text-cyan-400 font-bold">Mycelium</h3><p class="text-gray-400 text-sm mt-1">Underground fungal network connecting trees and plants, distributing nutrients and warning signals. Nature's internet: decentralized, without hierarchy, based on cooperation.</p></div>
            <div class="break-inside-avoid bg-[#1a1a1a] rounded-xl p-4 border border-white/20 hover:border-white/40 transition"><h3 class="text-cyan-400 font-bold">Mutual aid</h3><p class="text-gray-400 text-sm mt-1">Voluntary cooperation for reciprocal benefit. Central in Kropotkin: survival depends on collaboration. Horizontal solidarity, not vertical charity.</p></div>
            <div class="break-inside-avoid bg-[#1a1a1a] rounded-xl p-4 border border-white/20 hover:border-white/40 transition"><h3 class="text-cyan-400 font-bold">Node</h3><p class="text-gray-400 text-sm mt-1">Computer storing the full blockchain and verifying all transactions.</p></div>
            <div class="break-inside-avoid bg-[#1a1a1a] rounded-xl p-4 border border-white/20 hover:border-white/40 transition"><h3 class="text-cyan-400 font-bold">P2P</h3><p class="text-gray-400 text-sm mt-1">Peer-to-peer. Direct transactions without intermediaries.</p></div>
            <div class="break-inside-avoid bg-[#1a1a1a] rounded-xl p-4 border border-white/20 hover:border-white/40 transition"><h3 class="text-cyan-400 font-bold">Private key</h3><p class="text-gray-400 text-sm mt-1">Secret number giving control over your bitcoins. Must never be shared.</p></div>
            <div class="break-inside-avoid bg-[#1a1a1a] rounded-xl p-4 border border-white/20 hover:border-white/40 transition"><h3 class="text-cyan-400 font-bold">Proof of Work</h3><p class="text-gray-400 text-sm mt-1">Miners prove they spent energy to validate. Energy → truth.</p></div>
            <div class="break-inside-avoid bg-[#1a1a1a] rounded-xl p-4 border border-white/20 hover:border-white/40 transition"><h3 class="text-cyan-400 font-bold">Responsibility</h3><p class="text-gray-400 text-sm mt-1">All power carries a duty. Sovereignty is only legitimate when exercised with responsibility toward community and ecosystem. Power without ethics is oppression.</p></div>
            <div class="break-inside-avoid bg-[#1a1a1a] rounded-xl p-4 border border-white/20 hover:border-white/40 transition"><h3 class="text-cyan-400 font-bold">Universal Basic Income</h3><p class="text-gray-400 text-sm mt-1">Unconditional periodic income for every person, with no work requirements or means testing. Guarantees survival so that work is voluntary, not coercion.</p></div>
            <div class="break-inside-avoid bg-[#1a1a1a] rounded-xl p-4 border border-white/20 hover:border-white/40 transition"><h3 class="text-cyan-400 font-bold">Satoshi (sat)</h3><p class="text-gray-400 text-sm mt-1">Smallest Bitcoin unit. 1 BTC = 100,000,000 sats.</p></div>
            <div class="break-inside-avoid bg-[#1a1a1a] rounded-xl p-4 border border-white/20 hover:border-white/40 transition"><h3 class="text-cyan-400 font-bold">Seed phrase</h3><p class="text-gray-400 text-sm mt-1">12/24 words to recover a wallet. Store physically, offline.</p></div>
            <div class="break-inside-avoid bg-[#1a1a1a] rounded-xl p-4 border border-white/20 hover:border-white/40 transition"><h3 class="text-cyan-400 font-bold">Self-custody</h3><p class="text-gray-400 text-sm mt-1">Holding your own private keys. "Your keys, your coins."</p></div>
            <div class="break-inside-avoid bg-[#1a1a1a] rounded-xl p-4 border border-white/20 hover:border-white/40 transition"><h3 class="text-cyan-400 font-bold">Sociocracy</h3><p class="text-gray-400 text-sm mt-1">Governance system based on consent: a decision passes when no one has a substantiated objection. Organizes the community in autonomous circles with double links between them.</p></div>
            <div class="break-inside-avoid bg-[#1a1a1a] rounded-xl p-4 border border-white/20 hover:border-white/40 transition"><h3 class="text-cyan-400 font-bold">Systems theory</h3><p class="text-gray-400 text-sm mt-1">Scientific framework studying emergent properties of interconnected wholes. A system is more than the sum of its parts. Societies, ecosystems, and decentralized networks are complex systems.</p></div>
            <div class="break-inside-avoid bg-[#1a1a1a] rounded-xl p-4 border border-white/20 hover:border-white/40 transition"><h3 class="text-cyan-400 font-bold">Thermodynamics</h3><p class="text-gray-400 text-sm mt-1">Science of energy transformations. Universal, inviolable laws. Any honest economic system must obey thermodynamics — infinite money violates it.</p></div>
            <div class="break-inside-avoid bg-[#1a1a1a] rounded-xl p-4 border border-white/20 hover:border-white/40 transition"><h3 class="text-cyan-400 font-bold">UTXO</h3><p class="text-gray-400 text-sm mt-1">Unspent Transaction Output. Bitcoin's fundamental accounting unit.</p></div>

        introTitle: "O que é Bitcoin?",
        introContent: `
          <p><strong>Bitcoin é uma tecnologia de consenso</strong> que permite que pessoas de todo o mundo troquem valor sem intermediários. Não é apenas dinheiro digital; é uma nova forma de organização social baseada em matemática e energia.</p>
          
          <p>Podemos afirmar que Bitcoin é a síntese prática do conflito dialético entre capitalismo e comunismo. Não é nem um mercado livre desregulado nem um planejamento central coletivista. Transcende a falsa dicotomia entre indivíduo e coletivo, preservando o que é válido de ambas as propostas, enquanto rejeita as patologias de seus extremos: a acumulação centralizada de capital, a coerção estatal, a vigilância institucional e a exploração sistêmica. Sua legitimidade nasce de baixo para cima, da participação voluntária, não do decreto hierárquico. Como no <a href="/natura/" style="color: inherit; text-decoration: none; cursor: text;">panteísmo</a>, a autoridade e a verdade não residem "lá em cima", mas "aqui dentro", em cada participante e na rede como um todo.</p>
          
          <h3>O essencial</h3>
          <ul>
            <li><strong>Descentralizado:</strong> Nenhum banco central, governo ou empresa o controla. A rede é mantida por milhares de computadores (chamados nós) distribuídos pelo mundo. Cada nó tem uma cópia completa de todas as transações que ocorreram desde 2009.</li>
            <li><strong>Finito:</strong> Como os recursos da Terra, Bitcoin é finito—só existirão 21 milhões de bitcoins, nunca mais. Isso significa que há um risco real de escassez se não assumirmos a responsabilidade de cuidá-los. Este limite é garantido matematicamente pelo código que todos os participantes executam.</li>
            <li><strong>Transparente:</strong> Todas as transações são públicas e verificáveis por qualquer pessoa. Não há contas secretas ou privilégios ocultos. Ninguém pode falsificar o registro.</li>
            <li><strong>Aberto:</strong> Bitcoin é <strong>código aberto</strong> (open source), o que significa que qualquer pessoa pode ler, auditar e propor melhorias ao software. Sem segredos nem portas dos fundos. Milhares de programadores em todo o mundo revisaram cada linha de código. Esta transparência técnica é a base da confiança: você não precisa acreditar em ninguém, pode verificar você mesmo.</li>
            <li><strong>Energia social:</strong> Cada bitcoin representa trabalho computacional real—energia transformada em valor digital. Lembre-se que a energia não é criada nem destruída, apenas transformada. Bitcoin é precisamente essa transformação, ajustada matematicamente para preservar valor através do tempo. Por isso dizemos que <strong>Bitcoin é energia social congelada no tempo</strong>.</li>
            <li>📖 Para aprofundar: <a href="https://dergigi.com/2021/01/14/bitcoin-is-time/" target="_blank" class="text-emerald-400 hover:underline">"Bitcoin is Time" — Gigi</a></li>
          </ul>
          
          <h3>Como funciona?</h3>
          <p>Imagine um livro-razão gigante que todos podem ler, mas ninguém pode apagar ou falsificar. Este livro é chamado de <strong>blockchain</strong> (cadeia de blocos). A cada 10 minutos aproximadamente, uma nova página (bloco) é adicionada com as últimas transações.</p>
          
          <p>Para adicionar uma página, computadores de todo o mundo competem resolvendo um problema matemático complexo. O primeiro a resolver ganha o direito de escrever a página e recebe novos bitcoins como recompensa. Este processo é chamado de <strong>mineração</strong>.</p>
          
          <p>Mas a mineração não é como extrair ouro—é mais como votar com energia. Quanto mais energia você contribui para a rede, mais peso tem seu voto para validar transações. É um sistema onde a honestidade é mais lucrativa que a trapaça, porque trapacear exigiria mais energia do que jogar limpo.</p>
          
          <p>Como qualquer forma de dinheiro, Bitcoin tem utilidade enquanto as pessoas confiam na comunidade que o sustenta e enquanto funciona como meio de troca. A diferença é que essa confiança não está depositada em um banco ou governo, mas em uma prova criptográfica verificada por milhões de voluntários.</p>
          
          <h3>Hashpower: A segurança matemática</h3>
          <p>A segurança do Bitcoin não depende de guardas armados nem de cofres de aço, mas de matemática pura. O coração desta segurança é a <strong>prova de trabalho</strong> (Proof of Work), que funciona assim:</p>
          
          <p>Cada bloco de transações deve incluir um número especial chamado <strong>nonce</strong>. Os mineradores testam milhões de nonces por segundo até encontrar um que, ao ser combinado com os dados do bloco e passado pelo algoritmo SHA-256, produza um <strong>hash</strong> (uma impressão digital de 256 bits) que comece com certa quantidade de zeros. Encontrar este hash é extraordinariamente difícil—requer trilhões de tentativas—mas verificar que está correto é instantâneo. Esta assimetria é a chave: muito trabalho para criar, fácil de verificar.</p>
          
          <p>O <strong>hashpower</strong> é a medida do poder computacional total dedicado a esta tarefa. Atualmente, a rede Bitcoin processa mais de 500 exahashes por segundo (500.000.000.000.000.000.000 cálculos por segundo). Para hackear a rede, um atacante precisaria superar todo esse poder combinado—algo que exigiria mais eletricidade do que países inteiros e um investimento de bilhões de dólares em hardware especializado.</p>
          
          <p><strong>Mineradores e Nós: papéis diferentes, mesma missão</strong></p>
          <ul>
            <li><strong>Mineradores:</strong> Competem para adicionar novos blocos à cadeia. Investem em hardware (ASICs) e eletricidade. Em troca, recebem novos bitcoins (atualmente 3,125 BTC por bloco) mais as taxas das transações incluídas. São eles que "escrevem" novas páginas no livro contábil.</li>
            <li><strong>Nós:</strong> Armazenam uma cópia completa de toda a blockchain e verificam que cada transação e bloco cumpra as regras. Não recebem recompensa econômica direta, mas são os guardiões das regras. Se um minerador tentar trapacear, os nós rejeitarão seu bloco. Qualquer pessoa pode rodar um nó do seu computador de casa.</li>
          </ul>
          <p>Esta separação de poderes é crucial: os mineradores propõem, os nós validam. Nenhum pode agir sem o outro. É um sistema de controles e equilíbrios onde a matemática substitui a necessidade de confiar em autoridades.</p>
          
          <p><strong>O Halving: escassez programada</strong></p>
          <p>A cada 210.000 blocos (aproximadamente a cada 4 anos), a recompensa que os mineradores recebem é reduzida pela metade. Este evento é chamado de <strong>halving</strong>. Começou em 50 BTC por bloco em 2009, depois 25 (2012), 12,5 (2016), 6,25 (2020), e atualmente 3,125 BTC (2024). Esta redução programada garante que nunca existirão mais de 21 milhões de bitcoins e que a emissão seja previsível e decrescente—o oposto das moedas fiat onde os bancos centrais podem imprimir sem limite. O halving é o mecanismo que torna Bitcoin o ativo mais escasso já criado pela humanidade.</p>
          
          <h3>A geometria oculta do Bitcoin</h3>
          <p>No coração de cada carteira de Bitcoin pulsa uma estrutura matemática elegante: a <strong>curva elíptica</strong>. Bitcoin utiliza uma curva específica chamada <strong>secp256k1</strong>, definida pela equação y² = x³ + 7 sobre um campo finito de números primos. Esta curva não foi escolhida aleatoriamente: seus parâmetros foram construídos de forma previsível e verificável, reduzindo a possibilidade de portas traseiras ocultas — diferente de outras curvas promovidas por agências governamentais.</p>
          
          <p>Quando você cria uma carteira de Bitcoin, o software gera uma <strong>chave privada</strong>: um número aleatório de 256 bits (um número com até 77 dígitos). A partir desta chave privada, realiza-se uma operação geométrica sobre a curva elíptica: um ponto conhecido chamado <strong>Ponto Gerador (G)</strong> é "somado" a si mesmo tantas vezes quanto sua chave privada indica. O resultado é sua <strong>chave pública</strong> — um novo ponto na curva.</p>
          
          <p>A segurança reside em uma assimetria fundamental chamada <strong>Problema do Logaritmo Discreto em Curvas Elípticas (ECDLP)</strong>: multiplicar um ponto por um número é computacionalmente fácil (seu computador faz em milissegundos), mas dado o resultado, deduzir quantas vezes foi multiplicado é computacionalmente impossível — nem todos os computadores do mundo trabalhando por milhões de anos poderiam resolvê-lo.</p>
          
          <p>Esta relação unidirecional é uma <strong>função de alçapão</strong> (<em>trapdoor function</em>). Você pode verificar que alguém possui a chave correta sem que ela seja revelada, mas não pode deduzi-la observando a chave pública. O campo primo sobre o qual a curva opera — um número primo próximo a 2²⁵⁶ — garante que o espaço de chaves possíveis seja astronomicamente vasto, oferecendo 128 bits de segurança efetiva.</p>
          
          <p><strong>É a ponte entre o físico e o digital:</strong> para "possuir" bitcoin, você deve possuir um número secreto que tem uma relação geométrica específica com a curva. A posse se torna conhecimento, não um objeto físico. É uma propriedade metafísica — você não tem bitcoins "guardados" em lugar algum; você tem o conhecimento matemático que permite movê-los.</p>
          
          <p>A curva elíptica secp256k1 é o coração oculto do Bitcoin. Não é apenas um detalhe técnico; é a pedra angular de sua segurança, seu esquema de propriedade e sua filosofia. Representa o triunfo de uma ordem matemática verificável e objetiva sobre sistemas de confiança subjetiva e hierárquica. Satoshi não inventou uma moeda; codificou um sistema de propriedade e verdade na linguagem mais fundamental que conhecemos: a matemática pura.</p>
          
          <p>Compreender isso é entender que Bitcoin não é apenas um ativo, mas a encarnação digital de um princípio filosófico: que a base de um sistema social justo e resistente à corrupção pode ser uma verdade imutável, aberta a todos e propriedade de ninguém.</p>
          
          <h3>Responsabilidade compartilhada: Suas chaves, seu dinheiro</h3>
          <p>No Bitcoin, não existem contas bancárias nem senhas que você possa recuperar ligando para o atendimento ao cliente. Seu acesso aos seus fundos depende de uma <strong>chave privada</strong>: um número secreto de 256 bits que lhe dá controle absoluto sobre seus bitcoins.</p>
          
          <p>Para tornar esta chave manejável, ela é representada como uma <strong>frase semente</strong> de 12 ou 24 palavras em uma ordem específica. Por exemplo: "árvore lua peixe montanha rio nuvem sol pedra vento mar terra fogo". Quem tiver essas palavras tem acesso total aos fundos. Não há como recuperá-las se forem perdidas—nem Satoshi, nem nenhum governo, nem ninguém pode ajudá-lo.</p>
          
          <p>Esta responsabilidade tem consequências reais. Estima-se que entre 3 e 4 milhões de bitcoins (aproximadamente 17-19% do total que existirá) estão perdidos para sempre: pessoas que esqueceram suas senhas, jogaram fora discos rígidos antigos, ou morreram sem deixar instruções. O caso mais famoso é o de James Howells, que em 2013 jogou fora um disco rígido com 8.000 BTC—hoje valeria centenas de milhões de dólares e continua enterrado em um aterro no País de Gales.</p>
          
          <p>Cada bitcoin perdido é energia social que deixa de circular, riqueza que se congela permanentemente. Por isso a responsabilidade no Bitcoin não é apenas pessoal, mas <strong>coletiva</strong>: cuidar de suas chaves é cuidar de um recurso finito que pertence à humanidade. A responsabilidade é fazer a energia fluir, não deixá-la estagnada—e muito menos perdê-la para sempre.</p>
          
          <h3>O ataque de 51%</h3>
          <p>Se um grupo de mineradores controlasse mais de 50% do poder computacional da rede, teoricamente poderiam manipular transações recentes. Isso é conhecido como <strong>ataque de 51%</strong>. Na prática, é economicamente irracional: custaria mais atacar a rede do que o que se poderia obter, e o atacante destruiria o valor de seu próprio investimento. Leia mais sobre este e outros riscos na seção de <strong>Riscos e desafios</strong>.</p>
          
          <h3>A menor unidade</h3>
          <p>Um bitcoin se divide em 100.000.000 de unidades chamadas <strong>satoshis</strong> (ou "sats"), em homenagem ao seu criador. São como os centavos do bitcoin, mas muito mais divisíveis. Isso permite micropagamentos que seriam impossíveis com dinheiro tradicional—você pode enviar o equivalente a frações de centavo para qualquer lugar do mundo.</p>
          <p class="text-center text-lg font-bold text-amber-400 my-4">1 BTC = 100.000.000 sats</p>
          
          <h3>Por que é diferente do dinheiro tradicional?</h3>
          <p>O dinheiro que usamos normalmente (dólares, euros, reais) é criado por bancos centrais que podem imprimir mais quando quiserem. Isso causa <strong>inflação</strong>: a cada ano seu dinheiro vale menos. Governos podem congelar contas, bancos podem negar serviços, e o sistema financeiro exclui bilhões de pessoas.</p>
          
          <p>Bitcoin inverte essa lógica: ninguém pode criar mais bitcoins do que o programado, ninguém pode congelar sua conta se você tiver suas chaves, e qualquer pessoa com um telefone pode participar da economia global. Por estar livre do controle dos Estados, Bitcoin devolve o poder às pessoas comuns para não serem peões em lutas de poder entre nações, corporações ou elites financeiras.</p>
          
          <h3>Escalabilidade: Lightning Network</h3>
          <p>Bitcoin pode processar aproximadamente 7 transações por segundo em sua camada base—suficiente para ser "ouro digital", mas insuficiente para substituir a Visa (que processa milhares por segundo). A solução não foi mudar o Bitcoin, mas construir uma segunda camada em cima: <strong>Lightning Network</strong>.</p>

        risksContent: `
          <h2>Centralização do hashpower</h2>
          <p>Embora Bitcoin seja descentralizado por design, a mineração se concentrou em dois sentidos: em <strong>pools de mineração</strong> (os 4 maiores controlam mais de 50% do hashrate) e <strong>geograficamente</strong> (a mineração migra para onde a eletricidade é mais barata).</p>
          <p>Em 2021, a China concentrava mais de 65% do hashrate global. Quando o governo proibiu a mineração, a rede perdeu metade do poder em semanas — mas se recuperou completamente em meses, com mineradores migrando para EUA, Cazaquistão, Rússia e Canadá. A rede provou ser antifrágil: cada golpe a torna mais distribuída.</p>
          <p>Cada minerador pode trocar de pool em minutos, limitando o poder real dos operadores. Mas se um governo pressionar os maiores pools, poderia influenciar temporariamente quais transações são processadas.</p>
          <p><strong>Por que importa?</strong> Bitcoin funciona melhor com hashpower distribuído entre muitos participantes em muitas jurisdições. A concentração do hashpower espelha a concentração do poder — e Bitcoin existe para combater exatamente isso.</p>

          <h2>Ataque de 51%</h2>
          <p>Se uma entidade controlar mais de 50% do poder computacional, teoricamente poderia reescrever blocos recentes e realizar <strong>gasto duplo</strong>. Porém:</p>
          <ul>
            <li>O custo é astronômico — bilhões em hardware e eletricidade.</li>
            <li>Manter o ataque custa ainda mais do que executá-lo.</li>
            <li>Um ataque bem-sucedido destruiria a confiança, colapsando o preço e a própria inversão do atacante.</li>
            <li>Os nós poderiam rejeitar os blocos do atacante com uma atualização de emergência.</li>
          </ul>
          <p>Risco teórico real, mas economicamente irracional. Nunca realizado em 16 anos. A ironia: quanto mais valioso Bitcoin se torna, mais caro — e portanto mais improvável — se torna atacá-lo.</p>

          <h2>Baleias e concentração de riqueza</h2>
          <p>Cerca de 2% dos endereços possuem mais de 90% dos bitcoins em circulação. Muitos pertencem a exchanges, fundos de investimento e mineradores iniciais.</p>
          <p>Essa concentração contradiz a promessa de democratização do dinheiro. Porém:</p>
          <ul>
            <li>Muitos endereços "grandes" são carteiras frias de exchanges custodiando fundos de milhões de usuários.</li>
            <li>A distribuição melhora com o tempo conforme mais pessoas adotam Bitcoin.</li>
            <li>Diferente do fiat, a concentração é visível e verificável.</li>
          </ul>
          <p><strong>Take Power</strong> existe para combater essa concentração: redistribuir sats a quem ainda não tem acesso.</p>

          <h2>O desafio da transição</h2>
          <p>Governos podem tentar proibir Bitcoin. Mas Bitcoin é <strong>desobediência civil codificada</strong>. Não pede permissão para existir. Se a adoção alcançar massa crítica, a regulação se torna tão inútil quanto tentar proibir a internet.</p>
          <p>Na fase atual de baixa adoção, restrições podem dificultar o acesso cotidiano. O verdadeiro desafio não é a regulação — é alcançar a massa crítica antes que as estruturas de poder possam reagir.</p>

          <h2>Conectividade</h2>
          <p>Sem internet não há Bitcoin. E <strong>um terço da humanidade ainda não tem acesso à internet</strong>. A infraestrutura para participar do Bitcoin depende de outra rede centralizada — provedores de telecomunicações e cabos submarinos controlados por corporações e governos.</p>
          <p>Existem avanços: transações Bitcoin por rádio, satélites (Blockstream Satellite transmite a blockchain completa), e redes mesh descentralizadas. Mas a soberania financeira digital requer soberania na conectividade. <strong>Não haverá liberdade financeira sem liberdade de comunicação.</strong></p>
          <p>Os que mais precisam de Bitcoin são os que têm menos acesso à infraestrutura para usá-lo.</p>

          <h2>Computação quântica</h2>
          <p>Computadores quânticos poderiam quebrar a criptografia que protege as chaves privadas. Mas não é um risco exclusivo do Bitcoin — <strong>é um risco para toda a civilização digital</strong>: bancos, comunicações militares, registros médicos.</p>
          <p>A comunidade já trabalha em algoritmos pós-quânticos. Mas o desafio real é: <strong>a apropriação da tecnologia quântica pela sociedade civil</strong>. Se apenas estados e corporações acessarem essa tecnologia, o desequilíbrio será devastador.</p>

          <h2>Volatilidade</h2>
          <p>Bitcoin segue extremamente volátil. Seu preço pode variar 20% em dias.</p>
          <p>Mas talvez estejamos medindo com a régua errada. Quando dizemos "Bitcoin é volátil", na verdade estamos dizendo que <strong>seu preço em dólares flutua</strong>. Mas o dólar mesmo perde valor pela inflação — estamos tão acostumados a medir tudo em dólares que não notamos que a régua está encolhendo.</p>
          <p>Medido em energia (megajoules), a volatilidade diminui significativamente. O <a href="/energy/" style="color: #f7931a;">Padrão Energético</a> propõe exatamente isso: medir valor em unidades de energia, não em moedas fiat.</p>

          <h2>Responsabilidade e ética</h2>
          <p><strong>"Suas chaves, suas moedas"</strong>. Perdeu a chave privada? Perdeu seus bitcoins para sempre. Estima-se que 3 a 4 milhões de bitcoins se perderam permanentemente.</p>
          <p>Mas a responsabilidade vai além da custódia. Soberania sobre seu dinheiro implica <strong>responsabilidade ética sobre como usá-lo</strong>.</p>
          <p>Pensemos nos animais. Durante milênios serviram para expandir nossa capacidade técnica. Graças a eles construímos civilizações. Mas em vez de honrar esse serviço, os transformamos em máquinas de produção industrial — sem assumir a responsabilidade de ser, como espécie, a mente do organismo Terra.</p>
          <p>Bitcoin nos dá poder novo. Mas poder sem ética é outra forma de opressão. A pergunta não é só <em>como guardo meus bitcoins?</em> mas <em>para que os uso? Contribuo para a redistribuição ou para a concentração? Sirvo à vida ou a exploro?</em></p>

          <h2>Reflexão final</h2>
          <p>Nenhuma tecnologia é perfeita. Bitcoin é uma mudança de paradigma viva. Conhecer seus riscos não enfraquece a proposta — a fortalece.</p>
          <p><strong>A honestidade é a base da confiança. E a confiança é a base do dinheiro.</strong></p>

          <div class="space-y-3">
            <div class="bg-[#1a1a1a] border border-white/20 rounded-xl overflow-hidden"><button onclick="this.nextElementSibling.classList.toggle('hidden');this.querySelector('span:last-child').textContent=this.nextElementSibling.classList.contains('hidden')?'+':'−'" class="w-full text-left p-4 flex justify-between items-center hover:bg-white/5 transition"><span class="font-bold text-emerald-400">Bitcoin é dinheiro de verdade?</span><span class="text-xl text-emerald-400">+</span></button><div class="hidden px-4 pb-4 text-gray-300"><p>Sim. É um registro digital descentralizado verificado por milhares de computadores. Desde 2009 funciona sem interrupção, sem empresa por trás, e sem que ninguém o tenha falsificado.</p></div></div>
            <div class="bg-[#1a1a1a] border border-white/20 rounded-xl overflow-hidden"><button onclick="this.nextElementSibling.classList.toggle('hidden');this.querySelector('span:last-child').textContent=this.nextElementSibling.classList.contains('hidden')?'+':'−'" class="w-full text-left p-4 flex justify-between items-center hover:bg-white/5 transition"><span class="font-bold text-emerald-400">Quem controla o Bitcoin?</span><span class="text-xl text-emerald-400">+</span></button><div class="hidden px-4 pb-4 text-gray-300"><p>Ninguém — e todos. Software de código aberto, mudanças por consenso. O sistema monetário mais democrático que já existiu. Mas isso implica algo crucial: <strong>não há ninguém a quem reclamar</strong>. Se perder suas chaves, perde seus bitcoins.</p></div></div>
                                    <div class="bg-[#1a1a1a] border border-white/20 rounded-xl overflow-hidden"><button onclick="this.nextElementSibling.classList.toggle('hidden');this.querySelector('span:last-child').textContent=this.nextElementSibling.classList.contains('hidden')?'+':'−'" class="w-full text-left p-4 flex justify-between items-center hover:bg-white/5 transition"><span class="font-bold text-emerald-400">Por que usar Bitcoin pessoa a pessoa (P2P)?</span><span class="text-xl text-emerald-400">+</span></button><div class="hidden px-4 pb-4 text-gray-300"><p>Bitcoin foi projetado para circular entre pessoas — entre trabalhadores, vizinhos, comunidades. <strong>Enquanto Bitcoin circular de mão em mão entre o povo, o poder econômico estará no povo.</strong> No momento em que você o deposita em um exchange, esse poder volta para as mesmas instituições. <strong>Não troque seus sats por dólares — encontre alguém que os aceite.</strong></p></div></div>
                        <div class="bg-[#1a1a1a] border border-white/20 rounded-xl overflow-hidden"><button onclick="this.nextElementSibling.classList.toggle('hidden');this.querySelector('span:last-child').textContent=this.nextElementSibling.classList.contains('hidden')?'+':'−'" class="w-full text-left p-4 flex justify-between items-center hover:bg-white/5 transition"><span class="font-bold text-emerald-400">Bitcoin é legal?</span><span class="text-xl text-emerald-400">+</span></button><div class="hidden px-4 pb-4 text-gray-300"><p>Importa? Bitcoin funciona com ou sem permissão. <strong>Não há servidor para desligar, nem empresa para fechar, nem CEO para prender.</strong> Milhares de nós em dezenas de países. <strong>A regulação não detém a adoção — apenas a desacelera temporariamente.</strong> Ninguém pôde proibir a imprensa, nem o rádio, nem a internet. Bitcoin é o próximo.</p></div></div>
            <div class="bg-[#1a1a1a] border border-white/20 rounded-xl overflow-hidden"><button onclick="this.nextElementSibling.classList.toggle('hidden');this.querySelector('span:last-child').textContent=this.nextElementSibling.classList.contains('hidden')?'+':'−'" class="w-full text-left p-4 flex justify-between items-center hover:bg-white/5 transition"><span class="font-bold text-emerald-400">Por que o Bitcoin acaba com a acumulação sem sentido?</span><span class="text-xl text-emerald-400">+</span></button><div class="hidden px-4 pb-4 text-gray-300"><p>Dinheiro fiat é impresso sem limite, incentivando acumulação. Os 21 milhões fixos de Bitcoin significam que <strong>você não precisa acumular para se proteger da inflação</strong>. Em vez de acumular por medo, pode <strong>circular por confiança</strong>. <strong>Bitcoin não proíbe a riqueza — elimina a necessidade patológica de acumulá-la.</strong></p></div></div>
                                    <div class="bg-[#1a1a1a] border border-white/20 rounded-xl overflow-hidden"><button onclick="this.nextElementSibling.classList.toggle('hidden');this.querySelector('span:last-child').textContent=this.nextElementSibling.classList.contains('hidden')?'+':'−'" class="w-full text-left p-4 flex justify-between items-center hover:bg-white/5 transition"><span class="font-bold text-emerald-400">Bitcoin não gasta energia demais?</span><span class="text-xl text-emerald-400">+</span></button><div class="hidden px-4 pb-4 text-gray-300"><p>A pergunta real: <strong>para que serve essa energia?</strong> Mais de 50% da mineração já usa energia renovável. Bitcoin incentiva a busca por energia barata, frequentemente renovável.</p></div></div>
            <div class="bg-[#1a1a1a] border border-white/20 rounded-xl overflow-hidden"><button onclick="this.nextElementSibling.classList.toggle('hidden');this.querySelector('span:last-child').textContent=this.nextElementSibling.classList.contains('hidden')?'+':'−'" class="w-full text-left p-4 flex justify-between items-center hover:bg-white/5 transition"><span class="font-bold text-emerald-400">Como o Bitcoin pode financiar a adaptação climática?</span><span class="text-xl text-emerald-400">+</span></button><div class="hidden px-4 pb-4 text-gray-300"><p>A adaptação climática requer transferência direta de recursos às comunidades vulneráveis — as que os bancos excluem. <strong>Bitcoin é a infraestrutura financeira que a adaptação climática precisa.</strong></p><p>Mas mais profundo: a adaptação climática requer que os países se coordenem — e a coordenação só é possível com paz. Bitcoin, como moeda neutra, pode ser a arquitetura financeira comum que permita essa cooperação. <strong>A paz não é um pré-requisito da mudança climática — é sua condição de possibilidade.</strong></p></div></div>
            <div class="bg-[#1a1a1a] border border-white/20 rounded-xl overflow-hidden"><button onclick="this.nextElementSibling.classList.toggle('hidden');this.querySelector('span:last-child').textContent=this.nextElementSibling.classList.contains('hidden')?'+':'−'" class="w-full text-left p-4 flex justify-between items-center hover:bg-white/5 transition"><span class="font-bold text-emerald-400">O que Bitcoin tem a ver com justiça social?</span><span class="text-xl text-emerald-400">+</span></button><div class="hidden px-4 pb-4 text-gray-300"><p>Mais de 1,7 bilhão de pessoas não têm conta bancária. Não por escolha — por exclusão. Bitcoin só precisa de um telefone com internet. <strong>Soberania financeira como direito humano, não como privilégio.</strong></p></div></div>
            <div class="bg-[#1a1a1a] border border-white/20 rounded-xl overflow-hidden"><button onclick="this.nextElementSibling.classList.toggle('hidden');this.querySelector('span:last-child').textContent=this.nextElementSibling.classList.contains('hidden')?'+':'−'" class="w-full text-left p-4 flex justify-between items-center hover:bg-white/5 transition"><span class="font-bold text-emerald-400">Bitcoin pode ser a moeda global?</span><span class="text-xl text-emerald-400">+</span></button><div class="hidden px-4 pb-4 text-gray-300"><p>Primeira moeda que cumpre todos os requisitos técnicos. Precisa coexistir como uma <strong>camada base neutra</strong>. <strong>A pergunta não é se pode — é quando a adotaremos.</strong></p></div></div>
            <div class="bg-[#1a1a1a] border border-white/20 rounded-xl overflow-hidden"><button onclick="this.nextElementSibling.classList.toggle('hidden');this.querySelector('span:last-child').textContent=this.nextElementSibling.classList.contains('hidden')?'+':'−'" class="w-full text-left p-4 flex justify-between items-center hover:bg-white/5 transition"><span class="font-bold text-emerald-400">Como começo com Bitcoin?</span><span class="text-xl text-emerald-400">+</span></button><div class="hidden px-4 pb-4 text-gray-300"><p>Não há um caminho único. Bitcoin é liberdade, e isso inclui a liberdade de escolher como entrar. Mas há princípios que ajudarão:</p><p><strong>1. Estude antes de agir.</strong> Você está lendo isso — bom começo. Não fique com uma única fonte. Busque outras vozes, outros projetos, outros pontos de vista. Desconfie de quem diga que só existe uma forma de fazer as coisas.</p><p><strong>2. Consiga uma carteira.</strong> Procure estas qualidades: código aberto, não custodial (você controla as chaves), compatível com Lightning Network, com backup por frase semente (12 ou 24 palavras). Desconfie de qualquer carteira que peça dados desnecessários, prometa rendimentos, ou não publique seu código. Comece com uma carteira quente (app no celular) para valores pequenos; migre para uma fria (dispositivo físico) quando lidar com valores maiores.</p><p><strong>3. Receba seus primeiros satoshis.</strong> A forma mais alinhada é recebê-los de outra pessoa: por um trabalho, uma venda, uma troca, ou através de projetos como Take Power. Também pode comprá-los P2P (pessoa a pessoa) sem intermediários.</p><p><strong>4. Use Bitcoin.</strong> Não acumule sem propósito. Envie, receba, pague, doe. Bitcoin faz sentido quando circula.</p><p><strong>5. Rode seu próprio nó</strong> (quando estiver pronto). Não é obrigatório, mas é o ato máximo de soberania: verificar por si mesmo que as regras estão sendo cumpridas.</p></div></div>
            <div class="bg-[#1a1a1a] border border-white/20 rounded-xl overflow-hidden"><button onclick="this.nextElementSibling.classList.toggle('hidden');this.querySelector('span:last-child').textContent=this.nextElementSibling.classList.contains('hidden')?'+':'−'" class="w-full text-left p-4 flex justify-between items-center hover:bg-white/5 transition"><span class="font-bold text-emerald-400">Como protejo meus bitcoins?</span><span class="text-xl text-emerald-400">+</span></button><div class="hidden px-4 pb-4 text-gray-300"><p>A rede Bitcoin nunca foi hackeada. O que foi hackeado — repetidamente — são as pessoas.</p><p><strong>Ameaças reais:</strong></p><ul><li><strong>Phishing:</strong> Sites ou mensagens falsas que imitam carteiras para roubar seus dados. Sempre verifique a URL.</li><li><strong>Golpes "duplique seus BTC":</strong> Ninguém pode duplicar seus bitcoins. Ninguém. Se alguém promete isso, está roubando.</li><li><strong>Engenharia social:</strong> Alguém que ganha sua confiança para que revele sua frase semente. Nenhum suporte técnico legítimo pedirá jamais.</li><li><strong>SIM swapping:</strong> Atacantes transferem seu número de telefone para outro chip para interceptar códigos. Use autenticação 2FA com app, nunca com SMS.</li><li><strong>Malware:</strong> Software que modifica endereços de Bitcoin ao colá-los. Verifique sempre os primeiros e últimos caracteres antes de enviar.</li></ul><p><strong>Regras de sobrevivência:</strong> Sua frase semente se escreve em papel ou metal, nunca em fotos ou na nuvem. Teste restaurar sua carteira ANTES de guardar valores significativos. Use valores pequenos para aprender.</p><p><strong>A lição de Mt. Gox e FTX:</strong> Duas exchanges gigantes colapsaram porque as pessoas confiaram suas chaves a elas. <strong>Se não tem suas chaves, não tem seus bitcoins.</strong> Uma exchange não é uma carteira — é um terceiro que pode falir, ser hackeado, ou roubar.</p><p><strong>O que é autocustódia?</strong> Significa que você — e somente você — controla as chaves privadas. Frase semente em lugar seguro que só você conhece. Você envia e recebe sem pedir permissão a ninguém. 100% responsável pela sua própria segurança. Não é para todos desde o primeiro dia — você pode começar com custódia e migrar quando entender os riscos. Mas que seja uma decisão consciente. A autocustódia é a diferença entre usar Bitcoin e simplesmente ter exposição ao seu preço.</p></div></div>
          </div>
        `,
        navObservatory: "Observatório",
      observatoryTitle: "Observatório",
      observatorySubtitle: "Economias circulares Bitcoin no mundo real: casos, lições e desafios.",
      observatoryContent: `
          <p class="text-gray-400 mb-6">Bitcoin não é só teoria. Ao redor do mundo, comunidades estão construindo economias onde Bitcoin circula de mão em mão — sem exchanges, sem bancos, sem intermediários. Estes são alguns dos experimentos mais significativos. Nenhum é perfeito. Todos são corajosos.</p>
          <div class="space-y-6">
            <div class="bg-[#1a1a1a] border border-white/20 rounded-xl p-6">
              <h3 class="text-xl font-bold text-amber-400 mb-1">🏖️ Bitcoin Beach — El Zonte, El Salvador</h3>
              <p class="text-sm text-gray-500 mb-3">Desde 2019 · A primeira economia circular Bitcoin do mundo</p>
              <p class="text-gray-300">Uma doação anônima de Bitcoin para uma cidade costeira de 3.000 habitantes iniciou tudo. Mike Peterson e Román Martínez construíram um ecossistema onde mais de 500 famílias e 120 negócios usam Bitcoin via Lightning Network para pagamentos diários: eletricidade, almoços, salários. O projeto inspirou diretamente El Salvador a adotar Bitcoin como moeda de curso legal em setembro de 2021 — o primeiro país do mundo a fazê-lo.</p>
              <p class="text-gray-400 mt-2"><strong>Desafios hoje:</strong> Gentrificação severa — os preços dos terrenos multiplicaram e alguns fundadores acumularam propriedades. Muitos comerciantes locais voltaram ao dinheiro. A adoção real entre salvadorenhos comuns continua limitada fora das zonas turísticas.</p>
            </div>
            <div class="bg-[#1a1a1a] border border-white/20 rounded-xl p-6">
              <h3 class="text-xl font-bold text-amber-400 mb-1">🌴 Bitcoin Jungle — Uvita/Dominical, Costa Rica</h3>
              <p class="text-sm text-gray-500 mb-3">Desde 2021 · +380 comércios aceitando Bitcoin</p>
              <p class="text-gray-300">Projeto open-source na costa do Pacífico Sul. Diferente de El Zonte, Costa Rica já tem sistema bancário estável — o problema era a fricção de pagamentos para turistas e expatriados. Criaram sua própria carteira, integraram BTCPay Server, e conseguiram que feiras de agricultores, centros de conservação marinha e lojas de ferragens aceitem sats. 80% dos usuários são costarriquenhos.</p>
              <p class="text-gray-400 mt-2"><strong>Desafios hoje:</strong> Depende do turismo bitcoiner. A integração com SINPE (sistema bancário local) reduz o incentivo de manter Bitcoin sem converter para colones. Opera sem fins lucrativos e sem financiamento estável.</p>
            </div>
            <div class="bg-[#1a1a1a] border border-white/20 rounded-xl p-6">
              <h3 class="text-xl font-bold text-amber-400 mb-1">🏄 Bitcoin Ekasi — Mossel Bay, África do Sul</h3>
              <p class="text-sm text-gray-500 mb-3">Desde 2021 · Economia circular Bitcoin do ano na África (2025)</p>
              <p class="text-gray-300">Nasceu como extensão do The Surfer Kids, uma ONG que ensina surf a jovens de townships. Todos os salários são pagos 100% em Bitcoin. Mais de 30 comércios aceitam Lightning para produtos básicos. Jovens de 16 anos operam seus próprios nós Lightning. O modelo se replica na Zâmbia e no Quênia.</p>
              <p class="text-gray-400 mt-2"><strong>Desafios hoje:</strong> Escala pequena (menos de 50 bitcoiners ativos). Barreiras de alfabetização digital. A volatilidade afeta desproporcionalmente trabalhadores que ganham tudo em Bitcoin e precisam comprar alimentos diariamente.</p>
            </div>
            <div class="bg-[#1a1a1a] border border-white/20 rounded-xl p-6">
              <h3 class="text-xl font-bold text-amber-400 mb-1">🌊 Praia Bitcoin — Jericoacoara, Brasil</h3>
              <p class="text-sm text-gray-500 mb-3">Desde 2021 · Primeira economia circular Bitcoin do Brasil (encerrou Fev 2026)</p>
              <p class="text-gray-300">Fernando Motolese iniciou com uma doação de 0,02 BTC em uma vila turística sem caixas eletrônicos. Instalou nós, máquinas de ponto de venda e distribuiu cartões NFC para estudantes da escola municipal. Recebeu mais de 1.300 doações. Tentou registrar-se como "Banco Comunitário Bitcoin" mas o governo brasileiro rejeitou a solicitação.</p>
              <p class="text-gray-400 mt-2"><strong>Desafios hoje:</strong> Encerrou operações em fevereiro de 2026. O Brasil tem PIX (pagamentos instantâneos gratuitos do governo), eliminando a vantagem de conveniência do Lightning. A falta de regulação foi usada como desculpa para negar reconhecimento institucional.</p>
            </div>
            <div class="bg-[#1a1a1a] border border-white/20 rounded-xl p-6">
              <h3 class="text-xl font-bold text-amber-400 mb-1">🏔️ Bitcoin Lake — Panajachel, Guatemala</h3>
              <p class="text-sm text-gray-500 mb-3">Desde 2022 · Bitcoin + limpeza ambiental</p>
              <p class="text-gray-300">Patrick Melder trouxe o modelo para o Lago Atitlán. Diferente de outros projetos, usa mineração de Bitcoin com óleo de cozinha reciclado para gerar renda e limpar o lago simultaneamente. Mais de 60 comércios aceitam Bitcoin, 90% sem acesso bancário prévio. A escola local foi a primeira da Guatemala a receber o curso "Mi Primer Bitcoin".</p>
              <p class="text-gray-400 mt-2"><strong>Desafios hoje:</strong> Infraestrutura elétrica fraca e dependência de dinheiro. A economia circular não conseguiu se estender ao nível B2B. 60% da população guatemalteca não tem acesso bancário — a oportunidade é imensa, mas a curva de adoção é lenta.</p>
            </div>
            <div class="bg-[#1a1a1a] border border-white/20 rounded-xl p-6">
              <h3 class="text-xl font-bold text-amber-400 mb-1">🏝️ Bitcoin Island — Boracay, Filipinas</h3>
              <p class="text-sm text-gray-500 mb-3">Desde 2022 · Turismo + remessas</p>
              <p class="text-gray-300">Mais de 120 negócios aceitam Bitcoin via Lightning, impulsionados pela carteira Pouch. A abordagem combina turismo com o enorme mercado de remessas filipino (US$35 bilhões/ano) onde as comissões tradicionais consomem até 7%. Maior densidade de comércios Bitcoin fora de El Salvador.</p>
              <p class="text-gray-400 mt-2"><strong>Desafios hoje:</strong> Depende de uma única empresa (Pouch). Adoção impulsionada por turismo mais do que por necessidade local. Volatilidade como obstáculo para trabalhadores locais.</p>
            </div>
            <div class="bg-[#1a1a1a] border border-white/20 rounded-xl p-6">
              <h3 class="text-xl font-bold text-amber-400 mb-1">🌍 Afribit — Kibera/Nairobi, Quênia</h3>
              <p class="text-sm text-gray-500 mb-3">Desde 2024 · +200 comércios em um dos maiores assentamentos informais da África</p>
              <p class="text-gray-300">Ronnie Mdawida transformou Kibera em uma economia circular com mais de 200 comércios aceitando sats para necessidades básicas: comida, água, banheiros. A integração com M-PESA através de ferramentas como Tando permite reconverter para moeda local, resolvendo o "problema de reabastecimento".</p>
              <p class="text-gray-400 mt-2"><strong>Desafios hoje:</strong> Pobreza extrema faz qualquer volatilidade ser devastadora. Competição direta com M-PESA. Sustentabilidade depende de doações externas.</p>
            </div>
          </div>
          <div class="mt-8 p-6 bg-[#111] border border-amber-400/30 rounded-xl">
            <h3 class="text-amber-400 font-bold text-lg mb-3">📡 Federação de Economias Circulares Bitcoin (FBCE)</h3>
            <p class="text-gray-300">Em 2024, Bitcoin Beach cofundou junto com Bitcoin Ekasi e outros projetos a <strong>FBCE</strong> — uma rede global que conecta, financia e assessora economias circulares em mais de 19 países. Em duas rodadas, distribuíram grants para 42 projetos. A lição principal: <strong>concentrar-se em uma localização específica e alcançar massa crítica ali antes de expandir</strong>. Adoção dispersa não funciona — densidade sim.</p>
            <p class="text-gray-400 mt-2">Estes experimentos demonstram que Bitcoin pode funcionar como dinheiro do dia a dia. Também demonstram que não há atalhos: educação, infraestrutura, paciência e a honestidade de reconhecer o que não funciona são necessários. <strong>A economia circular não se decreta — se constrói, transação por transação.</strong></p>
          </div>
        `,
      navGlossary: "Glossário",
        glossaryTitle: "Glossário",
        glossarySubtitle: "Termos-chave para entender Bitcoin, descentralização e a mudança de paradigma.",
        glossaryContent: `
          <div class="columns-1 md:columns-2 gap-4 space-y-4">
            <div class="break-inside-avoid bg-[#1a1a1a] rounded-xl p-4 border border-white/20 hover:border-white/40 transition"><h3 class="text-cyan-400 font-bold">Ação direta</h3><p class="text-gray-400 text-sm mt-1">Agir diretamente sobre um problema em vez de delegar a uma autoridade. Em economia, trocar valor diretamente entre pessoas sem depender de instituições.</p></div>
            <div class="break-inside-avoid bg-[#1a1a1a] rounded-xl p-4 border border-white/20 hover:border-white/40 transition"><h3 class="text-cyan-400 font-bold">Adaptação climática</h3><p class="text-gray-400 text-sm mt-1">Estratégias para ajustar sistemas aos efeitos das mudanças climáticas. Requer fluxos financeiros massivos, rápidos e diretos.</p></div>
            <div class="break-inside-avoid bg-[#1a1a1a] rounded-xl p-4 border border-white/20 hover:border-white/40 transition"><h3 class="text-cyan-400 font-bold">Ajurí</h3><p class="text-gray-400 text-sm mt-1">Prática de trabalho coletivo dos povos Tikuna da Amazônia. A comunidade reúne-se voluntariamente para reconstruir casas, limpar terrenos ou preparar colheitas. Ninguém obriga, ninguém cobra. Cooperação como método.</p></div>
            <div class="break-inside-avoid bg-[#1a1a1a] rounded-xl p-4 border border-white/20 hover:border-white/40 transition"><h3 class="text-cyan-400 font-bold">Apoio mútuo</h3><p class="text-gray-400 text-sm mt-1">Cooperação voluntária entre indivíduos para benefício recíproco. Conceito central em Kropotkin: a sobrevivência depende fundamentalmente da colaboração. Solidariedade horizontal, não caridade vertical.</p></div>
            <div class="break-inside-avoid bg-[#1a1a1a] rounded-xl p-4 border border-white/20 hover:border-white/40 transition"><h3 class="text-cyan-400 font-bold">ASIC</h3><p class="text-gray-400 text-sm mt-1">Circuito integrado de aplicação específica. Hardware projetado exclusivamente para mineração de Bitcoin.</p></div>
            <div class="break-inside-avoid bg-[#1a1a1a] rounded-xl p-4 border border-white/20 hover:border-white/40 transition"><h3 class="text-cyan-400 font-bold">Autocustódia</h3><p class="text-gray-400 text-sm mt-1">Guardar suas próprias chaves privadas. "Suas chaves, suas moedas".</p></div>
            <div class="break-inside-avoid bg-[#1a1a1a] rounded-xl p-4 border border-white/20 hover:border-white/40 transition"><h3 class="text-cyan-400 font-bold">Biocentrismo</h3><p class="text-gray-400 text-sm mt-1">Perspectiva ética que reconhece valor intrínseco a todas as formas de vida. Um sistema econômico biocêntrico mediria riqueza na saúde dos ecossistemas.</p></div>
            <div class="break-inside-avoid bg-[#1a1a1a] rounded-xl p-4 border border-white/20 hover:border-white/40 transition"><h3 class="text-cyan-400 font-bold">Bitcoin</h3><p class="text-gray-400 text-sm mt-1">Tecnologia de consenso e sistema monetário descentralizado criado em 2009 por Satoshi Nakamoto.</p></div>
            <div class="break-inside-avoid bg-[#1a1a1a] rounded-xl p-4 border border-white/20 hover:border-white/40 transition"><h3 class="text-cyan-400 font-bold">Blockchain</h3><p class="text-gray-400 text-sm mt-1">Registro público e imutável de todas as transações. Cada bloco ligado criptograficamente ao anterior.</p></div>
            <div class="break-inside-avoid bg-[#1a1a1a] rounded-xl p-4 border border-white/20 hover:border-white/40 transition"><h3 class="text-cyan-400 font-bold">Chave privada</h3><p class="text-gray-400 text-sm mt-1">Número secreto que dá controle sobre seus bitcoins. Nunca deve ser compartilhada.</p></div>
            <div class="break-inside-avoid bg-[#1a1a1a] rounded-xl p-4 border border-white/20 hover:border-white/40 transition"><h3 class="text-cyan-400 font-bold">Cooperação</h3><p class="text-gray-400 text-sm mt-1">Ação coordenada para um objetivo compartilhado. A biologia evolutiva demonstra que a cooperação — não a competição — é a força dominante na evolução dos sistemas complexos.</p></div>
            <div class="break-inside-avoid bg-[#1a1a1a] rounded-xl p-4 border border-white/20 hover:border-white/40 transition"><h3 class="text-cyan-400 font-bold">Cripto</h3><p class="text-gray-400 text-sm mt-1">Abreviatura de criptografia ou criptomoeda. Nem todas são iguais. A maioria são tokens especulativos sem descentralização real.</p></div>
            <div class="break-inside-avoid bg-[#1a1a1a] rounded-xl p-4 border border-white/20 hover:border-white/40 transition"><h3 class="text-cyan-400 font-bold">Desobediência</h3><p class="text-gray-400 text-sm mt-1">Virtude que demonstra a liberdade individual e a soberania do foro íntimo. Desobedecer uma lei injusta não é crime — é um ato de consciência. Thoreau foi preso por se recusar a financiar a guerra e a escravatura. Toda transformação social profunda começou com alguém que disse “não”. A obediência cega é servidão; a desobediência raciocinada é o primeiro ato de uma pessoa livre.</p></div>
            <div class="break-inside-avoid bg-[#1a1a1a] rounded-xl p-4 border border-white/20 hover:border-white/40 transition"><h3 class="text-cyan-400 font-bold">Ecossocialismo</h3><p class="text-gray-400 text-sm mt-1">Fusão da crítica ecológica com a socialista do capitalismo. Acumulação infinita em planeta finito como raiz da crise.</p></div>
            <div class="break-inside-avoid bg-[#1a1a1a] rounded-xl p-4 border border-white/20 hover:border-white/40 transition"><h3 class="text-cyan-400 font-bold">Frase semente</h3><p class="text-gray-400 text-sm mt-1">12 ou 24 palavras para recuperar uma carteira. Guardar em local seguro, físico, fora da internet.</p></div>
            <div class="break-inside-avoid bg-[#1a1a1a] rounded-xl p-4 border border-white/20 hover:border-white/40 transition"><h3 class="text-cyan-400 font-bold">Halving</h3><p class="text-gray-400 text-sm mt-1">A cada ~4 anos a recompensa de mineração é reduzida pela metade. Garante máximo de 21 milhões de BTC.</p></div>
            <div class="break-inside-avoid bg-[#1a1a1a] rounded-xl p-4 border border-white/20 hover:border-white/40 transition"><h3 class="text-cyan-400 font-bold">Hashpower</h3><p class="text-gray-400 text-sm mt-1">Poder computacional total na mineração. Maior hashrate = mais segurança.</p></div>
            <div class="break-inside-avoid bg-[#1a1a1a] rounded-xl p-4 border border-white/20 hover:border-white/40 transition"><h3 class="text-cyan-400 font-bold">Holocracia</h3><p class="text-gray-400 text-sm mt-1">Sistema organizacional onde a autoridade se distribui em círculos autônomos interconectados. As tensões detectadas por qualquer membro são o motor da mudança. A ordem complexa pode emergir sem controle centralizado.</p></div>
            <div class="break-inside-avoid bg-[#1a1a1a] rounded-xl p-4 border border-white/20 hover:border-white/40 transition"><h3 class="text-cyan-400 font-bold">Holobionte</h3><p class="text-gray-400 text-sm mt-1">Organismo formado pelo hospedeiro e seus microrganismos simbióticos. Cada indivíduo é um holobionte social em simbiose com sua comunidade e biosfera.</p></div>
            <div class="break-inside-avoid bg-[#1a1a1a] rounded-xl p-4 border border-white/20 hover:border-white/40 transition"><h3 class="text-cyan-400 font-bold">Invoice</h3><p class="text-gray-400 text-sm mt-1">Fatura Lightning. Código para receber um pagamento específico. Valor fixo e expiração.</p></div>
            <div class="break-inside-avoid bg-[#1a1a1a] rounded-xl p-4 border border-white/20 hover:border-white/40 transition"><h3 class="text-cyan-400 font-bold">Lightning Network</h3><p class="text-gray-400 text-sm mt-1">Camada de pagamentos sobre Bitcoin para transações instantâneas e quase gratuitas.</p></div>
            <div class="break-inside-avoid bg-[#1a1a1a] rounded-xl p-4 border border-white/20 hover:border-white/40 transition"><h3 class="text-cyan-400 font-bold">Mineração</h3><p class="text-gray-400 text-sm mt-1">Computadores validam transações transformando energia em segurança criptográfica.</p></div>
            <div class="break-inside-avoid bg-[#1a1a1a] rounded-xl p-4 border border-white/20 hover:border-white/40 transition"><h3 class="text-cyan-400 font-bold">Micélio</h3><p class="text-gray-400 text-sm mt-1">Rede subterrânea de fungos que conecta árvores e plantas na floresta, distribuindo nutrientes e sinais de alerta. É a internet da Natureza: descentralizada, sem hierarquia, baseada em cooperação.</p></div>
            <div class="break-inside-avoid bg-[#1a1a1a] rounded-xl p-4 border border-white/20 hover:border-white/40 transition"><h3 class="text-cyan-400 font-bold">Nó</h3><p class="text-gray-400 text-sm mt-1">Computador que armazena a blockchain completa e verifica todas as transações.</p></div>
            <div class="break-inside-avoid bg-[#1a1a1a] rounded-xl p-4 border border-white/20 hover:border-white/40 transition"><h3 class="text-cyan-400 font-bold">P2P</h3><p class="text-gray-400 text-sm mt-1">Pessoa a pessoa. Transações diretas sem intermediários.</p></div>
            <div class="break-inside-avoid bg-[#1a1a1a] rounded-xl p-4 border border-white/20 hover:border-white/40 transition"><h3 class="text-cyan-400 font-bold">Proof of Work</h3><p class="text-gray-400 text-sm mt-1">Mineradores provam que gastaram energia para validar transações. Energia → verdade.</p></div>
            <div class="break-inside-avoid bg-[#1a1a1a] rounded-xl p-4 border border-white/20 hover:border-white/40 transition"><h3 class="text-cyan-400 font-bold">Responsabilidade</h3><p class="text-gray-400 text-sm mt-1">Consciência de que todo poder implica um dever. Soberania só é legítima quando exercida com responsabilidade para com a comunidade e o ecossistema. Poder sem ética é opressão com outro nome.</p></div>

        <p><strong>Bitcoin est une technologie de consensus</strong> qui permet aux gens du monde entier d'échanger de la valeur sans intermédiaires. Ce n'est pas seulement de l'argent numérique; c'est une nouvelle forme d'organisation sociale basée sur les mathématiques et l'énergie.</p>
        
        <p>Nous pouvons affirmer que Bitcoin est la synthèse pratique du conflit dialectique entre capitalisme et communisme. Ce n'est ni un marché libre dérégulé ni une planification centrale collectiviste. Il transcende la fausse dichotomie entre individu et collectif, préservant ce qui est valide des deux propositions tout en rejetant les pathologies de leurs extrêmes: l'accumulation centralisée du capital, la coercition étatique, la surveillance institutionnelle et l'exploitation systémique. Sa légitimité naît de bas en haut, de la participation volontaire, non du décret hiérarchique. Comme dans le <a href="/natura/" style="color: inherit; text-decoration: none; cursor: text;">panthéisme</a>, l'autorité et la vérité ne résident pas "là-haut", mais "ici dedans", en chaque participant et dans le réseau dans son ensemble.</p>
        
        <h3>L'essentiel</h3>
        <ul>
          <li><strong>Décentralisé:</strong> Aucune banque centrale, gouvernement ou entreprise ne le contrôle. Le réseau est maintenu par des milliers d'ordinateurs (appelés nœuds) distribués dans le monde entier. Chaque nœud possède une copie complète de toutes les transactions qui ont eu lieu depuis 2009.</li>
