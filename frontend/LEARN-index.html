        introTitle: "¿Qué es Bitcoin?",
        introContent: `
          <p><strong>Bitcoin es una tecnología de consenso</strong> que permite a personas de todo el mundo intercambiar valor sin intermediarios. No es solo dinero digital; es una nueva forma de organización social basada en matemáticas y energía.</p>
          
          <p>Podemos afirmar que Bitcoin es la síntesis práctica del conflicto dialéctico entre capitalismo y comunismo. No es ni un mercado libre desregulado ni una planificación central colectivista. Trasciende la falsa disyuntiva entre individuo y colectivo, conservando lo válido de ambas propuestas, mientras rechaza las patologías de sus extremos: la acumulación centralizada de capital, la coerción estatal, la vigilancia institucional y la explotación sistémica. Su legitimidad nace de abajo hacia arriba, de la participación voluntaria, no del decreto jerárquico. Como en el <a href="/natura/" style="color: inherit; text-decoration: none; cursor: text;">panteísmo</a>, la autoridad y la verdad no residen "allá arriba", sino "aquí dentro", en cada participante y en la red en su conjunto.</p>
          
          <h3>Lo esencial</h3>
          <ul>
            <li><strong>Descentralizado:</strong> No hay banco central, gobierno o empresa que lo controle. La red la mantienen miles de computadoras (llamadas nodos) distribuidas por todo el mundo. Cada nodo tiene una copia completa de todas las transacciones que han ocurrido desde 2009.</li>
            <li><strong>Finito:</strong> Como los recursos de la Tierra, Bitcoin es finito, solo existirán 21 millones de bitcoins, nunca más. Significa que existe un riesgo real de escasez si no asumimos la responsabilidad de cuidarlos. Este límite está garantizado matemáticamente por el código que todos los participantes ejecutan.</li>
            <li><strong>Transparente:</strong> Todas las transacciones son públicas y verificables por cualquier persona. No hay cuentas secretas ni privilegios ocultos. Nadie puede falsificar el registro.</li>
            <li><strong>Abierto:</strong> Bitcoin es <strong>código abierto</strong> (open source), lo que significa que cualquier persona puede leer, auditar y proponer mejoras al software. No hay secretos ni puertas traseras. Miles de programadores en todo el mundo han revisado cada línea de código. Esta transparencia técnica es la base de la confianza: no necesitas creer en nadie, puedes verificarlo tú mismo.</li>
            <li><strong>Energía social:</strong> Cada bitcoin representa trabajo computacional real—energía transformada en valor digital. Recordemos que la energía no se crea ni se destruye, solo se transforma. Bitcoin es precisamente esa transformación, ajustada matemáticamente para preservar valor a través del tiempo. Por eso decimos que <strong>Bitcoin es energía social congelada en el tiempo</strong>.</li>
            <li>📖 Para profundizar: <a href="https://dergigi.com/2021/01/14/bitcoin-is-time/" target="_blank" class="text-emerald-400 hover:underline">"Bitcoin is Time" — Gigi</a></li>
          </ul>
          
          <h3>¿Cómo funciona?</h3>
          <p>Imagina un libro de contabilidad gigante que todos pueden leer, pero nadie puede borrar ni falsificar. Este libro se llama <strong>blockchain</strong> (cadena de bloques). Cada 10 minutos aproximadamente, se agrega una nueva página (bloque) con las últimas transacciones.</p>
          
          <p>Para agregar una página, las computadoras de todo el mundo compiten resolviendo un problema matemático complejo. La primera en resolverlo gana el derecho a escribir la página y recibe bitcoins nuevos como recompensa. Este proceso se llama <strong>minería</strong>.</p>
          
          <p>Pero la minería no es como extraer oro—es más como votar con energía. Cuanta más energía aportas a la red, más peso tiene tu voto para validar transacciones. Es un sistema donde la honestidad es más rentable que el engaño, porque hacer trampa requeriría más energía que jugar limpio.</p>
          
          <p>Como cualquier forma de dinero, Bitcoin tiene utilidad en tanto la gente confíe en la comunidad que lo sostiene y en tanto sea funcional como medio de cambio. La diferencia es que esa confianza no está depositada en un banco o gobierno, sino en una prueba criptográfica verificada por millones de voluntarios.</p>
          
          <h3>Hashpower: La seguridad matemática</h3>
          <p>La seguridad de Bitcoin no depende de guardias armados ni de bóvedas de acero, sino de matemáticas puras. El corazón de esta seguridad es la <strong>prueba de trabajo</strong> (Proof of Work), que funciona así:</p>
          
          <p>Cada bloque de transacciones debe incluir un número especial llamado <strong>nonce</strong>. Los mineros prueban millones de nonces por segundo hasta encontrar uno que, al combinarse con los datos del bloque y pasarse por el algoritmo SHA-256, produzca un <strong>hash</strong> (una huella digital de 256 bits) que comience con cierta cantidad de ceros. Encontrar este hash es extraordinariamente difícil—requiere trillones de intentos—pero verificar que es correcto es instantáneo. Esta asimetría es la clave: mucho trabajo para crear, fácil de verificar.</p>
          
          <p>El <strong>hashpower</strong> es la medida del poder computacional total dedicado a esta tarea. Actualmente, la red Bitcoin procesa más de 500 exahashes por segundo (500,000,000,000,000,000,000 cálculos por segundo). Para hackear la red, un atacante necesitaría superar todo ese poder combinado—algo que requeriría más electricidad que países enteros y una inversión de miles de millones de dólares en hardware especializado.</p>
          
          <p><strong>Mineros y Nodos: roles diferentes, misma misión</strong></p>
          <ul>
            <li><strong>Mineros:</strong> Compiten para agregar nuevos bloques a la cadena. Invierten en hardware (ASICs) y electricidad. A cambio, reciben bitcoins nuevos (actualmente 3.125 BTC por bloque) más las comisiones de las transacciones incluidas. Son los que "escriben" nuevas páginas en el libro contable.</li>
            <li><strong>Nodos:</strong> Almacenan una copia completa de toda la blockchain y verifican que cada transacción y bloque cumpla las reglas. No reciben recompensa económica directa, pero son los guardianes de las reglas. Si un minero intenta hacer trampa, los nodos rechazarán su bloque. Cualquier persona puede correr un nodo desde su computadora de casa.</li>
          </ul>
          <p>Esta separación de poderes es crucial: los mineros proponen, los nodos validan. Ninguno puede actuar sin el otro. Es un sistema de controles y balances donde la matemática reemplaza la necesidad de confiar en autoridades.</p>
          
          <p><strong>El Halving: escasez programada</strong></p>
          <p>Cada 210,000 bloques (aproximadamente cada 4 años), la recompensa que reciben los mineros se reduce a la mitad. Este evento se llama <strong>halving</strong>. Comenzó en 50 BTC por bloque en 2009, luego 25 (2012), 12.5 (2016), 6.25 (2020), y actualmente 3.125 BTC (2024). Esta reducción programada garantiza que nunca existirán más de 21 millones de bitcoins y que la emisión sea predecible y decreciente—lo opuesto a las monedas fiat donde los bancos centrales pueden imprimir sin límite. El halving es el mecanismo que convierte a Bitcoin en el activo más escaso jamás creado por la humanidad.</p>
          
          <h3>La geometría oculta de Bitcoin</h3>
          <p>En el corazón de cada billetera de Bitcoin late una estructura matemática elegante: la <strong>curva elíptica</strong>. Bitcoin utiliza una curva específica llamada <strong>secp256k1</strong>, definida por la ecuación y² = x³ + 7 sobre un campo finito de números primos. Esta curva no fue elegida al azar: sus parámetros fueron construidos de forma predecible y verificable, lo que reduce la posibilidad de puertas traseras ocultas — a diferencia de otras curvas promovidas por agencias gubernamentales.</p>
          
          <p>Cuando creas una billetera de Bitcoin, el software genera una <strong>clave privada</strong>: un número aleatorio de 256 bits (un número con hasta 77 dígitos). A partir de esta clave privada, se realiza una operación geométrica sobre la curva elíptica: se toma un punto conocido llamado <strong>Punto Generador (G)</strong> y se "suma" a sí mismo tantas veces como indique tu clave privada. El resultado es tu <strong>clave pública</strong> — un nuevo punto en la curva.</p>
          
          <p>La seguridad reside en una asimetría fundamental llamada el <strong>Problema del Logaritmo Discreto en Curvas Elípticas (ECDLP)</strong>: multiplicar un punto por un número es computacionalmente fácil (tu computadora lo hace en milisegundos), pero dado el resultado, deducir cuántas veces se multiplicó es computacionalmente imposible — ni todas las computadoras del mundo trabajando durante millones de años podrían resolverlo.</p>
          
          <p>Esta relación unidireccional es una <strong>función de trampilla</strong> (<em>trapdoor function</em>). Puedes verificar que alguien posee la clave correcta sin que te la revele, pero no puedes deducirla observando la clave pública. El campo primo sobre el que opera la curva — un número primo cercano a 2²⁵⁶ — garantiza que el espacio de claves posibles sea astronómicamente vasto, ofreciendo 128 bits de seguridad efectiva.</p>
          
          <p><strong>Es el puente entre lo físico y lo digital:</strong> para "poseer" bitcoin, debes poseer un número secreto que tiene una relación geométrica específica con la curva. La posesión se convierte en conocimiento, no en un objeto físico. Es una propiedad metafísica — no tienes bitcoins "guardados" en ningún lugar; tienes el conocimiento matemático que te permite moverlos.</p>
          
          <p>La curva elíptica secp256k1 es el corazón oculto de Bitcoin. No es solo un detalle técnico; es la piedra angular de su seguridad, su esquema de propiedad y su filosofía. Representa el triunfo de un orden matemático verificable y objetivo sobre los sistemas de confianza subjetiva y jerárquica. Satoshi no inventó una moneda; codificó un sistema de propiedad y verdad en el lenguaje más fundamental que conocemos: las matemáticas puras.</p>
          
          <p>Comprender esto es entender que Bitcoin no es solo un activo, sino la encarnación digital de un principio filosófico: que la base de un sistema social justo y resistente a la corrupción puede ser una verdad inmutable, abierta a todos y propiedad de nadie.</p>
          
          <h3>Responsabilidad compartida: Tus llaves, tu dinero</h3>
          <p>En Bitcoin, no existen cuentas bancarias ni contraseñas que puedas recuperar llamando a servicio al cliente. Tu acceso a tus fondos depende de una <strong>llave privada</strong>: un número secreto de 256 bits que te da control absoluto sobre tus bitcoins.</p>
          
          <p>Para hacer esta llave manejable, se representa como una <strong>frase semilla</strong> de 12 o 24 palabras en un orden específico. Por ejemplo: "árbol luna pez montaña río nube sol piedra viento mar tierra fuego". Quien tenga estas palabras, tiene acceso total a los fondos. No hay forma de recuperarlas si se pierden—ni Satoshi, ni ningún gobierno, ni nadie puede ayudarte.</p>
          
          <p>Esta responsabilidad tiene consecuencias reales. Se estima que entre 3 y 4 millones de bitcoins (aproximadamente el 17-19% del total que existirá) están perdidos para siempre: personas que olvidaron sus contraseñas, tiraron discos duros viejos, o murieron sin dejar instrucciones. El caso más famoso es el de James Howells, quien en 2013 tiró un disco duro con 8,000 BTC—hoy valdría cientos de millones de dólares y sigue enterrado en un vertedero de Gales.</p>
          
          <p>Cada bitcoin perdido es energía social que deja de circular, riqueza que se congela permanentemente. Por eso la responsabilidad en Bitcoin no es solo personal sino <strong>colectiva</strong>: cuidar tus llaves es cuidar un recurso finito que pertenece a la humanidad. La responsabilidad es hacer fluir la energía, no dejarla estancada—y mucho menos perderla para siempre.</p>
          
          <h3>El ataque del 51%</h3>
          <p>Si un grupo de mineros controlara más del 50% del poder computacional de la red, teóricamente podrían manipular transacciones recientes. Esto se conoce como el <strong>ataque del 51%</strong>. En la práctica, es económicamente irracional: costaría más atacar la red que lo que se podría obtener, y el atacante destruiría el valor de su propia inversión. Puedes leer más sobre este y otros riesgos en la sección de <strong>Riesgos y desafíos</strong>.</p>
          
          <h3>La unidad más pequeña</h3>
          <p>Un bitcoin se divide en 100,000,000 de unidades llamadas <strong>satoshis</strong> (o "sats"), en honor a su creador. Es como los centavos del bitcoin, pero mucho más divisibles. Esto permite micropagos que serían imposibles con dinero tradicional—puedes enviar el equivalente a fracciones de centavo a cualquier lugar del mundo.</p>
          <p class="text-center text-lg font-bold text-amber-400 my-4">1 BTC = 100,000,000 sats</p>
          
          <h3>¿Por qué es diferente al dinero tradicional?</h3>
          <p>El dinero que usamos normalmente (dólares, euros, pesos) es creado por bancos centrales que pueden imprimir más cuando quieren. Esto causa <strong>inflación</strong>: cada año tu dinero vale menos. Los gobiernos pueden congelar cuentas, los bancos pueden negar servicios, y el sistema financiero excluye a miles de millones de personas.</p>
          
          <p>Bitcoin invierte esta lógica: nadie puede crear más bitcoins de los programados, nadie puede congelar tu cuenta si tienes tus llaves, y cualquier persona con un teléfono puede participar en la economía global. Al estar libre del control de los Estados, Bitcoin le devuelve el poder a la gente común para no ser peones en luchas de poder entre naciones, corporaciones o élites financieras.</p>
          
          <h3>Escalabilidad: Lightning Network</h3>
          <p>Bitcoin puede procesar aproximadamente 7 transacciones por segundo en su capa base—suficiente para ser "oro digital", pero insuficiente para reemplazar a Visa (que procesa miles por segundo). La solución no fue cambiar Bitcoin, sino construir una segunda capa encima: <strong>Lightning Network</strong>.</p>
          
          <p>Piensa en Lightning como una red de canales de pago. Imagina que tú y tu vecino comercian frecuentemente. En lugar de registrar cada transacción en la blockchain (lento y con comisiones), abren un "canal" depositando fondos en una dirección compartida. Ahora pueden intercambiar valor instantáneamente entre ustedes, actualizando solo el balance interno del canal. Cuando quieran cerrar el canal, la blockchain registra únicamente el estado final.</p>
          
          <p><strong>Ejemplo simple:</strong> Ana abre un canal con 100,000 sats con Bruno. Ana le paga 10,000 sats a Bruno por un café. Luego Bruno le paga 5,000 sats a Ana por un libro. Estas transacciones son instantáneas y prácticamente gratuitas. Al final del mes, cierran el canal: la blockchain solo registra que Ana tiene 95,000 sats y Bruno 5,000—no las decenas de transacciones intermedias.</p>
          
          <p>Lo revolucionario es que estos canales se conectan entre sí. Si Ana tiene canal con Bruno, y Bruno con Carlos, Ana puede pagar a Carlos a través de Bruno, sin necesidad de abrir un canal directo. Lightning encuentra automáticamente la ruta más eficiente a través de la red.</p>
          
          <p>Hoy, Lightning Network tiene más de 15,000 nodos públicos y capacidad para mover miles de millones de sats. Aplicaciones como billeteras móviles permiten pagos instantáneos en cualquier comercio del mundo. Es la infraestructura que hace posible usar Bitcoin para comprar un café, no solo para transferencias grandes. La comunidad ha construido, ladrillo a ladrillo, la arquitectura de un nuevo sistema económico global.</p>
          
          <h3>Bitcoin es colectivista</h3>
          <p><strong>Bitcoin es una institución de libertad que nos une como especie.</strong></p>
          
          <p>Bitcoin nos libera de la competencia destructiva, de la desigualdad impuesta por quienes controlan el dinero, del aislamiento del individualismo extremo, uniéndonos para cooperar por una propiedad colectiva.</p>
          
          <ul>
            <li><strong>Propiedad colectiva de la red:</strong> Nadie es dueño de Bitcoin, como nadie es dueño del planeta Tierra. Es un bien común digital que todos mantenemos juntos.</li>
            <li><strong>Validación por consenso matemático:</strong> El protocolo de Bitcoin opera sobre un lenguaje binario universal que permite una verificación objetiva e inequívoca. Cada nodo de la red, de forma independiente, ejecuta las mismas reglas criptográficas sobre cada transacción. El consenso emerge cuando esta inmensa y creciente red de nodos coincide numéricamente, de forma perfecta, en la información que valida y archiva. Esta coincidencia numérica es la seguridad; alterar un solo dato requeriría reescribir esa coincidencia en la mayoría de los nodos simultáneamente, una tarea que se vuelve exponencialmente más imposible a medida que la red crece. La autoridad no es jerárquica, sino probabilística y colectiva.</li>
            <li><strong>El poder conjunto es superior:</strong> La fortaleza de Bitcoin no reside en un muro central, sino en la suma descentralizada de su poder computacional global. Este poder, conocido como Hashrate, representa el total de la energía dedicada a proteger la red. Para hackearla, un atacante necesitaría superar la capacidad combinada de millones de máquinas. Esta defensa no es estática, sino un fenómeno emergente de la colaboración distribuida.</li>
            <li><strong>Democratiza la emisión monetaria:</strong> Cualquier persona puede participar en la creación de dinero (minería) o en la validación de transacciones (corriendo un nodo). El poder monetario no está concentrado en bancos centrales.</li>
            <li><strong>Redistribución de la riqueza:</strong> Bitcoin puede ser la arquitectura transparente y auditable de una Renta Básica Universal (RBU). Si la clase trabajadora se coordina para dos cuestiones; asumir la propiedad colectiva de la infraestructura energética y minera, y exigir Bitcoin como única remuneración justa, el valor generado al convertir recursos comunes (energía excedente) en activo digital, fluirá directamente hacia la comunidad. Esto cierra el círculo virtuoso: la riqueza creada a partir de un bien común retorna como un ingreso económico común.</li>
            <li><strong>Elimina intermediarios contables:</strong> Sin bancos que decidan quién merece crédito. Sin gobiernos que puedan confiscar arbitrariamente o devaluar los ahorros de la gente.</li>
          </ul>
          
          <p>Solo quien es autónomo puede conocer la libertad, pues autonomía significa vivir con la ley que uno mismo se impone. En el caso de la sociedad, la verdadera libertad no es ausencia de reglas en la comunidad, sino elegir colectivamente y sin coerción las reglas que nos gobiernan. Bitcoin permite la autodeterminación económica individual al otorgar a cada persona libertad para elegir cómo usa su dinero, pero debe saber que sus decisiones pueden ser objeto de escrutinio público, debe asumir responsabilidad de sus elecciones. Para la clase trabajadora global, constituye un sistema financiero común, inmune a la confiscación y a la devaluación por parte de cualquier Estado o banco central. Permite la solidaridad económica y la resistencia de clase a escala global, sin necesidad de burocracia.</p>
          
          <h3>Revolución energética y cooperación digitalizada</h3>
          <p>La historia de la complejidad en nuestro planeta es la historia de revoluciones que son, en esencia, saltos hacia formas de cooperación más sofisticadas y eficientes. Todo comenzó con la Revolución Pluricelular, el pacto primordial donde la vida descubrió que cooperar y especializarse era más poderoso que competir en solitario. Millones de años después, la Revolución del Lenguaje Simbólico tejió redes de cooperación coordinada a través de símbolos y relatos compartidos. La Revolución Agrícola y de la Especialización escaló este modelo, creando los primeros pactos sociales de interdependencia a gran escala. En nuestra era, la Revolución de la Conectividad Digital ha hilado una capa de inteligencia y acción colectiva global. Hoy, asomamos a la siguiente frontera: la Revolución de los Sistemas Descentralizados, que propone una cooperación económica y social basada en protocolos transparentes, permitiendo a individuos y a la clase trabajadora global coordinarse y crear valor de forma autónoma, más allá de toda frontera y autoridad intermediaria. Cada una de estas revoluciones no fue un mero conflicto, sino la emergencia de un nuevo y mejor modelo para colaborar.</p>
          
          <p>Para abandonar definitivamente la dependencia del petróleo y los combustibles fósiles, necesitamos un motor financiero que acelere la transición de forma práctica y masiva. Por suerte, Bitcoin puede financiar precisamente esa revolución energética. Su modelo, que incentiva la búsqueda de energía abundante y de bajo costo, está ya impulsando la inversión directa en nuevas granjas solares y eólicas. Esta dinámica posibilita una acción directa sin intermediarios en la investigación, ampliación y transformación total de la matriz energética. Los capitales generados y atraídos por Bitcoin pueden destinarse no solo a desplegar renovables a gran escala, sino también a financiar la frontera científica, como la energía de fusión, consolidando así un futuro energético limpio, descentralizado y accesible para todos.</p>
          
          <h3>Qué NO es Bitcoin</h3>
          <p>Para comprender Bitcoin en su esencia, es fundamental entender también lo que <strong>no</strong> es. Se debe apartar la visión distorsionada del mercado y volver a la idea central de su creación:</p>
          <ul>
            <li>Bitcoin <strong>no se concibió como un vehículo de inversión</strong>, sino como una herramienta de soberanía y una corrección a un sistema financiero roto. Su propósito no es generar lucro para especuladores, sino devolver a las personas el control de su dinero. Satoshi Nakamoto diseñó un sistema para realizar pagos directos entre personas, sin necesidad de bancos ni intermediarios que cobren comisiones o puedan censurar transacciones. El objetivo último es restaurar la función original del dinero: ser recompensa justa del trabajo y ser un medio de intercambio confiable en cualquier lugar del mundo.</li>

        footerCTA: "¿Listo para experimentar Bitcoin?",

        navRisks: "Riesgos",
        risksTitle: "Riesgos y desafíos de Bitcoin",
        risksSubtitle: "Bitcoin no es perfecto. Conocer sus riesgos es parte de entenderlo.",
        risksContent: `
          <h2>Centralización del hashpower</h2>
          <p>Aunque Bitcoin es descentralizado por diseño, la minería se ha concentrado en dos sentidos: en <strong>pools de minería</strong> (los 4 más grandes controlan más del 50% del hashrate) y <strong>geográficamente</strong> (la minería migra hacia donde la electricidad es más barata).</p>
          <p>En 2021, China concentraba más del 65% del hashrate global. Cuando el gobierno prohibió la minería, la red perdió la mitad de su poder de cómputo en semanas — pero se recuperó completamente en meses, con mineros migrando a Estados Unidos, Kazajistán, Rusia y Canadá. La red demostró ser antifrágil: cada golpe la hace más distribuida.</p>
          <p>Cada minero individual puede cambiar de pool en minutos, lo que limita el poder real de los operadores de pools. Pero si un gobierno presiona a los más grandes, podría influir temporalmente en qué transacciones se procesan.</p>
          <p><strong>¿Por qué importa?</strong> Bitcoin funciona mejor cuando el hashpower está distribuido entre muchos participantes en muchas jurisdicciones. La solución ideal es una minería distribuida entre muchos países pequeños, aprovechando energía renovable local. La concentración del hashpower es el espejo de la concentración del poder — y Bitcoin existe para combatir exactamente eso.</p>

          <h2>Ataque del 51%</h2>
          <p>Si una entidad controla más del 50% del poder de cómputo de la red, teóricamente podría reescribir bloques recientes y realizar <strong>doble gasto</strong> — gastar los mismos bitcoins dos veces. Sin embargo:</p>
          <ul>
            <li>El costo es astronómico — miles de millones de dólares en hardware y electricidad.</li>
            <li>Mantener el ataque es aún más costoso que ejecutarlo.</li>
            <li>Un ataque exitoso destruiría la confianza en la red, colapsando el precio y haciendo que el atacante pierda su propia inversión.</li>
            <li>Los nodos podrían rechazar los bloques del atacante mediante una actualización de emergencia.</li>
          </ul>
          <p>Es un riesgo teórico real, pero económicamente irracional. Nadie ha logrado ejecutarlo en los 16 años de existencia de Bitcoin. La ironía del ataque del 51% es que cuanto más valioso se vuelve Bitcoin, más costoso — y por tanto más improbable — se vuelve atacarlo.</p>

          <h2>Ballenas y concentración de riqueza</h2>
          <p>Se estima que alrededor del 2% de las direcciones de Bitcoin poseen más del 90% de todos los bitcoins en circulación. Muchas pertenecen a exchanges, fondos de inversión y mineros tempranos.</p>
          <p>Esta concentración contradice la promesa de democratización del dinero. Sin embargo:</p>
          <ul>
            <li>Muchas direcciones "grandes" son wallets frías de exchanges que custodian fondos de millones de usuarios.</li>
            <li>La distribución mejora con el tiempo a medida que más personas adoptan Bitcoin.</li>
            <li>A diferencia del sistema fiat, la concentración es visible y verificable — nadie puede esconder sus tenencias en cuentas secretas.</li>
          </ul>
          <p>Proyectos como <strong>Take Power</strong> existen precisamente para combatir esta concentración: redistribuir sats a quienes aún no tienen acceso.</p>

          <h2>El desafío de la transición</h2>
          <p>Los gobiernos pueden intentar prohibir o restringir Bitcoin. China lo hizo con la minería. India lo amenazó. La Unión Europea ha debatido regulaciones restrictivas.</p>
          <p>Pero Bitcoin es, en su esencia, <strong>desobediencia civil codificada</strong>. No pide permiso para existir. No necesita licencia para operar. Si la adopción alcanza masa crítica, la regulación se vuelve tan inútil como intentar prohibir internet. La historia muestra que las tecnologías que empoderan a las personas terminan imponiéndose a los decretos que intentan frenarlas.</p>
          <p>Sin embargo, en la fase actual de baja adopción, las restricciones pueden dificultar el acceso cotidiano y empujar a los usuarios a la clandestinidad. El verdadero desafío no es la regulación en sí — es alcanzar la masa crítica antes de que las estructuras de poder puedan reaccionar.</p>

          <h2>Conectividad</h2>
          <p>Sin internet no hay Bitcoin. Y <strong>un tercio de la humanidad aún no tiene acceso a internet</strong>. Este es quizás el desafío más real y menos discutido: la infraestructura necesaria para participar en la red Bitcoin depende de otra red centralizada — los proveedores de telecomunicaciones y los cables submarinos controlados por corporaciones y gobiernos.</p>
          <p>Existen avances prometedores: transacciones Bitcoin por radio, satélites (Blockstream Satellite transmite la blockchain completa), y redes mesh descentralizadas. Pero la realidad es que la soberanía financiera digital requiere soberanía en la conectividad. <strong>No habrá libertad financiera sin libertad de comunicación.</strong></p>
          <p>Este desafío conecta directamente con la redistribución de la riqueza: los que más necesitan Bitcoin son precisamente los que tienen menos acceso a la infraestructura para usarlo.</p>

          <h2>Computación cuántica</h2>
          <p>Las computadoras cuánticas, cuando sean lo suficientemente poderosas, podrían romper la criptografía que protege las claves privadas de Bitcoin. Pero este no es un riesgo exclusivo de Bitcoin — <strong>es un riesgo para toda la civilización digital</strong>: banca, comunicaciones militares, registros médicos, infraestructura crítica. Todo sistema informático actual se basa en la misma criptografía.</p>
          <p>La comunidad Bitcoin ya trabaja en algoritmos post-cuánticos, y el protocolo puede actualizarse. Pero el verdadero desafío de fondo es más profundo: <strong>la apropiación de la tecnología cuántica por parte de la sociedad civil</strong>. Si solo los estados y las corporaciones acceden a esta tecnología, el desequilibrio de poder será devastador — con o sin Bitcoin.</p>

          <h2>Volatilidad</h2>
          <p>Bitcoin sigue siendo extremadamente volátil. Su precio puede subir o bajar un 20% en días. Esto lo hace arriesgado como reserva de valor a corto plazo y difícil de usar como medio de pago cotidiano.</p>
          <p>Pero quizás estamos midiendo con la vara equivocada. Cuando decimos que "Bitcoin es volátil", en realidad estamos diciendo que <strong>su precio en dólares fluctúa</strong>. Pero el dólar mismo pierde valor constantemente por la inflación — simplemente estamos tan acostumbrados a medir todo en dólares que no notamos que la vara está encogiendo.</p>
          <p>Si midiéramos Bitcoin en energía (megajoules), su volatilidad se reduciría significativamente, porque el costo energético de minar un bitcoin es relativamente estable. El <a href="/energy/" style="color: #f7931a;">Patrón Energético</a> propone exactamente esto: medir el valor en unidades de energía, no en monedas fiat que los bancos centrales pueden diluir a voluntad.</p>
          <p>Mientras tanto, quienes usan Bitcoin deben estar preparados para fluctuaciones severas en términos de precio fiat.</p>

          <h2>Responsabilidad y ética</h2>
          <p>En Bitcoin, <strong>"tus llaves, tus monedas"</strong>. Si pierdes tu clave privada, pierdes tus bitcoins para siempre. No hay banco, ni servicio de atención al cliente, ni botón de "olvidé mi contraseña". Se estima que entre 3 y 4 millones de bitcoins se han perdido permanentemente.</p>
          <p>Pero la responsabilidad va más allá de la custodia. Tener soberanía sobre tu dinero implica también una <strong>responsabilidad ética sobre cómo lo usas</strong>.</p>
          <p>Pensemos en los animales. Durante milenios sirvieron para expandir nuestra capacidad técnica: carga, transporte, alimentación. Gracias a ellos construimos civilizaciones. Pero en vez de honrar ese servicio, los convertimos en máquinas de producción industrial — los masacramos sin asumir la responsabilidad de ser, como especie, la mente del organismo Tierra. Es como un cerebro que comanda el castigo de su propia carne.</p>
          <p>Bitcoin nos da un poder nuevo: dinero sin intermediarios, riqueza sin permiso. Pero el poder sin ética es solo otra forma de opresión. La pregunta no es solo <em>¿cómo guardo mis bitcoins?</em> sino <em>¿para qué los uso? ¿contribuyo a la redistribución o a la concentración? ¿sirvo a la vida o la exploto?</em></p>

          <h2>Reflexión final</h2>
          <p>Ninguna tecnología es perfecta. Bitcoin es un cambio de paradigma vivo, el más ambicioso de la historia humana. Conocer sus riesgos no debilita la propuesta — la fortalece. Un usuario informado toma mejores decisiones y contribuye a una red más resiliente.</p>
          <p><strong>La honestidad es la base de la confianza. Y la confianza es la base del dinero.</strong></p>
        `,
        navFaq: "FAQ",
        faqTitle: "Preguntas frecuentes",
        faqSubtitle: "Lo esencial sobre Bitcoin, su uso y su potencial transformador.",
        faqContent: `
          <div class="space-y-3">
            <div class="bg-[#1a1a1a] border border-white/20 rounded-xl overflow-hidden"><button onclick="this.nextElementSibling.classList.toggle('hidden');this.querySelector('span:last-child').textContent=this.nextElementSibling.classList.contains('hidden')?'+':'−'" class="w-full text-left p-4 flex justify-between items-center hover:bg-white/5 transition"><span class="font-bold text-emerald-400">¿Bitcoin es dinero real?</span><span class="text-xl text-emerald-400">+</span></button><div class="hidden px-4 pb-4 text-gray-300"><p>Sí. Es un registro digital descentralizado verificado por miles de computadoras. Desde 2009 ha funcionado sin interrupción, sin empresa detrás, y sin que nadie lo haya falsificado.</p></div></div>
            <div class="bg-[#1a1a1a] border border-white/20 rounded-xl overflow-hidden"><button onclick="this.nextElementSibling.classList.toggle('hidden');this.querySelector('span:last-child').textContent=this.nextElementSibling.classList.contains('hidden')?'+':'−'" class="w-full text-left p-4 flex justify-between items-center hover:bg-white/5 transition"><span class="font-bold text-emerald-400">¿Quién controla Bitcoin?</span><span class="text-xl text-emerald-400">+</span></button><div class="hidden px-4 pb-4 text-gray-300"><p>Nadie — y todos. Las reglas las ejecuta un software de código abierto. Los cambios requieren consenso entre miles de participantes. Es el sistema monetario más democrático que ha existido. Pero esto implica algo crucial: <strong>no hay nadie a quien reclamar</strong>. Si pierdes tus claves, no hay oficina, no hay teléfono, no hay formulario de recuperación.</p></div></div>
                                    <div class="bg-[#1a1a1a] border border-white/20 rounded-xl overflow-hidden"><button onclick="this.nextElementSibling.classList.toggle('hidden');this.querySelector('span:last-child').textContent=this.nextElementSibling.classList.contains('hidden')?'+':'−'" class="w-full text-left p-4 flex justify-between items-center hover:bg-white/5 transition"><span class="font-bold text-emerald-400">¿Por qué usar Bitcoin persona a persona (P2P)?</span><span class="text-xl text-emerald-400">+</span></button><div class="hidden px-4 pb-4 text-gray-300"><p>Bitcoin fue diseñado para circular entre personas — entre trabajadores, vecinos, comunidades. <strong>Mientras Bitcoin corra de mano en mano entre la gente, el poder económico estará en la gente.</strong> El momento en que lo depositas en un exchange o lo cambias por dólares, ese poder regresa a las mismas instituciones que Bitcoin busca trascender.</p><p>Sí, puedes comprar cosas con Bitcoin — e incentivamos que lo hagas. Cada compra fortalece la economía circular. Lo que <strong>no</strong> incentivamos es usar Bitcoin para comprar otras divisas o tokens. Procura comprarle a otra persona que también use Bitcoin con ética — alguien que lo reciba y lo siga circulando.</p><p><strong>No cambies tus sats por dólares — encuentra a alguien que los acepte.</strong></p></div></div>
                        <div class="bg-[#1a1a1a] border border-white/20 rounded-xl overflow-hidden"><button onclick="this.nextElementSibling.classList.toggle('hidden');this.querySelector('span:last-child').textContent=this.nextElementSibling.classList.contains('hidden')?'+':'−'" class="w-full text-left p-4 flex justify-between items-center hover:bg-white/5 transition"><span class="font-bold text-emerald-400">¿Bitcoin es legal?</span><span class="text-xl text-emerald-400">+</span></button><div class="hidden px-4 pb-4 text-gray-300"><p>La pregunta más precisa sería: ¿importa? Bitcoin funciona con o sin permiso. <strong>No hay un servidor que apagar, no hay una empresa que cerrar, no hay un CEO que arrestar.</strong> Miles de nodos en decenas de países mantienen copias idénticas de la blockchain.</p><p>La historia muestra que <strong>la regulación no detiene la adopción — solo la ralentiza temporalmente</strong>. Nadie pudo prohibir la imprenta, ni la radio, ni internet. Bitcoin es la siguiente en esa línea.</p></div></div>
            <div class="bg-[#1a1a1a] border border-white/20 rounded-xl overflow-hidden"><button onclick="this.nextElementSibling.classList.toggle('hidden');this.querySelector('span:last-child').textContent=this.nextElementSibling.classList.contains('hidden')?'+':'−'" class="w-full text-left p-4 flex justify-between items-center hover:bg-white/5 transition"><span class="font-bold text-emerald-400">¿Por qué Bitcoin termina con la acumulación sin sentido?</span><span class="text-xl text-emerald-400">+</span></button><div class="hidden px-4 pb-4 text-gray-300"><p>El dinero fiat se imprime sin límite. La respuesta racional es acaparar antes de que pierda valor. Bitcoin invierte esta lógica: con 21 millones de unidades fijas, <strong>no necesitas acumular para protegerte de la inflación</strong>.</p><p>Esto cambia los incentivos: en vez de acumular por miedo, puedes <strong>circular por confianza</strong>. La escasez programada no genera avaricia; libera de ella.</p><p><strong>Bitcoin no prohíbe la riqueza — elimina la necesidad patológica de acumularla.</strong></p></div></div>
                                    <div class="bg-[#1a1a1a] border border-white/20 rounded-xl overflow-hidden"><button onclick="this.nextElementSibling.classList.toggle('hidden');this.querySelector('span:last-child').textContent=this.nextElementSibling.classList.contains('hidden')?'+':'−'" class="w-full text-left p-4 flex justify-between items-center hover:bg-white/5 transition"><span class="font-bold text-emerald-400">¿Bitcoin no gasta demasiada energía?</span><span class="text-xl text-emerald-400">+</span></button><div class="hidden px-4 pb-4 text-gray-300"><p>Bitcoin consume energía — como todo sistema de valor. La pregunta real es: <strong>¿para qué se usa esa energía?</strong></p><p>Bitcoin incentiva la búsqueda de energía barata, frecuentemente renovable o desperdiciada. Más del 50% de la minería ya usa energía renovable.</p></div></div>
            <div class="bg-[#1a1a1a] border border-white/20 rounded-xl overflow-hidden"><button onclick="this.nextElementSibling.classList.toggle('hidden');this.querySelector('span:last-child').textContent=this.nextElementSibling.classList.contains('hidden')?'+':'−'" class="w-full text-left p-4 flex justify-between items-center hover:bg-white/5 transition"><span class="font-bold text-emerald-400">¿Cómo puede Bitcoin financiar la adaptación climática?</span><span class="text-xl text-emerald-400">+</span></button><div class="hidden px-4 pb-4 text-gray-300"><p>La adaptación climática requiere transferir recursos a las comunidades más vulnerables — las que el sistema bancario excluye. Bitcoin permite enviar valor directamente, sin intermediarios que absorban el 30%.</p><p><strong>Bitcoin es la infraestructura financiera que la adaptación climática necesita: global, sin fronteras, sin permiso, transparente.</strong></p><p>Pero hay algo más profundo: la adaptación climática requiere que los países se coordinen — y la coordinación solo es posible si hay paz. Bitcoin, como moneda neutral que no pertenece a ningún estado, puede ser la arquitectura financiera común que permita esa cooperación. <strong>La paz no es un prerequisito del cambio climático — es su condición de posibilidad.</strong></p></div></div>
            <div class="bg-[#1a1a1a] border border-white/20 rounded-xl overflow-hidden"><button onclick="this.nextElementSibling.classList.toggle('hidden');this.querySelector('span:last-child').textContent=this.nextElementSibling.classList.contains('hidden')?'+':'−'" class="w-full text-left p-4 flex justify-between items-center hover:bg-white/5 transition"><span class="font-bold text-emerald-400">¿Qué tiene que ver Bitcoin con la justicia social?</span><span class="text-xl text-emerald-400">+</span></button><div class="hidden px-4 pb-4 text-gray-300"><p>Más de 1,700 millones de personas no tienen cuenta bancaria. No por elección — por exclusión. Bitcoin solo requiere un teléfono con internet. Es la primera tecnología monetaria que no discrimina. <strong>Soberanía financiera como derecho humano, no como privilegio.</strong></p></div></div>
            <div class="bg-[#1a1a1a] border border-white/20 rounded-xl overflow-hidden"><button onclick="this.nextElementSibling.classList.toggle('hidden');this.querySelector('span:last-child').textContent=this.nextElementSibling.classList.contains('hidden')?'+':'−'" class="w-full text-left p-4 flex justify-between items-center hover:bg-white/5 transition"><span class="font-bold text-emerald-400">¿Puede Bitcoin ser la moneda global?</span><span class="text-xl text-emerald-400">+</span></button><div class="hidden px-4 pb-4 text-gray-300"><p>Es la primera moneda que cumple los requisitos técnicos: funciona en cualquier país, es resistente a la censura, y su política monetaria es predecible y finita. No necesita reemplazar todas las monedas — necesita coexistir como una <strong>capa base neutral</strong>.</p><p><strong>La pregunta no es si puede — es cuándo la adoptaremos.</strong></p></div></div>
            <div class="bg-[#1a1a1a] border border-white/20 rounded-xl overflow-hidden"><button onclick="this.nextElementSibling.classList.toggle('hidden');this.querySelector('span:last-child').textContent=this.nextElementSibling.classList.contains('hidden')?'+':'−'" class="w-full text-left p-4 flex justify-between items-center hover:bg-white/5 transition"><span class="font-bold text-emerald-400">¿Cómo empiezo con Bitcoin?</span><span class="text-xl text-emerald-400">+</span></button><div class="hidden px-4 pb-4 text-gray-300"><p>No hay un camino único. Bitcoin es libertad, y eso incluye la libertad de elegir cómo entrar. Pero hay principios que te ayudarán:</p><p><strong>1. Estudia antes de actuar.</strong> Estás leyendo esto — buen comienzo. No te quedes con una sola fuente. Busca otras voces, otros proyectos, otros puntos de vista. Desconfía de quien te diga que solo hay una forma de hacer las cosas.</p><p><strong>2. Consigue una billetera.</strong> Busca estas cualidades: código abierto, no custodial (tú controlas las claves), compatible con Lightning Network, con respaldo por frase semilla (12 o 24 palabras). Desconfía de cualquier billetera que pida datos innecesarios, prometa rendimientos, o no publique su código. Empieza con una billetera caliente (app en teléfono) para montos pequeños; migra a una fría (dispositivo físico) cuando manejes cantidades mayores.</p><p><strong>3. Recibe tus primeros satoshis.</strong> La forma más alineada es recibirlos de otra persona: por un trabajo, una venta, un intercambio, o a través de proyectos como Take Power. También puedes comprarlos P2P (persona a persona) sin intermediarios.</p><p><strong>4. Usa Bitcoin.</strong> No lo acumules sin propósito. Envía, recibe, paga, dona. Bitcoin cobra sentido cuando circula.</p><p><strong>5. Corre tu propio nodo</strong> (cuando estés listo). No es obligatorio, pero es el acto máximo de soberanía: verificar por ti mismo que las reglas se cumplen.</p></div></div>
            <div class="bg-[#1a1a1a] border border-white/20 rounded-xl overflow-hidden"><button onclick="this.nextElementSibling.classList.toggle('hidden');this.querySelector('span:last-child').textContent=this.nextElementSibling.classList.contains('hidden')?'+':'−'" class="w-full text-left p-4 flex justify-between items-center hover:bg-white/5 transition"><span class="font-bold text-emerald-400">¿Cómo protejo mis bitcoins?</span><span class="text-xl text-emerald-400">+</span></button><div class="hidden px-4 pb-4 text-gray-300"><p>La red Bitcoin nunca ha sido hackeada. Lo que sí ha sido hackeado — una y otra vez — son las personas.</p><p><strong>Amenazas reales:</strong></p><ul><li><strong>Phishing:</strong> Sitios web o mensajes falsos que imitan billeteras para robar tus datos. Siempre verifica la URL.</li><li><strong>Estafas "duplica tus BTC":</strong> Nadie puede duplicar tus bitcoins. Nadie. Si alguien te lo promete, te está robando.</li><li><strong>Ingeniería social:</strong> Alguien que se gana tu confianza para que reveles tu frase semilla. Ningún soporte técnico legítimo te la pedirá jamás.</li><li><strong>SIM swapping:</strong> Atacantes transfieren tu número telefónico a otro chip para interceptar códigos. Usa autenticación 2FA con app, nunca con SMS.</li><li><strong>Malware:</strong> Software que modifica direcciones de Bitcoin al pegarlas. Verifica siempre los primeros y últimos caracteres antes de enviar.</li></ul><p><strong>Reglas de supervivencia:</strong> Tu frase semilla se escribe en papel o metal, nunca en fotos ni en la nube. Prueba restaurar tu billetera ANTES de guardar cantidades significativas. Usa montos pequeños para aprender.</p><p><strong>La lección de Mt. Gox y FTX:</strong> Dos exchanges gigantes colapsaron porque la gente les confió sus llaves. <strong>Si no tienes tus llaves, no tienes tus bitcoins.</strong> Un exchange no es una billetera — es un tercero que puede quebrar, ser hackeado, o robarte.</p><p><strong>¿Qué es autocustodia?</strong> Significa que tú — y solo tú — controlas las claves privadas. Frase semilla en lugar seguro que solo tú conoces. Envías y recibes sin pedir permiso a nadie. 100% responsable de tu propia seguridad. No es para todos desde el día uno — puedes empezar con custodia y migrar cuando entiendas los riesgos. Pero que sea una decisión consciente. La autocustodia es la diferencia entre usar Bitcoin y simplemente tener exposición a su precio.</p></div></div>
          </div>
        `,

      observatoryContent: `
          <p class="text-gray-400 mb-6">Bitcoin no es solo teoría. Alrededor del mundo, comunidades están construyendo economías donde Bitcoin circula de mano en mano — sin exchanges, sin bancos, sin intermediarios. Estos son algunos de los experimentos más significativos. Ninguno es perfecto. Todos son valientes.</p>
          <div class="space-y-6">
            <div class="bg-[#1a1a1a] border border-white/20 rounded-xl p-6">
              <h3 class="text-xl font-bold text-amber-400 mb-1">🏖️ Bitcoin Beach — El Zonte, El Salvador</h3>
              <p class="text-sm text-gray-500 mb-3">Desde 2019 · La primera economía circular Bitcoin del mundo</p>
              <p class="text-gray-300">Una donación anónima de Bitcoin a un pueblo costero de 3,000 habitantes inició todo. Mike Peterson y Román Martínez construyeron un ecosistema donde más de 500 familias y 120 negocios usan Bitcoin vía Lightning Network para pagos cotidianos: electricidad, almuerzos, salarios. El proyecto inspiró directamente a El Salvador a adoptar Bitcoin como moneda de curso legal en septiembre de 2021 — el primer país del mundo en hacerlo.</p>
              <p class="text-gray-400 mt-2"><strong>Desafíos hoy:</strong> Gentrificación severa — los precios del terreno se multiplicaron y algunos fundadores acumularon propiedades. Muchos comerciantes locales volvieron al efectivo. La adopción real entre salvadoreños comunes sigue siendo limitada fuera de zonas turísticas.</p>
            </div>
            <div class="bg-[#1a1a1a] border border-white/20 rounded-xl p-6">
              <h3 class="text-xl font-bold text-amber-400 mb-1">🌴 Bitcoin Jungle — Uvita/Dominical, Costa Rica</h3>
              <p class="text-sm text-gray-500 mb-3">Desde 2021 · Más de 380 comercios aceptando Bitcoin</p>
              <p class="text-gray-300">Proyecto open-source en la costa del Pacífico Sur. A diferencia de El Zonte, Costa Rica ya tiene sistema bancario estable — el problema era la fricción de pagos para turistas y expatriados. Crearon su propia billetera, integraron BTCPay Server, y lograron que mercados de agricultores, centros de conservación marina y ferreterías acepten sats. El 80% de los usuarios son costarricenses.</p>
              <p class="text-gray-400 mt-2"><strong>Desafíos hoy:</strong> Depende del turismo bitcoiner. La integración con SINPE (sistema bancario local) reduce el incentivo de mantener Bitcoin sin convertir a colones. Opera sin fines de lucro y sin financiamiento estable.</p>
            </div>
            <div class="bg-[#1a1a1a] border border-white/20 rounded-xl p-6">
              <h3 class="text-xl font-bold text-amber-400 mb-1">🏄 Bitcoin Ekasi — Mossel Bay, Sudáfrica</h3>

        introContent: `
          <p><strong>Bitcoin is a consensus technology</strong> that allows people worldwide to exchange value without intermediaries. It's not just digital money; it's a new form of social organization based on mathematics and energy.</p>
          
          <p>We can affirm that Bitcoin is the practical synthesis of the dialectical conflict between capitalism and communism. It is neither an unregulated free market nor a collectivist central planning system. It transcends the false dichotomy between individual and collective, preserving what is valid from both proposals while rejecting the pathologies of their extremes: centralized capital accumulation, state coercion, institutional surveillance, and systemic exploitation. Its legitimacy is born from the bottom up, from voluntary participation, not from hierarchical decree. As in <a href="/natura/" style="color: inherit; text-decoration: none; cursor: text;">pantheism</a>, authority and truth do not reside "up there," but "in here," in each participant and in the network as a whole.</p>
          
          <h3>The essentials</h3>
          <ul>
            <li><strong>Decentralized:</strong> No central bank, government, or company controls it. The network is maintained by thousands of computers (called nodes) distributed worldwide. Each node has a complete copy of every transaction since 2009.</li>
            <li><strong>Finite:</strong> Like Earth's resources, Bitcoin is finite—only 21 million bitcoins will ever exist, never more. This means there's a real risk of scarcity if we don't take responsibility for caring for them. This limit is mathematically guaranteed by the code all participants run.</li>
            <li><strong>Transparent:</strong> All transactions are public and verifiable by anyone. No secret accounts or hidden privileges. No one can falsify the record.</li>
            <li><strong>Open:</strong> Bitcoin is <strong>open source</strong>, meaning anyone can read, audit, and propose improvements to the software. No secrets or backdoors. Thousands of programmers worldwide have reviewed every line of code. This technical transparency is the foundation of trust: you don't need to believe anyone, you can verify it yourself.</li>
            <li><strong>Social energy:</strong> Each bitcoin represents real computational work—energy transformed into digital value. Remember that energy is neither created nor destroyed, only transformed. Bitcoin is precisely that transformation, mathematically adjusted to preserve value through time. That's why we say <strong>Bitcoin is social energy frozen in time</strong>.</li>
            <li>📖 Further reading: <a href="https://dergigi.com/2021/01/14/bitcoin-is-time/" target="_blank" class="text-emerald-400 hover:underline">"Bitcoin is Time" — Gigi</a></li>
          </ul>
          
          <h3>How does it work?</h3>
          <p>Imagine a giant ledger that everyone can read, but no one can erase or falsify. This ledger is called the <strong>blockchain</strong>. Approximately every 10 minutes, a new page (block) is added with the latest transactions.</p>
          
          <p>To add a page, computers worldwide compete by solving a complex mathematical problem. The first to solve it wins the right to write the page and receives new bitcoins as reward. This process is called <strong>mining</strong>.</p>
          
          <p>But mining isn't like extracting gold—it's more like voting with energy. The more energy you contribute to the network, the more weight your vote has in validating transactions. It's a system where honesty is more profitable than cheating, because cheating would require more energy than playing fair.</p>
          
          <p>Like any form of money, Bitcoin has utility as long as people trust the community that supports it and as long as it functions as a medium of exchange. The difference is that this trust isn't placed in a bank or government, but in cryptographic proof verified by millions of volunteers.</p>
          
          <h3>Hashpower: Mathematical security</h3>
          <p>Bitcoin's security doesn't depend on armed guards or steel vaults, but on pure mathematics. At the heart of this security is <strong>Proof of Work</strong>, which works like this:</p>
          
          <p>Each block of transactions must include a special number called a <strong>nonce</strong>. Miners try millions of nonces per second until they find one that, when combined with the block data and passed through the SHA-256 algorithm, produces a <strong>hash</strong> (a 256-bit digital fingerprint) that starts with a certain number of zeros. Finding this hash is extraordinarily difficult—requires trillions of attempts—but verifying it's correct is instant. This asymmetry is key: lots of work to create, easy to verify.</p>
          
          <p><strong>Hashpower</strong> measures the total computational power dedicated to this task. Currently, the Bitcoin network processes over 500 exahashes per second (500,000,000,000,000,000,000 calculations per second). To hack the network, an attacker would need to surpass all that combined power—something requiring more electricity than entire countries and billions of dollars in specialized hardware.</p>
          
          <p><strong>Miners and Nodes: different roles, same mission</strong></p>
          <ul>
            <li><strong>Miners:</strong> Compete to add new blocks to the chain. They invest en hardware (ASICs) and electricity. In return, they receive new bitcoins (currently 3.125 BTC per block) plus the fees from included transactions. They're the ones who "write" new pages in the ledger.</li>
            <li><strong>Nodes:</strong> Store a complete copy of the entire blockchain and verify that every transaction and block follows the rules. They don't receive direct economic reward, but they're the guardians of the rules. If a miner tries to cheat, nodes will reject their block. Anyone can run a node from their home computer.</li>
          </ul>
          <p>This separation of powers is crucial: miners propose, nodes validate. Neither can act without the other. It's a system of checks and balances where mathematics replaces the need to trust authorities.</p>
          
          <p><strong>The Halving: programmed scarcity</strong></p>
          <p>Every 210,000 blocks (approximately every 4 years), the reward miners receive is cut in half. This event is called the <strong>halving</strong>. It started at 50 BTC per block in 2009, then 25 (2012), 12.5 (2016), 6.25 (2020), and currently 3.125 BTC (2024). This programmed reduction guarantees that no more than 21 million bitcoins will ever exist and that issuance is predictable and decreasing—the opposite of fiat currencies where central banks can print without limit. The halving is the mechanism that makes Bitcoin the scarcest asset ever created by humanity.</p>
          
          <h3>Bitcoin's hidden geometry</h3>
          <p>At the heart of every Bitcoin wallet beats an elegant mathematical structure: the <strong>elliptic curve</strong>. Bitcoin uses a specific curve called <strong>secp256k1</strong>, defined by the equation y² = x³ + 7 over a finite field of prime numbers. This curve wasn't chosen randomly: its parameters were constructed in a predictable and verifiable way, reducing the possibility of hidden backdoors — unlike other curves promoted by government agencies.</p>
          
          <p>When you create a Bitcoin wallet, the software generates a <strong>private key</strong>: a random 256-bit number (a number with up to 77 digits). From this private key, a geometric operation is performed on the elliptic curve: a known point called the <strong>Generator Point (G)</strong> is "added" to itself as many times as your private key indicates. The result is your <strong>public key</strong> — a new point on the curve.</p>
          
          <p>The security lies in a fundamental asymmetry called the <strong>Elliptic Curve Discrete Logarithm Problem (ECDLP)</strong>: multiplying a point by a number is computationally easy (your computer does it in milliseconds), but given the result, deducing how many times it was multiplied is computationally impossible — not even all the world's computers working for millions of years could solve it.</p>
          
          <p>This one-way relationship is a <strong>trapdoor function</strong>. You can verify that someone possesses the correct key without them revealing it, but you cannot deduce it by observing the public key. The prime field over which the curve operates — a prime number close to 2²⁵⁶ — ensures the space of possible keys is astronomically vast, offering 128 bits of effective security.</p>

          <p>The secp256k1 elliptic curve is Bitcoin's hidden heart. It's not just a technical detail; it's the cornerstone of its security, its ownership scheme, and its philosophy. It represents the triumph of a verifiable, objective mathematical order over systems of subjective, hierarchical trust. Satoshi didn't invent a currency; he coded a system of property and truth in the most fundamental language we know: pure mathematics.</p>
          
          <p>Understanding this is understanding that Bitcoin isn't just an asset, but the digital embodiment of a philosophical principle: that the foundation of a just social system, resistant to corruption, can be an immutable truth, open to all and owned by none.</p>

          <p>To make this key manageable, it's represented as a <strong>seed phrase</strong> of 12 or 24 words in a specific order. For example: "tree moon fish mountain river cloud sun stone wind sea earth fire". Whoever has these words has total access to the funds. There's no way to recover them if lost—neither Satoshi, nor any government, nor anyone can help you.</p>
          
          <p>This responsibility has real consequences. It's estimated that between 3 and 4 million bitcoins (approximately 17-19% of the total that will exist) are lost forever: people who forgot their passwords, threw away old hard drives, or died without leaving instructions. The most famous case is James Howells, who in 2013 threw away a hard drive with 8,000 BTC—today it would be worth hundreds of millions of dollars and remains buried in a Welsh landfill.</p>

          <p>Bitcoin inverts this logic: no one can create more bitcoins than programmed, no one can freeze your account if you hold your keys, and anyone with a phone can participate in the global economy. Being free from State control, Bitcoin returns power to ordinary people so they're not pawns in power struggles between nations, corporations, or financial elites.</p>

          <p>Think of Lightning as a network of payment channels. Imagine you and your neighbor trade frequently. Instead of recording each transaction on the blockchain (slow and with fees), you open a "channel" by depositing funds in a shared address. Now you can exchange value instantly between yourselves, updating only the channel's internal balance. When you want to close the channel, the blockchain records only the final state.</p>

              <p class="text-xs text-gray-500 mt-2 text-center">Source: Bitcoin Whitepaper</p>

        risksTitle: "Bitcoin Risks & Challenges",
        risksSubtitle: "Bitcoin is not perfect. Understanding its risks is part of understanding it.",
        risksContent: `
          <h2>Hashpower centralization</h2>
          <p>Although Bitcoin is decentralized by design, mining has concentrated in two ways: in <strong>mining pools</strong> (the top 4 control over 50% of global hashrate) and <strong>geographically</strong> (mining migrates to where electricity is cheapest).</p>
          <p>In 2021, China held over 65% of global hashrate. When the government banned mining, the network lost half its computing power in weeks — but recovered fully within months, with miners migrating to the US, Kazakhstan, Russia, and Canada. The network proved antifragile: each blow makes it more distributed.</p>
          <p>Each individual miner can switch pools in minutes, limiting pool operators' real power. But if a government pressures the largest pools, it could temporarily influence which transactions are processed.</p>
          <p><strong>Why it matters:</strong> Bitcoin works best when hashpower is distributed across many participants in many jurisdictions. The ideal solution is mining distributed among many small countries using local renewable energy. Hashpower concentration mirrors power concentration — and Bitcoin exists to fight exactly that.</p>

          <h2>51% attack</h2>
          <p>If an entity controls over 50% of the network's computing power, it could theoretically rewrite recent blocks and perform <strong>double spending</strong>. However:</p>
          <ul>
            <li>The cost is astronomical — billions in hardware and electricity.</li>
            <li>Maintaining the attack costs even more than executing it.</li>
            <li>A successful attack would destroy network confidence, crashing the price and destroying the attacker's own investment.</li>
            <li>Nodes could reject attacker blocks through an emergency update.</li>
          </ul>
          <p>A real theoretical risk, but economically irrational. Never achieved in 16 years. The irony: the more valuable Bitcoin becomes, the more expensive — and therefore improbable — it becomes to attack.</p>

          <h2>Whales and wealth concentration</h2>
          <p>About 2% of Bitcoin addresses hold over 90% of all circulating bitcoins. Many belong to exchanges, investment funds, and early miners.</p>
          <p>This concentration contradicts the promise of democratizing money. However:</p>
          <ul>
            <li>Many "large" addresses are exchange cold wallets custodying funds of millions of users.</li>
            <li>Distribution improves over time as more people adopt Bitcoin.</li>
            <li>Unlike fiat, concentration is visible and verifiable — nobody can hide holdings in secret accounts.</li>
          </ul>
          <p><strong>Take Power</strong> exists precisely to combat this concentration: redistributing sats to those without access.</p>

          <h2>The transition challenge</h2>
          <p>Governments can try to ban or restrict Bitcoin. China did it with mining. India threatened it. The EU has debated restrictive regulations.</p>
          <p>But Bitcoin is, at its core, <strong>coded civil disobedience</strong>. It doesn't ask permission to exist. If adoption reaches critical mass, regulation becomes as futile as trying to ban the internet. History shows that technologies empowering people prevail over decrees trying to stop them.</p>
          <p>However, in the current low-adoption phase, restrictions can hinder everyday access and push users underground. The real challenge isn't regulation itself — it's reaching critical mass before power structures can react.</p>

          <h2>Connectivity</h2>
          <p>No internet, no Bitcoin. And <strong>a third of humanity still lacks internet access</strong>. This is perhaps the most real and least discussed challenge: the infrastructure needed to participate in Bitcoin depends on another centralized network — telecom providers and submarine cables controlled by corporations and governments.</p>
          <p>Promising developments exist: Bitcoin transactions via radio, satellites (Blockstream Satellite broadcasts the full blockchain), and decentralized mesh networks. But the reality is that digital financial sovereignty requires connectivity sovereignty. <strong>No financial freedom without communication freedom.</strong></p>
          <p>This challenge connects directly to wealth redistribution: those who need Bitcoin most are precisely those with least access to the infrastructure to use it.</p>

          <h2>Quantum computing</h2>
          <p>Quantum computers, when powerful enough, could break the cryptography protecting Bitcoin's private keys. But this isn't exclusive to Bitcoin — <strong>it's a risk for all digital civilization</strong>: banking, military communications, medical records, critical infrastructure.</p>
          <p>The Bitcoin community is already working on post-quantum algorithms. But the deeper challenge is: <strong>civil society's appropriation of quantum technology</strong>. If only states and corporations access it, the power imbalance will be devastating — with or without Bitcoin.</p>

          <h2>Volatility</h2>
          <p>Bitcoin remains extremely volatile. Its price can swing 20% in days. This makes it risky as a short-term store of value and difficult as daily payment.</p>
          <p>But perhaps we're measuring with the wrong stick. When we say "Bitcoin is volatile," we're really saying <strong>its price in dollars fluctuates</strong>. But the dollar itself constantly loses value to inflation — we're so used to measuring everything in dollars we don't notice the ruler is shrinking.</p>
          <p>Measured in energy (megajoules), Bitcoin's volatility drops significantly because the energy cost of mining is relatively stable. The <a href="/energy/" style="color: #f7931a;">Energy Standard</a> proposes exactly this: measuring value in energy units, not fiat currencies central banks can dilute at will.</p>
          <p>Meanwhile, Bitcoin users must be prepared for severe fiat-price fluctuations.</p>

          <h2>Responsibility and ethics</h2>
          <p>In Bitcoin, <strong>"your keys, your coins"</strong>. Lose your private key, lose your bitcoins forever. No bank, no customer service, no "forgot my password" button. An estimated 3-4 million bitcoins are permanently lost.</p>
          <p>But responsibility goes beyond custody. Having sovereignty over your money also implies <strong>ethical responsibility for how you use it</strong>.</p>
          <p>Think about animals. For millennia they served to expand our technical capacity: cargo, transport, food. Thanks to them we built civilizations. But instead of honoring that service, we turned them into industrial production machines — slaughtering them without assuming the responsibility of being, as a species, the mind of the Earth organism. Like a brain commanding punishment of its own flesh.</p>
          <p>Bitcoin gives us new power: money without intermediaries, wealth without permission. But power without ethics is just another form of oppression. The question isn't just <em>how do I store my bitcoins?</em> but <em>what do I use them for? Do I contribute to redistribution or concentration? Do I serve life or exploit it?</em></p>

          <h2>Final reflection</h2>
          <p>No technology is perfect. Bitcoin is a living paradigm shift, the most ambitious in human history. Knowing its risks doesn't weaken the proposal — it strengthens it. An informed user makes better decisions and contributes to a more resilient network.</p>
          <p><strong>Honesty is the foundation of trust. And trust is the foundation of money.</strong></p>
        `,
        navFaq: "FAQ",
        faqTitle: "Frequently Asked Questions",
        faqSubtitle: "The essentials about Bitcoin, its use, and its transformative potential.",
        faqContent: `
          <div class="space-y-3">
            <div class="bg-[#1a1a1a] border border-white/20 rounded-xl overflow-hidden"><button onclick="this.nextElementSibling.classList.toggle('hidden');this.querySelector('span:last-child').textContent=this.nextElementSibling.classList.contains('hidden')?'+':'−'" class="w-full text-left p-4 flex justify-between items-center hover:bg-white/5 transition"><span class="font-bold text-emerald-400">Is Bitcoin real money?</span><span class="text-xl text-emerald-400">+</span></button><div class="hidden px-4 pb-4 text-gray-300"><p>Yes. A decentralized digital ledger verified by thousands of computers. Running without interruption since 2009.</p></div></div>
            <div class="bg-[#1a1a1a] border border-white/20 rounded-xl overflow-hidden"><button onclick="this.nextElementSibling.classList.toggle('hidden');this.querySelector('span:last-child').textContent=this.nextElementSibling.classList.contains('hidden')?'+':'−'" class="w-full text-left p-4 flex justify-between items-center hover:bg-white/5 transition"><span class="font-bold text-emerald-400">Who controls Bitcoin?</span><span class="text-xl text-emerald-400">+</span></button><div class="hidden px-4 pb-4 text-gray-300"><p>Nobody — and everyone. Open-source software, consensus-based changes. The most democratic monetary system ever. But: <strong>there's nobody to complain to</strong>. Lose your keys, lose your bitcoins.</p></div></div>
                                    <div class="bg-[#1a1a1a] border border-white/20 rounded-xl overflow-hidden"><button onclick="this.nextElementSibling.classList.toggle('hidden');this.querySelector('span:last-child').textContent=this.nextElementSibling.classList.contains('hidden')?'+':'−'" class="w-full text-left p-4 flex justify-between items-center hover:bg-white/5 transition"><span class="font-bold text-emerald-400">Why use Bitcoin peer-to-peer (P2P)?</span><span class="text-xl text-emerald-400">+</span></button><div class="hidden px-4 pb-4 text-gray-300"><p>Bitcoin was designed to circulate among people. <strong>As long as Bitcoin flows hand to hand among the people, economic power stays with the people.</strong> The moment you deposit it in an exchange, that power returns to the institutions Bitcoin seeks to transcend. <strong>Don't sell your sats for dollars — find someone who accepts them.</strong></p></div></div>
                        <div class="bg-[#1a1a1a] border border-white/20 rounded-xl overflow-hidden"><button onclick="this.nextElementSibling.classList.toggle('hidden');this.querySelector('span:last-child').textContent=this.nextElementSibling.classList.contains('hidden')?'+':'−'" class="w-full text-left p-4 flex justify-between items-center hover:bg-white/5 transition"><span class="font-bold text-emerald-400">Is Bitcoin legal?</span><span class="text-xl text-emerald-400">+</span></button><div class="hidden px-4 pb-4 text-gray-300"><p>Does it matter? <strong>No server to shut down, no company to close, no CEO to arrest.</strong> Thousands of nodes across dozens of countries. <strong>Regulation doesn't stop adoption — it only temporarily slows it.</strong> Nobody could ban the printing press, radio, or internet. Bitcoin is next.</p></div></div>
            <div class="bg-[#1a1a1a] border border-white/20 rounded-xl overflow-hidden"><button onclick="this.nextElementSibling.classList.toggle('hidden');this.querySelector('span:last-child').textContent=this.nextElementSibling.classList.contains('hidden')?'+':'−'" class="w-full text-left p-4 flex justify-between items-center hover:bg-white/5 transition"><span class="font-bold text-emerald-400">Why does Bitcoin end senseless accumulation?</span><span class="text-xl text-emerald-400">+</span></button><div class="hidden px-4 pb-4 text-gray-300"><p>Fiat money is printed without limit, incentivizing hoarding. Bitcoin's 21 million cap means <strong>you don't need to hoard to protect against inflation</strong>. Instead of accumulating out of fear, you can <strong>circulate out of trust</strong>. <strong>Bitcoin doesn't prohibit wealth — it eliminates the pathological need to accumulate it.</strong></p></div></div>
                                    <div class="bg-[#1a1a1a] border border-white/20 rounded-xl overflow-hidden"><button onclick="this.nextElementSibling.classList.toggle('hidden');this.querySelector('span:last-child').textContent=this.nextElementSibling.classList.contains('hidden')?'+':'−'" class="w-full text-left p-4 flex justify-between items-center hover:bg-white/5 transition"><span class="font-bold text-emerald-400">Doesn't Bitcoin waste too much energy?</span><span class="text-xl text-emerald-400">+</span></button><div class="hidden px-4 pb-4 text-gray-300"><p>The real question: <strong>what is that energy used for?</strong> Over 50% of mining uses renewable energy. Bitcoin incentivizes the search for cheap, often renewable energy.</p></div></div>
            <div class="bg-[#1a1a1a] border border-white/20 rounded-xl overflow-hidden"><button onclick="this.nextElementSibling.classList.toggle('hidden');this.querySelector('span:last-child').textContent=this.nextElementSibling.classList.contains('hidden')?'+':'−'" class="w-full text-left p-4 flex justify-between items-center hover:bg-white/5 transition"><span class="font-bold text-emerald-400">How can Bitcoin finance climate adaptation?</span><span class="text-xl text-emerald-400">+</span></button><div class="hidden px-4 pb-4 text-gray-300"><p>Climate adaptation requires direct resource transfer to vulnerable communities — those banks exclude. <strong>Bitcoin is the financial infrastructure climate adaptation needs.</strong></p><p>But deeper: climate adaptation requires countries to coordinate — only possible with peace. Bitcoin, as a neutral currency, can be the common financial architecture enabling that cooperation. <strong>Peace is not a prerequisite for climate change — it's its condition of possibility.</strong></p></div></div>
            <div class="bg-[#1a1a1a] border border-white/20 rounded-xl overflow-hidden"><button onclick="this.nextElementSibling.classList.toggle('hidden');this.querySelector('span:last-child').textContent=this.nextElementSibling.classList.contains('hidden')?'+':'−'" class="w-full text-left p-4 flex justify-between items-center hover:bg-white/5 transition"><span class="font-bold text-emerald-400">What does Bitcoin have to do with social justice?</span><span class="text-xl text-emerald-400">+</span></button><div class="hidden px-4 pb-4 text-gray-300"><p>1.7+ billion people are unbanked. Not by choice — by exclusion. Bitcoin only needs a phone with internet. <strong>Financial sovereignty as a human right, not a privilege.</strong></p></div></div>
            <div class="bg-[#1a1a1a] border border-white/20 rounded-xl overflow-hidden"><button onclick="this.nextElementSibling.classList.toggle('hidden');this.querySelector('span:last-child').textContent=this.nextElementSibling.classList.contains('hidden')?'+':'−'" class="w-full text-left p-4 flex justify-between items-center hover:bg-white/5 transition"><span class="font-bold text-emerald-400">Can Bitcoin become the global currency?</span><span class="text-xl text-emerald-400">+</span></button><div class="hidden px-4 pb-4 text-gray-300"><p>First currency meeting all technical requirements. Needs to coexist as a <strong>neutral base layer</strong>. <strong>The question isn't whether it can — it's when we'll adopt it.</strong></p></div></div>
            <div class="bg-[#1a1a1a] border border-white/20 rounded-xl overflow-hidden"><button onclick="this.nextElementSibling.classList.toggle('hidden');this.querySelector('span:last-child').textContent=this.nextElementSibling.classList.contains('hidden')?'+':'−'" class="w-full text-left p-4 flex justify-between items-center hover:bg-white/5 transition"><span class="font-bold text-emerald-400">How do I get started with Bitcoin?</span><span class="text-xl text-emerald-400">+</span></button><div class="hidden px-4 pb-4 text-gray-300"><p>There's no single path. Bitcoin is freedom, and that includes the freedom to choose how you enter. But there are principles that will help:</p><p><strong>1. Study before acting.</strong> You're reading this — good start. Don't rely on a single source. Seek other voices, other projects, other perspectives. Distrust anyone who tells you there's only one way to do things.</p><p><strong>2. Get a wallet.</strong> Look for these qualities: open source, non-custodial (you control the keys), Lightning Network compatible, backed by a seed phrase (12 or 24 words). Distrust any wallet that asks for unnecessary data, promises returns, or doesn't publish its code. Start with a hot wallet (phone app) for small amounts; move to a cold wallet (physical device) when handling larger sums.</p><p><strong>3. Receive your first satoshis.</strong> The most aligned way is to receive them from another person: for a job, a sale, a trade, or through projects like Take Power. You can also buy them P2P (peer-to-peer) without intermediaries.</p><p><strong>4. Use Bitcoin.</strong> Don't hoard it without purpose. Send, receive, pay, donate. Bitcoin makes sense when it circulates.</p><p><strong>5. Run your own node</strong> (when you're ready). Not mandatory, but it's the ultimate act of sovereignty: verifying for yourself that the rules are being followed.</p></div></div>
            <div class="bg-[#1a1a1a] border border-white/20 rounded-xl overflow-hidden"><button onclick="this.nextElementSibling.classList.toggle('hidden');this.querySelector('span:last-child').textContent=this.nextElementSibling.classList.contains('hidden')?'+':'−'" class="w-full text-left p-4 flex justify-between items-center hover:bg-white/5 transition"><span class="font-bold text-emerald-400">How do I protect my bitcoins?</span><span class="text-xl text-emerald-400">+</span></button><div class="hidden px-4 pb-4 text-gray-300"><p>The Bitcoin network has never been hacked. What has been hacked — over and over — is people.</p><p><strong>Real threats:</strong></p><ul><li><strong>Phishing:</strong> Fake websites or messages mimicking wallets to steal your data. Always verify the URL.</li><li><strong>"Double your BTC" scams:</strong> Nobody can double your bitcoins. Nobody. If someone promises this, they're stealing from you.</li><li><strong>Social engineering:</strong> Someone gaining your trust to get you to reveal your seed phrase. No legitimate support will ever ask for it.</li><li><strong>SIM swapping:</strong> Attackers transfer your phone number to another chip to intercept codes. Use 2FA with an app, never with SMS.</li><li><strong>Malware:</strong> Software that modifies Bitcoin addresses when you paste them. Always verify the first and last characters before sending.</li></ul><p><strong>Survival rules:</strong> Your seed phrase is written on paper or metal, never in photos or the cloud. Test restoring your wallet BEFORE storing significant amounts. Use small amounts to learn.</p><p><strong>The lesson of Mt. Gox and FTX:</strong> Two giant exchanges collapsed because people trusted them with their keys. <strong>If you don't have your keys, you don't have your bitcoins.</strong> An exchange is not a wallet — it's a third party that can go bankrupt, get hacked, or steal from you.</p><p><strong>What is self-custody?</strong> It means you — and only you — control the private keys. Seed phrase in a safe place only you know. You send and receive without asking anyone's permission. 100% responsible for your own security. It's not for everyone on day one — you can start custodial and migrate when you understand the risks. But make it a conscious decision. Self-custody is the difference between using Bitcoin and merely having price exposure.</p></div></div>
          </div>
        `,
