          <li><strong>Énergie sociale:</strong> Chaque bitcoin représente un travail computationnel réel—de l'énergie transformée en valeur numérique. Rappelons que l'énergie ne se crée ni ne se détruit, elle se transforme seulement. Bitcoin est précisément cette transformation, ajustée mathématiquement pour préserver la valeur à travers le temps. C'est pourquoi nous disons que <strong>Bitcoin est de l'énergie sociale gelée dans le temps</strong>.</li>
            <li>📖 Pour approfondir : <a href="https://dergigi.com/2021/01/14/bitcoin-is-time/" target="_blank" class="text-emerald-400 hover:underline">"Bitcoin is Time" — Gigi</a></li>
        </ul>
        
        <h3>Comment ça fonctionne?</h3>
        <p>Imaginez un grand livre comptable que tout le monde peut lire, mais que personne ne peut effacer ou falsifier. Ce livre s'appelle la <strong>blockchain</strong> (chaîne de blocs). Environ toutes les 10 minutes, une nouvelle page (bloc) est ajoutée avec les dernières transactions.</p>
        
        <p>Pour ajouter une page, des ordinateurs du monde entier rivalisent en résolvant un problème mathématique complexe. Le premier à le résoudre gagne le droit d'écrire la page et reçoit de nouveaux bitcoins en récompense. Ce processus s'appelle le <strong>minage</strong>.</p>
        
        <p>Mais le minage n'est pas comme extraire de l'or—c'est plutôt comme voter avec de l'énergie. Plus vous apportez d'énergie au réseau, plus votre vote pour valider les transactions a de poids. C'est un système où l'honnêteté est plus rentable que la triche, car tricher nécessiterait plus d'énergie que jouer franc jeu.</p>
        
        <p>Comme toute forme d'argent, Bitcoin a une utilité tant que les gens font confiance à la communauté qui le soutient et tant qu'il est fonctionnel comme moyen d'échange. La différence est que cette confiance n'est pas placée dans une banque ou un gouvernement, mais dans une preuve cryptographique vérifiée par des millions de volontaires.</p>
        
        <h3>Hashpower: La sécurité mathématique</h3>
        <p>La sécurité de Bitcoin ne dépend pas de gardes armés ni de coffres en acier, mais de mathématiques pures. Le cœur de cette sécurité est la <strong>preuve de travail</strong> (Proof of Work), qui fonctionne ainsi:</p>
        
        <p>Chaque bloc de transactions doit inclure un nombre spécial appelé <strong>nonce</strong>. Les mineurs testent des millions de nonces par seconde jusqu'à en trouver un qui, combiné avec les données du bloc et passé par l'algorithme SHA-256, produise un <strong>hash</strong> (une empreinte digitale de 256 bits) commençant par un certain nombre de zéros. Trouver ce hash est extraordinairement difficile—cela nécessite des billions d'essais—mais vérifier qu'il est correct est instantané. Cette asymétrie est la clé: beaucoup de travail pour créer, facile à vérifier.</p>
        
        <p>Le <strong>hashpower</strong> est la mesure de la puissance de calcul totale dédiée à cette tâche. Actuellement, le réseau Bitcoin traite plus de 500 exahashes par seconde (500 000 000 000 000 000 000 calculs par seconde). Pour pirater le réseau, un attaquant devrait surpasser toute cette puissance combinée—ce qui nécessiterait plus d'électricité que des pays entiers et un investissement de milliards de dollars en matériel spécialisé.</p>
        
        <p><strong>Mineurs et Nœuds: rôles différents, même mission</strong></p>
        <ul>
          <li><strong>Mineurs:</strong> Ils rivalisent pour ajouter de nouveaux blocs à la chaîne. Ils investissent dans du matériel (ASICs) et de l'électricité. En échange, ils reçoivent de nouveaux bitcoins (actuellement 3,125 BTC par bloc) plus les frais des transactions incluses. Ce sont eux qui "écrivent" de nouvelles pages dans le livre comptable.</li>
          <li><strong>Nœuds:</strong> Ils stockent une copie complète de toute la blockchain et vérifient que chaque transaction et bloc respecte les règles. Ils ne reçoivent pas de récompense économique directe, mais sont les gardiens des règles. Si un mineur essaie de tricher, les nœuds rejetteront son bloc. N'importe qui peut faire tourner un nœud depuis son ordinateur de maison.</li>
        </ul>
        <p>Cette séparation des pouvoirs est cruciale: les mineurs proposent, les nœuds valident. Aucun ne peut agir sans l'autre. C'est un système de contrôles et d'équilibres où les mathématiques remplacent le besoin de faire confiance aux autorités.</p>
        
        <p><strong>Le Halving: rareté programmée</strong></p>
        <p>Tous les 210 000 blocs (environ tous les 4 ans), la récompense que reçoivent les mineurs est divisée par deux. Cet événement s'appelle le <strong>halving</strong>. Il a commencé à 50 BTC par bloc en 2009, puis 25 (2012), 12,5 (2016), 6,25 (2020), et actuellement 3,125 BTC (2024). Cette réduction programmée garantit qu'il n'existera jamais plus de 21 millions de bitcoins et que l'émission soit prévisible et décroissante—l'opposé des monnaies fiat où les banques centrales peuvent imprimer sans limite. Le halving est le mécanisme qui fait de Bitcoin l'actif le plus rare jamais créé par l'humanité.</p>
        
        <h3>La géométrie cachée du Bitcoin</h3>
        <p>Au cœur de chaque portefeuille Bitcoin bat une structure mathématique élégante : la <strong>courbe elliptique</strong>. Bitcoin utilise une courbe spécifique appelée <strong>secp256k1</strong>, définie par l'équation y² = x³ + 7 sur un corps fini de nombres premiers. Cette courbe n'a pas été choisie au hasard : ses paramètres ont été construits de manière prévisible et vérifiable, réduisant la possibilité de portes dérobées — contrairement à d'autres courbes promues par des agences gouvernementales.</p>
        
        <p>Quand vous créez un portefeuille Bitcoin, le logiciel génère une <strong>clé privée</strong> : un nombre aléatoire de 256 bits (un nombre pouvant atteindre 77 chiffres). À partir de cette clé privée, une opération géométrique est effectuée sur la courbe elliptique : un point connu appelé <strong>Point Générateur (G)</strong> est « additionné » à lui-même autant de fois que votre clé privée l'indique. Le résultat est votre <strong>clé publique</strong> — un nouveau point sur la courbe.</p>
        
        <p>La sécurité repose sur une asymétrie fondamentale appelée le <strong>Problème du Logarithme Discret sur les Courbes Elliptiques (ECDLP)</strong> : multiplier un point par un nombre est computationnellement facile (votre ordinateur le fait en millisecondes), mais étant donné le résultat, déduire combien de fois il a été multiplié est computationnellement impossible — même tous les ordinateurs du monde travaillant pendant des millions d'années ne pourraient le résoudre.</p>
        
        <p>Cette relation unidirectionnelle est une <strong>fonction à trappe</strong> (<em>trapdoor function</em>). Vous pouvez vérifier que quelqu'un possède la bonne clé sans qu'elle soit révélée, mais vous ne pouvez pas la déduire en observant la clé publique. Le corps premier sur lequel la courbe opère — un nombre premier proche de 2²⁵⁶ — garantit que l'espace des clés possibles est astronomiquement vaste, offrant 128 bits de sécurité effective.</p>
        
        <p><strong>C'est le pont entre le physique et le numérique :</strong> pour « posséder » du bitcoin, vous devez posséder un nombre secret qui a une relation géométrique spécifique avec la courbe. La possession devient connaissance, pas un objet physique. C'est une propriété métaphysique — vous n'avez pas de bitcoins « stockés » quelque part ; vous avez la connaissance mathématique qui vous permet de les déplacer.</p>
        
        <p>La courbe elliptique secp256k1 est le cœur caché de Bitcoin. Ce n'est pas seulement un détail technique ; c'est la pierre angulaire de sa sécurité, de son schéma de propriété et de sa philosophie. Il représente le triomphe d'un ordre mathématique vérifiable et objectif sur les systèmes de confiance subjective et hiérarchique. Satoshi n'a pas inventé une monnaie ; il a codé un système de propriété et de vérité dans le langage le plus fondamental que nous connaissions : les mathématiques pures.</p>
        
        <p>Comprendre cela, c'est comprendre que Bitcoin n'est pas seulement un actif, mais l'incarnation numérique d'un principe philosophique : que la base d'un système social juste et résistant à la corruption peut être une vérité immuable, ouverte à tous et propriété de personne.</p>
        
        <h3>Responsabilité partagée: Vos clés, votre argent</h3>
        <p>Dans Bitcoin, il n'y a pas de comptes bancaires ni de mots de passe que vous pouvez récupérer en appelant le service client. Votre accès à vos fonds dépend d'une <strong>clé privée</strong>: un nombre secret de 256 bits qui vous donne un contrôle absolu sur vos bitcoins.</p>
        
        <p>Pour rendre cette clé gérable, elle est représentée comme une <strong>phrase de récupération</strong> de 12 ou 24 mots dans un ordre spécifique. Par exemple: "arbre lune poisson montagne rivière nuage soleil pierre vent mer terre feu". Quiconque possède ces mots a un accès total aux fonds. Il n'y a aucun moyen de les récupérer si elles sont perdues—ni Satoshi, ni aucun gouvernement, ni personne ne peut vous aider.</p>
        
        <p>Cette responsabilité a des conséquences réelles. On estime qu'entre 3 et 4 millions de bitcoins (environ 17-19% du total qui existera) sont perdus pour toujours: des personnes qui ont oublié leurs mots de passe, jeté de vieux disques durs, ou sont mortes sans laisser d'instructions. Le cas le plus célèbre est celui de James Howells, qui en 2013 a jeté un disque dur contenant 8 000 BTC—aujourd'hui, cela vaudrait des centaines de millions de dollars et reste enterré dans une décharge au Pays de Galles.</p>
        
        <p>Chaque bitcoin perdu est de l'énergie sociale qui cesse de circuler, de la richesse qui se fige définitivement. C'est pourquoi la responsabilité dans Bitcoin n'est pas seulement personnelle mais <strong>collective</strong>: prendre soin de vos clés, c'est prendre soin d'une ressource finie qui appartient à l'humanité. La responsabilité est de faire circuler l'énergie, pas de la laisser stagner—et encore moins de la perdre pour toujours.</p>
        
        <h3>L'attaque des 51%</h3>
        <p>Si un groupe de mineurs contrôlait plus de 50% de la puissance de calcul du réseau, ils pourraient théoriquement manipuler des transactions récentes. C'est ce qu'on appelle une <strong>attaque des 51%</strong>. En pratique, c'est économiquement irrationnel : il coûterait plus cher d'attaquer le réseau que ce qui pourrait être obtenu, et l'attaquant détruirait la valeur de son propre investissement. Vous pouvez en savoir plus sur ce risque et d'autres dans la section <strong>Risques et défis</strong>.</p>
        
        <h3>La plus petite unité</h3>
        <p>Un bitcoin se divise en 100 000 000 unités appelées <strong>satoshis</strong> (ou "sats"), en hommage à son créateur. Ce sont comme les centimes du bitcoin, mais beaucoup plus divisibles. Cela permet des micropaiements qui seraient impossibles avec l'argent traditionnel—vous pouvez envoyer l'équivalent de fractions de centime n'importe où dans le monde.</p>
        <p class="text-center text-lg font-bold text-amber-400 my-4">1 BTC = 100 000 000 sats</p>
        
        <h3>Pourquoi est-il différent de l'argent traditionnel?</h3>
        <p>L'argent que nous utilisons normalement (dollars, euros) est créé par des banques centrales qui peuvent en imprimer davantage quand elles le veulent. Cela provoque l'<strong>inflation</strong>: chaque année, votre argent vaut moins. Les gouvernements peuvent geler les comptes, les banques peuvent refuser des services, et le système financier exclut des milliards de personnes.</p>
        
        <p>Bitcoin inverse cette logique: personne ne peut créer plus de bitcoins que prévu, personne ne peut geler votre compte si vous détenez vos clés, et toute personne avec un téléphone peut participer à l'économie mondiale. En étant libre du contrôle des États, Bitcoin redonne le pouvoir aux gens ordinaires pour ne pas être des pions dans les luttes de pouvoir entre nations, corporations ou élites financières.</p>
        
        <h3>Scalabilité: Lightning Network</h3>
        <p>Bitcoin peut traiter environ 7 transactions par seconde sur sa couche de base—suffisant pour être de l'"or numérique", mais insuffisant pour remplacer Visa (qui traite des milliers par seconde). La solution n'était pas de changer Bitcoin, mais de construire une deuxième couche par-dessus: <strong>Lightning Network</strong>.</p>
        
        <p>Pensez à Lightning comme un réseau de canaux de paiement. Imaginez que vous et votre voisin commercez fréquemment. Au lieu d'enregistrer chaque transaction sur la blockchain (lent et avec des frais), vous ouvrez un "canal" en déposant des fonds dans une adresse partagée. Maintenant vous pouvez échanger de la valeur instantanément entre vous, en mettant à jour uniquement le solde interne du canal. Quand vous voulez fermer le canal, la blockchain enregistre uniquement l'état final.</p>
        
        <p><strong>Exemple simple:</strong> Ana ouvre un canal de 100 000 sats avec Bruno. Ana paie 10 000 sats à Bruno pour un café. Ensuite Bruno paie 5 000 sats à Ana pour un livre. Ces transactions sont instantanées et pratiquement gratuites. À la fin du mois, ils ferment le canal: la blockchain enregistre seulement qu'Ana a 95 000 sats et Bruno 5 000—pas les dizaines de transactions intermédiaires.</p>
        
        <p>Ce qui est révolutionnaire, c'est que ces canaux se connectent entre eux. Si Ana a un canal avec Bruno, et Bruno avec Carlos, Ana peut payer Carlos à travers Bruno, sans avoir besoin d'ouvrir un canal direct. Lightning trouve automatiquement la route la plus efficace à travers le réseau.</p>
        
        <p>Aujourd'hui, Lightning Network a plus de 15 000 nœuds publics et la capacité de déplacer des milliards de sats. Des applications comme les portefeuilles mobiles permettent des paiements instantanés dans n'importe quel commerce du monde. C'est l'infrastructure qui rend possible l'utilisation de Bitcoin pour acheter un café, pas seulement pour de gros transferts. La communauté a construit, brique par brique, l'architecture d'un nouveau système économique mondial.</p>
        
        <h3>Bitcoin est collectiviste</h3>
        <p><strong>Bitcoin est une institution de liberté qui nous unit en tant qu'espèce.</strong></p>
        
        <p>Bitcoin nous libère de la compétition destructrice, de l'inégalité imposée par ceux qui contrôlent l'argent, de l'isolement de l'individualisme extrême, en nous unissant pour coopérer sur une propriété collective.</p>
        
        <ul>
          <li><strong>Propriété collective du réseau:</strong> Personne ne possède Bitcoin, tout comme personne ne possède la planète Terre. C'est un bien commun numérique que nous maintenons tous ensemble.</li>
          <li><strong>Validation par consensus mathématique:</strong> Le protocole de Bitcoin fonctionne sur un langage binaire universel qui permet une vérification objective et sans équivoque. Chaque nœud du réseau, de manière indépendante, exécute les mêmes règles cryptographiques sur chaque transaction. Le consensus émerge lorsque cet immense et croissant réseau de nœuds coïncide numériquement, de manière parfaite, sur l'information qu'il valide et archive. Cette coïncidence numérique est la sécurité; modifier une seule donnée nécessiterait de réécrire cette coïncidence sur la majorité des nœuds simultanément, une tâche qui devient exponentiellement plus impossible à mesure que le réseau grandit. L'autorité n'est pas hiérarchique, mais probabiliste et collective.</li>
          <li><strong>Le pouvoir combiné est supérieur:</strong> La force de Bitcoin ne réside pas dans un mur central, mais dans la somme décentralisée de sa puissance computationnelle mondiale. Cette puissance, connue sous le nom de Hashrate, représente le total de l'énergie consacrée à protéger le réseau. Pour le pirater, un attaquant devrait dépasser la capacité combinée de millions de machines. Cette défense n'est pas statique, mais un phénomène émergent de la collaboration distribuée.</li>
          <li><strong>Démocratise l'émission monétaire:</strong> N'importe qui peut participer à la création de monnaie (minage) ou à la validation des transactions (en faisant tourner un nœud). Le pouvoir monétaire n'est pas concentré dans les banques centrales.</li>
          <li><strong>Redistribution de la richesse:</strong> Bitcoin peut être l'architecture transparente et auditable d'un Revenu de Base Universel (RBU). Si la classe ouvrière se coordonne sur deux questions: assumer la propriété collective de l'infrastructure énergétique et minière, et exiger Bitcoin comme seule rémunération juste, la valeur générée en convertissant les ressources communes (énergie excédentaire) en actif numérique affluera directement vers la communauté. Cela ferme le cercle vertueux: la richesse créée à partir d'un bien commun revient comme un revenu économique commun.</li>
          <li><strong>Élimine les intermédiaires comptables:</strong> Sans banques qui décident qui mérite un crédit. Sans gouvernements qui peuvent confisquer arbitrairement ou dévaluer les économies des gens.</li>
        </ul>
        
        <p>Seul celui qui est autonome peut connaître la liberté, car l'autonomie signifie vivre avec la loi que l'on s'impose à soi-même. Dans le cas de la société, la vraie liberté n'est pas l'absence de règles dans la communauté, mais choisir collectivement et sans coercition les règles qui nous gouvernent. Bitcoin permet l'autodétermination économique individuelle en accordant à chaque personne la liberté de choisir comment utiliser son argent, mais elle doit savoir que ses décisions peuvent être soumises à un examen public, elle doit assumer la responsabilité de ses choix. Pour la classe ouvrière mondiale, il constitue un système financier commun, immunisé contre la confiscation et la dévaluation par tout État ou banque centrale. Il permet la solidarité économique et la résistance de classe à l'échelle mondiale, sans besoin de bureaucratie.</p>

      risksContent: `
          <h2>Centralisation du hashpower</h2>
          <p>Bien que Bitcoin soit décentralisé par conception, le minage s'est concentré en deux sens : dans des <strong>pools de minage</strong> (les 4 plus grands contrôlent plus de 50% du hashrate) et <strong>géographiquement</strong> (le minage migre vers l'électricité la moins chère).</p>
          <p>En 2021, la Chine concentrait plus de 65% du hashrate mondial. Après l'interdiction, le réseau a perdu la moitié de sa puissance en semaines — mais s'est rétabli en mois, les mineurs migrant vers les USA, le Kazakhstan, la Russie et le Canada. Le réseau s'est révélé antifragile : chaque coup le rend plus distribué.</p>
          <p>Chaque mineur peut changer de pool en minutes, limitant le pouvoir réel des opérateurs. Mais si un gouvernement fait pression sur les plus grands pools, il pourrait temporairement influencer quelles transactions sont traitées.</p>
          <p><strong>Pourquoi c'est important ?</strong> Bitcoin fonctionne mieux quand le hashpower est distribué entre de nombreux participants dans de nombreuses juridictions. La concentration du hashpower reflète la concentration du pouvoir — et Bitcoin existe pour combattre exactement cela.</p>

          <h2>Attaque des 51%</h2>
          <p>Si une entité contrôle plus de 50% de la puissance de calcul, elle pourrait théoriquement réécrire des blocs récents et réaliser une <strong>double dépense</strong>. Cependant :</p>
          <ul>
            <li>Le coût est astronomique — des milliards en matériel et électricité.</li>
            <li>Maintenir l'attaque coûte encore plus que l'exécuter.</li>
            <li>Une attaque réussie détruirait la confiance, effondrant le prix et l'investissement de l'attaquant.</li>
            <li>Les nœuds pourraient rejeter les blocs de l'attaquant via une mise à jour d'urgence.</li>
          </ul>
          <p>Risque théorique réel mais économiquement irrationnel. Jamais réalisé en 16 ans. L'ironie : plus Bitcoin prend de la valeur, plus il est coûteux — et donc improbable — de l'attaquer.</p>

          <h2>Baleines et concentration de richesse</h2>
          <p>Environ 2% des adresses détiennent plus de 90% des bitcoins en circulation. Beaucoup appartiennent à des exchanges, fonds d'investissement et mineurs précoces.</p>
          <p>Cette concentration contredit la promesse de démocratisation de l'argent. Cependant :</p>
          <ul>
            <li>Beaucoup d'adresses « grandes » sont des portefeuilles froids d'exchanges gardant les fonds de millions d'utilisateurs.</li>
            <li>La distribution s'améliore avec le temps.</li>
            <li>Contrairement au fiat, la concentration est visible et vérifiable.</li>
          </ul>
          <p><strong>Take Power</strong> existe pour combattre cette concentration : redistribuer des sats à ceux qui n'y ont pas accès.</p>

          <h2>Le défi de la transition</h2>
          <p>Les gouvernements peuvent tenter d'interdire Bitcoin. Mais Bitcoin est une <strong>désobéissance civile codée</strong>. Il ne demande pas la permission d'exister. Si l'adoption atteint une masse critique, la réglementation devient aussi futile qu'interdire internet.</p>
          <p>Dans la phase actuelle de faible adoption, les restrictions peuvent entraver l'accès quotidien. Le vrai défi n'est pas la réglementation — c'est atteindre la masse critique avant que les structures de pouvoir ne réagissent.</p>

          <h2>Connectivité</h2>
          <p>Sans internet, pas de Bitcoin. Et <strong>un tiers de l'humanité n'a pas encore accès à internet</strong>. L'infrastructure nécessaire pour participer au réseau Bitcoin dépend d'un autre réseau centralisé — les fournisseurs de télécommunications et les câbles sous-marins contrôlés par des corporations et des gouvernements.</p>
          <p>Des avancées existent : transactions Bitcoin par radio, satellites (Blockstream Satellite diffuse la blockchain complète), et réseaux mesh décentralisés. Mais la souveraineté financière numérique nécessite la souveraineté de la connectivité. <strong>Pas de liberté financière sans liberté de communication.</strong></p>
          <p>Ceux qui ont le plus besoin de Bitcoin sont précisément ceux qui ont le moins accès à l'infrastructure pour l'utiliser.</p>

          <h2>Informatique quantique</h2>
          <p>Les ordinateurs quantiques pourraient casser la cryptographie protégeant les clés privées. Mais ce n'est pas un risque exclusif au Bitcoin — <strong>c'est un risque pour toute la civilisation numérique</strong> : banques, communications militaires, dossiers médicaux.</p>
          <p>La communauté travaille déjà sur des algorithmes post-quantiques. Mais le vrai défi : <strong>l'appropriation de la technologie quantique par la société civile</strong>. Si seuls les États et les corporations y accèdent, le déséquilibre sera dévastateur.</p>

          <h2>Volatilité</h2>
          <p>Bitcoin reste extrêmement volatil. Son prix peut varier de 20% en quelques jours.</p>
          <p>Mais peut-être mesurons-nous avec la mauvaise règle. Quand nous disons « Bitcoin est volatil », nous disons en réalité que <strong>son prix en dollars fluctue</strong>. Mais le dollar lui-même perd constamment de la valeur par l'inflation — nous sommes tellement habitués à tout mesurer en dollars que nous ne remarquons pas que la règle rétrécit.</p>
          <p>Mesuré en énergie (mégajoules), la volatilité diminue significativement. Le <a href="/energy/" style="color: #f7931a;">Standard Énergétique</a> propose exactement cela : mesurer la valeur en unités d'énergie, pas en monnaies fiat.</p>

          <h2>Responsabilité et éthique</h2>
          <p><strong>« Vos clés, vos pièces »</strong>. Perdez votre clé privée, perdez vos bitcoins pour toujours. On estime que 3 à 4 millions de bitcoins sont définitivement perdus.</p>
          <p>Mais la responsabilité va au-delà de la garde. La souveraineté sur votre argent implique une <strong>responsabilité éthique sur son usage</strong>.</p>
          <p>Pensons aux animaux. Pendant des millénaires ils ont servi à étendre nos capacités techniques. Grâce à eux nous avons bâti des civilisations. Mais au lieu d'honorer ce service, nous les avons transformés en machines de production industrielle — sans assumer la responsabilité d'être, en tant qu'espèce, l'esprit de l'organisme Terre.</p>
          <p>Bitcoin nous donne un pouvoir nouveau. Mais le pouvoir sans éthique n'est qu'une autre forme d'oppression. La question n'est pas seulement <em>comment garder mes bitcoins ?</em> mais <em>à quoi je les utilise ? Est-ce que je contribue à la redistribution ou à la concentration ? Est-ce que je sers la vie ou je l'exploite ?</em></p>

          <h2>Réflexion finale</h2>
          <p>Aucune technologie n'est parfaite. Bitcoin est un changement de paradigme vivant. Connaître ses risques ne l'affaiblit pas — le renforce.</p>
          <p><strong>L'honnêteté est le fondement de la confiance. Et la confiance est le fondement de l'argent.</strong></p>
        `,

      faqContent: `
          <div class="space-y-3">
            <div class="bg-[#1a1a1a] border border-white/20 rounded-xl overflow-hidden"><button onclick="this.nextElementSibling.classList.toggle('hidden');this.querySelector('span:last-child').textContent=this.nextElementSibling.classList.contains('hidden')?'+':'−'" class="w-full text-left p-4 flex justify-between items-center hover:bg-white/5 transition"><span class="font-bold text-emerald-400">Bitcoin est-il de l'argent réel ?</span><span class="text-xl text-emerald-400">+</span></button><div class="hidden px-4 pb-4 text-gray-300"><p>Oui. C'est un registre numérique décentralisé vérifié par des milliers d'ordinateurs. Depuis 2009, il fonctionne sans interruption, sans entreprise derrière, et sans que personne ne l'ait falsifié.</p></div></div>
            <div class="bg-[#1a1a1a] border border-white/20 rounded-xl overflow-hidden"><button onclick="this.nextElementSibling.classList.toggle('hidden');this.querySelector('span:last-child').textContent=this.nextElementSibling.classList.contains('hidden')?'+':'−'" class="w-full text-left p-4 flex justify-between items-center hover:bg-white/5 transition"><span class="font-bold text-emerald-400">Qui contrôle Bitcoin ?</span><span class="text-xl text-emerald-400">+</span></button><div class="hidden px-4 pb-4 text-gray-300"><p>Personne — et tout le monde. Logiciel open source, changements par consensus. Le système monétaire le plus démocratique qui ait existé. Mais cela implique quelque chose de crucial : <strong>il n'y a personne à qui se plaindre</strong>. Perdez vos clés, perdez vos bitcoins.</p></div></div>
                                    <div class="bg-[#1a1a1a] border border-white/20 rounded-xl overflow-hidden"><button onclick="this.nextElementSibling.classList.toggle('hidden');this.querySelector('span:last-child').textContent=this.nextElementSibling.classList.contains('hidden')?'+':'−'" class="w-full text-left p-4 flex justify-between items-center hover:bg-white/5 transition"><span class="font-bold text-emerald-400">Pourquoi utiliser Bitcoin de pair à pair (P2P) ?</span><span class="text-xl text-emerald-400">+</span></button><div class="hidden px-4 pb-4 text-gray-300"><p>Bitcoin a été conçu pour circuler entre les gens — entre travailleurs, voisins, communautés. <strong>Tant que Bitcoin circule de main en main parmi le peuple, le pouvoir économique reste au peuple.</strong> Dès que vous le déposez sur un exchange, ce pouvoir retourne aux mêmes institutions. <strong>Ne vendez pas vos sats contre des dollars — trouvez quelqu'un qui les accepte.</strong></p></div></div>
                        <div class="bg-[#1a1a1a] border border-white/20 rounded-xl overflow-hidden"><button onclick="this.nextElementSibling.classList.toggle('hidden');this.querySelector('span:last-child').textContent=this.nextElementSibling.classList.contains('hidden')?'+':'−'" class="w-full text-left p-4 flex justify-between items-center hover:bg-white/5 transition"><span class="font-bold text-emerald-400">Bitcoin est-il légal ?</span><span class="text-xl text-emerald-400">+</span></button><div class="hidden px-4 pb-4 text-gray-300"><p>Est-ce important ? Bitcoin fonctionne avec ou sans permission. <strong>Pas de serveur à éteindre, pas d'entreprise à fermer, pas de PDG à arrêter.</strong> Des milliers de nœuds dans des dizaines de pays. <strong>La réglementation n'arrête pas l'adoption — elle la ralentit temporairement.</strong> Personne n'a pu interdire l'imprimerie, ni la radio, ni internet. Bitcoin est le suivant.</p></div></div>
            <div class="bg-[#1a1a1a] border border-white/20 rounded-xl overflow-hidden"><button onclick="this.nextElementSibling.classList.toggle('hidden');this.querySelector('span:last-child').textContent=this.nextElementSibling.classList.contains('hidden')?'+':'−'" class="w-full text-left p-4 flex justify-between items-center hover:bg-white/5 transition"><span class="font-bold text-emerald-400">Pourquoi Bitcoin met-il fin à l'accumulation insensée ?</span><span class="text-xl text-emerald-400">+</span></button><div class="hidden px-4 pb-4 text-gray-300"><p>La monnaie fiat s'imprime sans limite, encourageant l'accumulation. Les 21 millions fixes de Bitcoin signifient que <strong>vous n'avez pas besoin d'accumuler pour vous protéger de l'inflation</strong>. Au lieu d'accumuler par peur, vous pouvez <strong>faire circuler par confiance</strong>. <strong>Bitcoin n'interdit pas la richesse — il élimine le besoin pathologique de l'accumuler.</strong></p></div></div>
                                    <div class="bg-[#1a1a1a] border border-white/20 rounded-xl overflow-hidden"><button onclick="this.nextElementSibling.classList.toggle('hidden');this.querySelector('span:last-child').textContent=this.nextElementSibling.classList.contains('hidden')?'+':'−'" class="w-full text-left p-4 flex justify-between items-center hover:bg-white/5 transition"><span class="font-bold text-emerald-400">Bitcoin ne consomme-t-il pas trop d'énergie ?</span><span class="text-xl text-emerald-400">+</span></button><div class="hidden px-4 pb-4 text-gray-300"><p>La vraie question : <strong>à quoi sert cette énergie ?</strong> Plus de 50% du minage utilise de l'énergie renouvelable. Bitcoin encourage la recherche d'énergie bon marché, souvent renouvelable.</p></div></div>
            <div class="bg-[#1a1a1a] border border-white/20 rounded-xl overflow-hidden"><button onclick="this.nextElementSibling.classList.toggle('hidden');this.querySelector('span:last-child').textContent=this.nextElementSibling.classList.contains('hidden')?'+':'−'" class="w-full text-left p-4 flex justify-between items-center hover:bg-white/5 transition"><span class="font-bold text-emerald-400">Comment Bitcoin peut-il financer l'adaptation climatique ?</span><span class="text-xl text-emerald-400">+</span></button><div class="hidden px-4 pb-4 text-gray-300"><p>L'adaptation climatique nécessite des transferts directs de ressources aux communautés vulnérables — celles que les banques excluent. <strong>Bitcoin est l'infrastructure financière dont l'adaptation climatique a besoin.</strong></p><p>Plus profondément : l'adaptation climatique exige que les pays se coordonnent — et la coordination n'est possible qu'avec la paix. Bitcoin, en tant que monnaie neutre, peut être l'architecture financière commune permettant cette coopération. <strong>La paix n'est pas un prérequis du changement climatique — c'est sa condition de possibilité.</strong></p></div></div>
            <div class="bg-[#1a1a1a] border border-white/20 rounded-xl overflow-hidden"><button onclick="this.nextElementSibling.classList.toggle('hidden');this.querySelector('span:last-child').textContent=this.nextElementSibling.classList.contains('hidden')?'+':'−'" class="w-full text-left p-4 flex justify-between items-center hover:bg-white/5 transition"><span class="font-bold text-emerald-400">Quel rapport entre Bitcoin et la justice sociale ?</span><span class="text-xl text-emerald-400">+</span></button><div class="hidden px-4 pb-4 text-gray-300"><p>Plus de 1,7 milliard de personnes n'ont pas de compte bancaire. Pas par choix — par exclusion. Bitcoin ne demande qu'un téléphone avec internet. <strong>La souveraineté financière comme droit humain, pas comme privilège.</strong></p></div></div>
            <div class="bg-[#1a1a1a] border border-white/20 rounded-xl overflow-hidden"><button onclick="this.nextElementSibling.classList.toggle('hidden');this.querySelector('span:last-child').textContent=this.nextElementSibling.classList.contains('hidden')?'+':'−'" class="w-full text-left p-4 flex justify-between items-center hover:bg-white/5 transition"><span class="font-bold text-emerald-400">Bitcoin peut-il devenir la monnaie mondiale ?</span><span class="text-xl text-emerald-400">+</span></button><div class="hidden px-4 pb-4 text-gray-300"><p>Première monnaie remplissant toutes les conditions techniques. Doit coexister comme une <strong>couche de base neutre</strong>. <strong>La question n'est pas s'il peut — c'est quand nous l'adopterons.</strong></p></div></div>
            <div class="bg-[#1a1a1a] border border-white/20 rounded-xl overflow-hidden"><button onclick="this.nextElementSibling.classList.toggle('hidden');this.querySelector('span:last-child').textContent=this.nextElementSibling.classList.contains('hidden')?'+':'−'" class="w-full text-left p-4 flex justify-between items-center hover:bg-white/5 transition"><span class="font-bold text-emerald-400">Comment commencer avec Bitcoin ?</span><span class="text-xl text-emerald-400">+</span></button><div class="hidden px-4 pb-4 text-gray-300"><p>Il n'y a pas de chemin unique. Bitcoin c'est la liberté, et cela inclut la liberté de choisir comment y entrer. Mais il y a des principes qui vous aideront :</p><p><strong>1. Étudiez avant d'agir.</strong> Vous lisez ceci — bon début. Ne vous contentez pas d'une seule source. Cherchez d'autres voix, d'autres projets, d'autres points de vue. Méfiez-vous de quiconque vous dit qu'il n'y a qu'une seule façon de faire.</p><p><strong>2. Obtenez un portefeuille.</strong> Cherchez ces qualités : code ouvert, non-custodial (vous contrôlez les clés), compatible Lightning Network, avec sauvegarde par phrase de récupération (12 ou 24 mots). Méfiez-vous de tout portefeuille qui demande des données inutiles, promet des rendements, ou ne publie pas son code. Commencez avec un portefeuille chaud (app sur téléphone) pour de petits montants ; migrez vers un portefeuille froid (appareil physique) quand vous gérez des montants plus importants.</p><p><strong>3. Recevez vos premiers satoshis.</strong> La manière la plus alignée est de les recevoir d'une autre personne : pour un travail, une vente, un échange, ou via des projets comme Take Power. Vous pouvez aussi les acheter en P2P (pair à pair) sans intermédiaires.</p><p><strong>4. Utilisez Bitcoin.</strong> Ne l'accumulez pas sans but. Envoyez, recevez, payez, donnez. Bitcoin prend son sens quand il circule.</p><p><strong>5. Faites tourner votre propre nœud</strong> (quand vous êtes prêt). Pas obligatoire, mais c'est l'acte ultime de souveraineté : vérifier par vous-même que les règles sont respectées.</p></div></div>
            <div class="bg-[#1a1a1a] border border-white/20 rounded-xl overflow-hidden"><button onclick="this.nextElementSibling.classList.toggle('hidden');this.querySelector('span:last-child').textContent=this.nextElementSibling.classList.contains('hidden')?'+':'−'" class="w-full text-left p-4 flex justify-between items-center hover:bg-white/5 transition"><span class="font-bold text-emerald-400">Comment protéger mes bitcoins ?</span><span class="text-xl text-emerald-400">+</span></button><div class="hidden px-4 pb-4 text-gray-300"><p>Le réseau Bitcoin n'a jamais été piraté. Ce qui a été piraté — encore et encore — ce sont les personnes.</p><p><strong>Menaces réelles :</strong></p><ul><li><strong>Phishing :</strong> Sites web ou messages falsifiés imitant des portefeuilles pour voler vos données. Vérifiez toujours l'URL.</li><li><strong>Arnaques « doublez vos BTC » :</strong> Personne ne peut doubler vos bitcoins. Personne. Si quelqu'un le promet, il vous vole.</li><li><strong>Ingénierie sociale :</strong> Quelqu'un qui gagne votre confiance pour que vous révéliez votre phrase de récupération. Aucun support technique légitime ne vous la demandera jamais.</li><li><strong>SIM swapping :</strong> Des attaquants transfèrent votre numéro de téléphone sur une autre puce pour intercepter les codes. Utilisez la 2FA avec une app, jamais par SMS.</li><li><strong>Malware :</strong> Logiciel qui modifie les adresses Bitcoin quand vous les collez. Vérifiez toujours les premiers et derniers caractères avant d'envoyer.</li></ul><p><strong>Règles de survie :</strong> Votre phrase de récupération s'écrit sur papier ou métal, jamais en photo ou dans le cloud. Testez la restauration de votre portefeuille AVANT d'y stocker des montants significatifs. Utilisez de petits montants pour apprendre.</p><p><strong>La leçon de Mt. Gox et FTX :</strong> Deux exchanges géants se sont effondrés parce que les gens leur ont confié leurs clés. <strong>Si vous n'avez pas vos clés, vous n'avez pas vos bitcoins.</strong> Un exchange n'est pas un portefeuille — c'est un tiers qui peut faire faillite, être piraté, ou vous voler.</p><p><strong>Qu'est-ce que l'auto-garde ?</strong> Cela signifie que vous — et vous seul — contrôlez les clés privées. Phrase de récupération dans un endroit sûr que vous seul connaissez. Vous envoyez et recevez sans demander la permission à personne. 100% responsable de votre propre sécurité. Ce n'est pas pour tout le monde dès le premier jour — vous pouvez commencer avec un portefeuille custodial et migrer quand vous comprendrez les risques. Mais que ce soit une décision consciente. L'auto-garde est la différence entre utiliser Bitcoin et simplement avoir une exposition à son prix.</p></div></div>
          </div>
        `,

      observatoryContent: `
          <p class="text-gray-400 mb-6">Bitcoin n'est pas que théorie. À travers le monde, des communautés construisent des économies où Bitcoin circule de main en main — sans exchanges, sans banques, sans intermédiaires. Voici quelques-unes des expériences les plus significatives. Aucune n'est parfaite. Toutes sont courageuses.</p>

            <div class="bg-[#1a1a1a] border border-white/20 rounded-xl p-6">
              <h3 class="text-xl font-bold text-amber-400 mb-1">🏖️ Bitcoin Beach — El Zonte, El Salvador</h3>
              <p class="text-sm text-gray-500 mb-3">Depuis 2019 · La première économie circulaire Bitcoin au monde</p>
              <p class="text-gray-300">Un don anonyme de Bitcoin à un village côtier de 3 000 habitants a tout déclenché. Mike Peterson et Román Martínez ont construit un écosystème où plus de 500 familles et 120 commerces utilisent Bitcoin via Lightning Network pour les paiements quotidiens : électricité, déjeuners, salaires. Le projet a directement inspiré El Salvador à adopter Bitcoin comme monnaie légale en septembre 2021 — le premier pays au monde à le faire.</p>
              <p class="text-gray-400 mt-2"><strong>Défis aujourd'hui :</strong> Gentrification sévère — les prix des terrains ont été multipliés et certains fondateurs ont accumulé des propriétés. De nombreux commerçants locaux sont revenus au cash. L'adoption réelle parmi les Salvadoriens ordinaires reste limitée en dehors des zones touristiques.</p>
            </div>
            <div class="bg-[#1a1a1a] border border-white/20 rounded-xl p-6">
