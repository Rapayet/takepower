  <script>
    const SHARE_URL = 'https://takepower.world/';const VISION_URL = 'https://takepower.world/vision/';
    const manifesto = {
      es: {
        title: "AJURÍ: REVOLUCIÓN DE LA PAZ",
        quote: '"La verdad oculta fundamental del mundo es que es algo que creamos juntos y que fácilmente podríamos crear diferente" — David Graeber',
        content: `<h2>Preámbulo — El momento de la convergencia</h2>
<p>La humanidad afronta una <a href="https://es.wikipedia.org/wiki/Policrisis" target="_blank">policrisis</a>. En primer término, una crisis medioambiental, donde peligra la vida del organismo Tierra, nuestra madre. Una crisis monetaria, por un <a href="https://es.wikipedia.org/wiki/Dinero_fiat" target="_blank">dinero sin respaldo</a>, deuda infinita, desigualdad estructural y una lucha monetaria sin vencedores posibles. Una crisis energética, por la adicción a los <a href="https://es.wikipedia.org/wiki/Combustible_f%C3%B3sil" target="_blank">combustibles fósiles</a>, desperdicio masivo, contaminación del agua y el suelo que nos alimenta. Crisis de significado, debido al extremo individualismo, hay una pérdida de propósito y una desesperanza por el futuro. Estas no son crisis separadas, sino una sola: <strong>El sistema económico actual nubló la conciencia y nos desconectó de la Naturaleza</strong>, es un sistema incompatible con la supervivencia ecológica y la dignidad humana. Debemos develar la ilusión de la separación.</p>

<h2>Primer principio — Integración de la voluntad y elevación de la conciencia</h2>
<p>Para superar la ilusión de la separación usaremos los cuatro principios de integración socio-política: <strong>la realidad es superior a la idea, el todo es superior a la parte, la unión es superior al conflicto, el tiempo es superior al espacio.</strong></p>

<p>Se propone con frecuencia el <a href="https://es.wikipedia.org/wiki/Biocentrismo" target="_blank">biocentrismo</a> como ideología para afrontar la policrisis. La vida es demasiado vasta para definirla, pero debemos posicionar en el centro de la conciencia esta verdad: <strong>lo vivo —todo aquello que tiene textura, temperatura y duración— es lo real.</strong> Aunque la experiencia encarnada nos persuade de que el mundo y el yo son cosas separadas, recordar lo anterior permite avanzar hacia la integración, pues la realidad (el cuerpo) es siempre superior a la idea (la identidad). Desde esta perspectiva, se hace evidente que somos microcosmos del organismo Tierra y como ella, también estamos enfermos. Nuestra enfermedad exige escuchar al resto de la Naturaleza, porque es ella quien guarda los remedios más profundos.</p>

<p>La biología contemporánea confirma esta intuición. El concepto de <a href="https://es.wikipedia.org/wiki/Holobionte" target="_blank">holobionte</a> lo dice claro: ningún organismo es un individuo aislado. Cada ser vivo es una comunidad simbiótica. Uno no es uno, uno es los billones de microorganismos que lo habitan, es por ellos —por su trabajo en coordinación— que podemos digerir, pensar y sobrevivir. Un árbol no es solo un árbol, es la red de hongos micorrízicos que conecta sus raíces con las del bosque entero. Y un hongo no es solo un hongo, es un sistema diverso de células que le dan vida. Entender esto es entender que el individualismo radical es una ficción biológica. La unidad básica de la vida no es el individuo; es la relación.</p>

<p>Intentar reproducir el pasado, aislándose en aldeas autosustentables, no solo resulta imposible en un mundo globalizado sino que es, sobre todo, una ilusión vana. Como lo demuestran el ciclo del agua y del carbono, no hay salvación individual. Los organismos en un bosque están todos interligados; las luchas están todas relacionadas. <strong>Somos holobiontes en un planeta holobionte: la cooperación no es una opción ética, es un imperativo biológico.</strong> Debemos cooperar para continuar. Caer en el <a href="https://es.wikipedia.org/wiki/Neoludismo" target="_blank">neoludismo</a> sería aceptar que el capitalismo mutiló nuestra imaginación.</p>

<p>De esta comprensión nace la aspiración a una <a href="https://es.wikipedia.org/wiki/Sociocracia" target="_blank">sociocracia</a> global: un sistema sin cúspide jerárquica. Ningún Estado, ningún banco central, ninguna corporación. Solo círculos interconectados que se gobiernan por consentimiento. Cada círculo es un todo autónomo y una parte funcional de un círculo mayor. Las decisiones las toman todos los afectados. La imagen más precisa de este principio está en la Naturaleza: el <a href="https://es.wikipedia.org/wiki/Micelio" target="_blank">micelio</a>. Esa trama subterránea de hongos conecta las raíces del bosque entero. El micelio no tiene centro ni jerarquía. Redistribuye nutrientes de donde sobran a donde faltan. Transmite señales químicas de alerta entre árboles distantes. Cada hilo de micelio es autónomo pero funcional al bosque, como cada célula es soberana en su metabolismo pero sirve al organismo. Así cada persona, cada comunidad, cada nodo de una red puede autogobernarse mientras contribuye al equilibrio del conjunto.</p>

<p>Integrar estos conocimientos nos hace recordar que estamos hechos de los mismos elementos que las estrellas y la madera. Que materia y energía son una sola sustancia, vibrando en distintas longitudes de onda. Entonces, podemos ver que si bien las ideas no ocupan espacio, nada existe fuera del tiempo, y por tanto, el tiempo es superior al espacio. Si el tiempo no tiene afuera, es ilimitado, sin fin; entonces aquello que contiene —la existencia misma— no tiene un propósito externo, como no lo tienen el arte o el amor, que quizá son simples sinónimos. Quien se conmueve ante la vida intenta expresar esos enigmas, aun sabiendo que su belleza es indecible. Y así, en lugar de preguntarnos «¿por qué estamos vivos?» o «¿para qué vivimos?», hagámonos una pregunta más íntima y reveladora: <em>¿cómo se encarnó el tiempo en mí?</em></p>

<p>Vamos a elevar la conciencia colectiva modificando juntas economía y cultura. Las formas en que nos amamos, nos alimentamos, nos organizamos, nos expresamos, vamos a transformar todo, si y sólo si tenemos la valentía de confiar los unos en los otros, para hacer la paz, compartir recursos y reconectar entre organismos vivos. En este recomenzar, las matemáticas —esa gramática secreta de la Naturaleza— vuelven a ofrecernos una herramienta de integración, una armonía preexistente, como en la música. <strong>Imaginar y trabajar juntos para continuar esa divina historia de la Tierra, es el poema colectivo que devolverá la dignidad a nuestra especie.</strong></p>

<p>Debemos transformar nuestra relación con la muerte y el nacimiento. Así veremos en las nuevas generaciones, crecidas en una <a href="https://es.wikipedia.org/wiki/Econom%C3%ADa_circular" target="_blank">economía circular</a> —de <a href="https://es.wikipedia.org/wiki/Moneda_social" target="_blank">moneda social</a> global—, el entendimiento de que lo que tiene masa decae, pero que <strong>no existe la muerte, sólo transformación.</strong> No es la muerte lo que debe aterrarnos, sino la obstinación por prolongar al individuo, además a costa de las generaciones futuras y la biodiversidad. Todo cuerpo, toda posesión material, es un instante fugaz en el flujo universal de la energía. Hoy, sin embargo, nuestro consumo son objetos que niegan su fugacidad: materiales que decaen tan lento están estancando la corriente. La Tierra se ahoga en cosas abandonadas; nos hemos convertido, sobre todo, en productores de basura. Poner el trabajo en lo primordial y no en el deseo es equilibrar el proceso, vamos a producir más lento y a asumir la responsabilidad del libre albedrío. Consumir es fácil (satisfacer el deseo), crear es difícil (hacer el amor). <strong>Ser valiente entonces es aceptar nuestra fugacidad y aún así elegir lo difícil. Reunamos, pues, la voluntad para el amor.</strong></p>

<h2>Segundo principio — El asunto del dinero</h2>
<p>Es un hecho que el dinero es anterior al capitalismo y surgió como herramienta para la cooperación. Comprenderlo como representación simbólica de energía es fundamental para entender que <strong><a href="https://es.wikipedia.org/wiki/Bitcoin" target="_blank">Bitcoin</a>, que es acuñado matemáticamente, a través de una <a href="https://es.wikipedia.org/wiki/Prueba_de_trabajo" target="_blank">prueba de gasto energético</a> —trabajo computacional—, es la solución de la humanidad para la arbitrariedad del poder de un banco central</strong>, pues hace más abierto y justo el juego del dinero. Ahora bien, con las leyes de la <a href="https://es.wikipedia.org/wiki/Termodin%C3%A1mica" target="_blank">termodinámica</a> en mente y conscientes de los límites de nuestro planeta, sabemos que no podemos crear energía de la nada. Por ello, no pueden existir bitcoins infinitos, como tampoco deuda infinita. La herramienta es coherente con la Naturaleza.</p>

<p>A diferencia del <a href="https://es.wikipedia.org/wiki/Dinero_fiat" target="_blank">dinero fiduciario</a>, que nace como deuda —cada dólar emitido es un préstamo que alguien debe devolver con interés—, Bitcoin es un activo sin pasivo correspondiente. Esta distinción es fundamental. En un sistema monetario basado en deuda, la <a href="https://es.wikipedia.org/wiki/Deflaci%C3%B3n" target="_blank">deflación</a> es catastrófica porque aumenta el esfuerzo para pagar lo que se debe. Pero en un sistema basado en Bitcoin, donde el dinero no es deuda, la deflación simplemente refleja el aumento de productividad y eficiencia de la economía. Así, Bitcoin desacopla por primera vez el dinero de la deuda, lo cual elimina la necesidad de crecimiento infinito para pagar intereses exponenciales sobre dinero creado de la nada.</p>

<p>Diremos además que <strong>Bitcoin es energía social congelada en el tiempo.</strong> Social, porque es producto del trabajo del computador —símbolo físico del progreso colectivo de la humanidad, símbolo de la magia, símbolo del poder del fuego—. Nadie puede declararse dueño de la red de Bitcoin, como nadie puede proclamarse soberano del planeta Tierra, pues ambos son sistemas <a href="https://es.wikipedia.org/wiki/Entrop%C3%ADa" target="_blank">entrópicos</a>, organismos vivos que, siendo finitos, requieren trabajo de cuidado para ser mantenidos en equilibrio. Y es energía congelada en el tiempo porque Bitcoin es un bien digital cuyo valor y seguridad vienen de la transformación irreversible de trabajo colectivo y recursos comunes del mundo real, en un registro contable inmutable (la <a href="https://es.wikipedia.org/wiki/Cadena_de_bloques" target="_blank">cadena de bloques</a>), que preserva su valor a través del tiempo y no es limitado por el espacio.</p>

<p>Hay que ver Bitcoin como la arquitectura financiera para un nuevo sistema económico basado en el colectivismo. En su esencia, son los mineros y los nodos quienes validan y aseguran la red. Incluso, si fuera necesario en el futuro, su código podría modificarse por acuerdo de la mayoría —como en todo relato colectivo el consenso es la llave—. No obstante, en este tejido también reside la responsabilidad y la libertad irrevocable del individuo que participa. He ahí la confianza que respalda el valor de Bitcoin: poder computacional colectivo y libertad de elección.</p>

<p>Podemos decir entonces que <strong>Bitcoin opera como una síntesis dialéctica entre capitalismo y comunismo.</strong> Del capitalismo conserva la libertad individual, la iniciativa personal y el mercado como mecanismo de coordinación. Del comunismo reclama la propiedad colectiva de los medios de producción —pues la red de Bitcoin y la infraestructura energética que la sostiene son bienes comunes— y la distribución equitativa del valor generado. Lo que Bitcoin supera de ambos es la concentración de poder: ni el Estado centralizador ni el capital monopolista pueden controlar una red descentralizada de consenso matemático.</p>

<p>Es importante precisar: no se trata de abolir la propiedad personal. Cada quien es soberano de sus satoshis y de los objetos que usa para vivir. No obstante, la vivienda no es solo un objeto, es territorio, es frontera, es posibilidad de aislamiento o de encuentro. La propiedad colectiva de la tierra y la vivienda significa que si uno quiere un lugar digno para el descanso y el recogimiento, todos los miembros del sistema lo quieren y merecen por igual. <strong>Por ello vamos a socializar progresivamente los medios de producción de valor, para que esos espacios sean posibles sin tornarse mercancía.</strong> La sociocracia que proponemos exige una ética del uso consciente: vivienda, satoshis y agua son para todos usarlos y cuidarlos. Bitcoin lo hace posible porque es el concilio ideológico hecho herramienta práctica para la revolución. ¿Y qué es una revolución, sino una nueva y mejor forma de cooperación?</p>

<p>Enfatizamos que para solucionar la policrisis es fundamental atender la injusticia social. Abandonar otras monedas centralizadas (el dólar, el euro, el yuan, etc) fundadas en el extractivismo, la división y la explotación, posibilitará una cooperación internacional sin precedentes. Cualquier testigo de la guerra comprende que no se puede prosperar en un territorio violento. <strong>Para afrontar la policrisis, es imperativo detener el gasto en armas</strong> y redirigir esos recursos hacia los grupos marginados de la economía. Por ser descentralizado, de código abierto, fundado en el consenso y de contabilidad pública, Bitcoin puede servir como medio de intercambio en una economía circular global. Un sistema donde el todo prima sobre la parte, eliminando la necesidad de ataque y defensa entre naciones.</p>

<p>Como en un sistema cerrado que tiende al equilibrio térmico, Bitcoin permite construir las condiciones para redistribuir la riqueza. La transparencia radical de su contabilidad, junto con la prioridad del apoyo mutuo, puede contribuir a desenmascarar el crimen y aislar el lucro armamentista. <strong>Por primera vez, la paz mundial se vislumbra no como un anhelo lejano, sino como una posibilidad técnica y ética en el horizonte.</strong></p>

<p>Para quienes temen que los millonarios ya acumularon demasiado Bitcoin y que no hay remedio para el egoísmo humano: el mecanismo de redistribución no es físico sino social. Llegado el punto en que una masa crítica de trabajadores adopta Bitcoin como única moneda, la acumulación estéril se vuelve autoexclusión. Quien no participa en la economía no accede a bienes ni servicios. A diferencia del sistema actual, donde el acumulador de dólares puede vivir de intereses de la explotación; del robo de energía y tiempo; de la vida misma. En una economía Bitcoin no existe renta pasiva por emisión monetaria. Para obtener lo que se necesita, hay que poner los satoshis en circulación.</p>

<p>Ya en el siglo XX se propuso un <a href="https://es.wikipedia.org/wiki/Freigeld" target="_blank">"dinero oxidable"</a> que perdía valor si no circulaba. Bitcoin no tiene ese mecanismo incorporado. Pero la presión social de una adopción universal cumple una función análoga. Poseer satoshis, entonces, no es acaparar energía para uno mismo, sino tener la capacidad de decidir hacia dónde se dirige una porción de la energía social. Ese es el principio reductor de la desigualdad: <strong>Bitcoin redistribuye la energía social en la medida en que más personas exijan participar del sistema</strong>, y en que la transparencia de la cadena de bloques exponga al acaparador como un parásito social —no como un triunfador. Queda un desafío real: hoy la minería de Bitcoin está concentrada en pocas empresas. Para que esta visión colectivista se materialice, la minería debe descentralizarse radicalmente, con generación comunitaria de energía renovable.</p>

<p>Por último, es crucial recordar que las soluciones reales para reconfigurar nuestras formas de vivir encuentran su traba más dura en lo financiero. Cualquiera que haya intentado lanzar una iniciativa de <a href="https://es.wikipedia.org/wiki/Permacultura" target="_blank">permacultura</a>, de adaptación climática o de atención social puede testimoniarlo; el obstáculo principal siempre es hallar los recursos para materiales y trabajadores. Bitcoin, en su esencia, propone una emancipación financiera radical. Al eliminar la necesidad de un intermediario central —un banco, un Estado, una institución que conceda o niegue permiso—, desarma el mecanismo fundamental de la dominación. Porque toda dominación —de clase, estatal, monetaria, de género— se consolida, en primera instancia, propiciando la coerción mediante el control del dinero. <strong>Bitcoin posibilita que el oprimido se libere, no mediante concesiones del opresor, sino mediante el apoyo mutuo y la acción directa.</strong> Sin pedir autorización, puede acceder y canalizar la energía social que precisa para su subsistencia y para su proyecto.</p>

<h2>El horizonte — Energía abundante y el fin de la escasez artificial</h2>

<p>C'est un fait que l'argent est antérieur au capitalisme et est apparu comme outil de coopération. Le comprendre comme représentation symbolique de l'énergie est fondamental pour comprendre que <strong><a href="https://fr.wikipedia.org/wiki/Bitcoin" target="_blank">Bitcoin</a>, qui est frappé mathématiquement, à travers une <a href="https://fr.wikipedia.org/wiki/Preuve_de_travail" target="_blank">preuve de dépense énergétique</a> — travail computationnel —, est la solution de l'humanité face à l'arbitraire du pouvoir d'une banque centrale</strong>, car il rend le jeu de l'argent plus ouvert et plus juste. Avec les lois de la <a href="https://fr.wikipedia.org/wiki/Thermodynamique" target="_blank">thermodynamique</a> en tête et conscients des limites de notre planète, nous savons que nous ne pouvons créer de l'énergie à partir de rien. C'est pourquoi il ne peut exister de bitcoins infinis, tout comme il ne peut exister de dette infinie. L'outil est cohérent avec la Nature.</p>

<p>Contrairement à la <a href="https://fr.wikipedia.org/wiki/Monnaie_fiduciaire" target="_blank">monnaie fiduciaire</a>, qui naît comme dette — chaque dollar émis est un prêt que quelqu'un doit rembourser avec intérêts —, Bitcoin est un actif sans passif correspondant. Cette distinction est fondamentale. Dans un système monétaire fondé sur la dette, la <a href="https://fr.wikipedia.org/wiki/D%C3%A9flation" target="_blank">déflation</a> est catastrophique car elle augmente l'effort pour rembourser ce qui est dû. Mais dans un système basé sur Bitcoin, où l'argent n'est pas dette, la déflation reflète simplement l'augmentation de la productivité et de l'efficacité de l'économie. Ainsi, Bitcoin découple pour la première fois l'argent de la dette, éliminant la nécessité d'une croissance infinie pour payer des intérêts exponentiels sur de l'argent créé à partir de rien.</p>

<p>Nous dirons de plus que <strong>Bitcoin est de l'énergie sociale gelée dans le temps.</strong> Sociale, car c'est le produit du travail informatique — symbole physique du progrès collectif de l'humanité, symbole de la magie, symbole du pouvoir du feu. Personne ne peut se déclarer propriétaire du réseau Bitcoin, tout comme personne ne peut se proclamer souverain de la planète Terre, car les deux sont des systèmes <a href="https://fr.wikipedia.org/wiki/Entropie_(thermodynamique)" target="_blank">entropiques</a>, des organismes vivants qui, étant finis, nécessitent un travail de soin pour être maintenus en équilibre. Et c'est de l'énergie gelée dans le temps car Bitcoin est un bien numérique dont la valeur et la sécurité proviennent de la transformation irréversible du travail collectif et des ressources communes du monde réel en un registre comptable immuable (la <a href="https://fr.wikipedia.org/wiki/Blockchain" target="_blank">blockchain</a>), qui préserve sa valeur à travers le temps et n'est pas limité par l'espace.</p>

<p>Il faut voir Bitcoin comme l'architecture financière d'un nouveau système économique fondé sur le collectivisme. En son essence, ce sont les mineurs et les nœuds qui valident et sécurisent le réseau. Même si nécessaire à l'avenir, son code pourrait être modifié par accord de la majorité — comme dans tout récit collectif, le consensus est la clé. Néanmoins, dans ce tissu réside aussi la responsabilité et la liberté irrévocable de l'individu qui participe. C'est là que réside la confiance qui soutient la valeur de Bitcoin : puissance computationnelle collective et liberté de choix.</p>

<p>Nous pouvons dire alors que <strong>Bitcoin opère comme une synthèse dialectique entre capitalisme et communisme.</strong> Du capitalisme il conserve la liberté individuelle, l'initiative personnelle et le marché comme mécanisme de coordination. Du communisme il revendique la propriété collective des moyens de production — car le réseau Bitcoin et l'infrastructure énergétique qui le soutient sont des biens communs — et la distribution équitable de la valeur générée. Ce que Bitcoin transcende dans les deux, c'est la concentration du pouvoir : ni l'État centralisateur ni le capital monopoliste ne peuvent contrôler un réseau décentralisé de consensus mathématique.</p>

<p>Il est important de préciser : il ne s'agit pas d'abolir la propriété personnelle. Chacun est souverain de ses satoshis et des objets qu'il utilise pour vivre. Cependant, le logement n'est pas qu'un objet, c'est un territoire, c'est une frontière, c'est la possibilité de l'isolement ou de la rencontre. La propriété collective de la terre et du logement signifie que si l'un veut un lieu digne pour le repos et le recueillement, tous les membres du système le veulent et le méritent également. <strong>C'est pourquoi nous allons socialiser progressivement les moyens de production de valeur, afin que ces espaces soient possibles sans devenir des marchandises.</strong> La sociocratie que nous proposons exige une éthique de l'usage conscient : logement, satoshis et eau sont faits pour que tous les utilisent et en prennent soin. Bitcoin le rend possible car c'est la conciliation idéologique faite outil pratique pour la révolution. Et qu'est-ce qu'une révolution, sinon une nouvelle et meilleure forme de coopération ?</p>

<p>Nous soulignons que pour résoudre la polycrise il est fondamental de s'attaquer à l'injustice sociale. Abandonner les autres monnaies centralisées (le dollar, l'euro, le yuan, etc.) fondées sur l'extractivisme, la division et l'exploitation, rendra possible une coopération internationale sans précédent. Tout témoin de la guerre comprend qu'on ne peut prospérer dans un territoire violent. <strong>Pour affronter la polycrise, il est impératif d'arrêter les dépenses militaires</strong> et de réorienter ces ressources vers les groupes marginalisés de l'économie. Étant décentralisé, open source, fondé sur le consensus et à comptabilité publique, Bitcoin peut servir de moyen d'échange dans une économie circulaire mondiale. Un système où le tout prime sur la partie, éliminant la nécessité d'attaque et de défense entre nations.</p>

<p>Comme dans un système fermé tendant vers l'équilibre thermique, Bitcoin permet de construire les conditions pour redistribuer la richesse. La transparence radicale de sa comptabilité, jointe à la priorité de l'entraide, peut contribuer à démasquer le crime et à isoler le profit armementiste. <strong>Pour la première fois, la paix mondiale se profile non comme un souhait lointain, mais comme une possibilité technique et éthique à l'horizon.</strong></p>

<p>Pour ceux qui craignent que les millionnaires aient déjà accumulé trop de Bitcoin et qu'il n'y ait pas de remède à l'égoïsme humain : le mécanisme de redistribution n'est pas physique mais social. Au point où une masse critique de travailleurs adopte Bitcoin comme seule monnaie, l'accumulation stérile devient auto-exclusion. Celui qui ne participe pas à l'économie n'accède ni aux biens ni aux services. Contrairement au système actuel, où l'accumulateur de dollars peut vivre des intérêts de l'exploitation ; du vol d'énergie et de temps ; de la vie elle-même. Dans une économie Bitcoin, il n'existe pas de revenu passif par émission monétaire. Pour obtenir ce dont on a besoin, il faut mettre les satoshis en circulation.</p>

<p>Dès le XXe siècle, on a proposé une <a href="https://fr.wikipedia.org/wiki/Monnaie_fondante" target="_blank">« monnaie fondante »</a> qui perdait de la valeur si elle ne circulait pas. Bitcoin n'a pas ce mécanisme intégré. Mais la pression sociale d'une adoption universelle remplit une fonction analogue. Posséder des satoshis, c'est alors non pas accaparer de l'énergie pour soi-même, mais avoir la capacité de décider où diriger une portion de l'énergie sociale. Tel est le principe réducteur d'inégalité : <strong>Bitcoin redistribue l'énergie sociale dans la mesure où davantage de personnes exigent de participer au système</strong>, et dans la mesure où la transparence de la blockchain expose l'accapareur comme un parasite social — et non comme un gagnant. Un défi réel demeure : aujourd'hui le minage de Bitcoin est concentré dans peu d'entreprises. Pour que cette vision collectiviste se matérialise, le minage doit être radicalement décentralisé, avec une génération communautaire d'énergie renouvelable.</p>

<p>Enfin, il est crucial de rappeler que les solutions réelles pour reconfigurer nos modes de vie rencontrent leur obstacle le plus dur dans le domaine financier. Quiconque a tenté de lancer une initiative de <a href="https://fr.wikipedia.org/wiki/Permaculture" target="_blank">permaculture</a>, d'adaptation climatique ou d'attention sociale peut en témoigner ; l'obstacle principal est toujours de trouver les ressources pour les matériaux et les travailleurs. Bitcoin, dans son essence, propose une émancipation financière radicale. En éliminant la nécessité d'un intermédiaire central — une banque, un État, une institution qui accorde ou refuse la permission —, il désarme le mécanisme fondamental de la domination. Car toute domination — de classe, étatique, monétaire, de genre — se consolide, en premier lieu, en rendant possible la coercition par le contrôle de l'argent. <strong>Bitcoin permet à l'opprimé de se libérer, non par des concessions de l'oppresseur, mais par l'entraide et l'action directe.</strong> Sans demander la permission, on peut accéder et canaliser l'énergie sociale nécessaire à sa subsistance et à son projet.</p>

<h2>L'horizon — Énergie abondante et fin de la rareté artificielle</h2>
<p>Si l'efficacité énergétique augmente portée par une économie Bitcoin — où le minage incite l'investissement dans une énergie bon marché et propre — et si le coût de production d'énergie tend asymptotiquement vers zéro (comme le suggèrent les avancées en <a href="https://fr.wikipedia.org/wiki/Fusion_nucl%C3%A9aire" target="_blank">fusion nucléaire</a>, éolien, solaire et <a href="https://fr.wikipedia.org/wiki/%C3%89nergie_g%C3%A9othermique" target="_blank">géothermie</a>), alors le prix de tous les biens et services mesurés en satoshis tendrait aussi vers zéro. Dans le <a href="/energystandard/">Standard Énergétique</a> (sats/MJ), chaque satoshi représenterait une quantité croissante d'énergie, et le nécessaire pour vivre deviendrait accessible à tous. Dans cet horizon, l'argent ne disparaîtrait pas d'un coup, mais perdrait progressivement sa fonction de rationnement de la rareté, ne conservant que sa fonction de coordination. La thermodynamique impose une limite — le coût de l'énergie ne sera jamais littéralement nul, car toute conversion implique une perte <a href="https://fr.wikipedia.org/wiki/Entropie_(thermodynamique)" target="_blank">entropique</a> —, mais s'approcher asymptotiquement de cette limite serait déjà transformateur : <strong>une humanité où les besoins fondamentaux sont couverts est une humanité libre de créer, de prendre soin et de coopérer.</strong> <strong>Tel est l'horizon — non pas une utopie instantanée, mais une direction vérifiable pas à pas.</strong></p>

// Barra de progreso
function updateProgressBar() {
  const scrollTop = window.scrollY;
  const docHeight = document.documentElement.scrollHeight - window.innerHeight;
  const progress = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
  document.getElementById('progress-bar').style.width = progress + '%';
}

// Índice flotante para Vision (basado en secciones h2)
function updateFloatingIndex() {
  if (tab !== 'vision') {
    document.getElementById('floating-index').innerHTML = '';
    return;
  }
  
  // Esperar a que el DOM esté listo
  setTimeout(() => {
    const h2s = document.querySelectorAll('.stone-content h2');
    if (h2s.length === 0) return;
    
    const indexEl = document.getElementById('floating-index');
    let html = '';
    h2s.forEach((h2, i) => {
      const id = 'section-' + i;
      h2.id = id;
      const label = h2.textContent.substring(0, 30) + (h2.textContent.length > 30 ? '...' : '');
      html += '<a href="#' + id + '" data-tooltip="' + label + '"></a>';
    });
    indexEl.innerHTML = html;
    
    // Highlight según scroll
    updateActiveSection();
  }, 100);
}

function updateActiveSection() {
  const h2s = document.querySelectorAll('.stone-content h2');
  const links = document.querySelectorAll('#floating-index a');
  if (h2s.length === 0 || links.length === 0) return;
  
  let activeIdx = 0;
  h2s.forEach((h2, i) => {
    if (h2.getBoundingClientRect().top < 200) activeIdx = i;
  });
  
  links.forEach((link, i) => {
    link.classList.toggle('active', i === activeIdx);
  });
}

window.addEventListener('scroll', () => {
  updateProgressBar();
  updateActiveSection();
});

// Actualizar índice cuando cambia el tab
const originalRender = render;
render = function() {
  originalRender();
  updateFloatingIndex();
  setTimeout(positionVegvisir, 200);
};

updateProgressBar();
updateFloatingIndex();

function positionVegvisir() {
  const veg = document.getElementById('bg-vegvisir');
  if (!veg) return;
  const ps = document.querySelectorAll('.stone-content p');
  for (const p of ps) {
    if (p.textContent.includes('medios pac') || p.textContent.includes('peaceful means') || p.textContent.includes('meios pac') || p.textContent.includes('moyens pacifiques')) {
      const rect = p.getBoundingClientRect();
      const scrollY = window.scrollY || document.documentElement.scrollTop;
      const pageY = rect.top + scrollY;
      const parent = veg.closest('div');
      const parentRect = parent.getBoundingClientRect();
      const parentTop = parentRect.top + scrollY;
      veg.style.top = (pageY - parentTop - 40) + 'px';
      veg.style.left = '50%';
      veg.style.transform = 'translateX(-50%)';
      break;
    }
  }
}
setTimeout(positionVegvisir, 200);
