  <script>
    const SHARE_URL = 'https://takepower.world/';const VISION_URL = 'https://takepower.world/vision/';
    const manifesto = {
      es: {
        title: "REVOLUCIÓN DE LA PAZ: HACIA EL CRIPTO COLECTIVISMO",
        quote: "\"La verdad oculta fundamental del mundo es que es algo que creamos juntos y que fácilmente podríamos crear diferente\" — David Graeber",
        content: `<h2>Preámbulo: El momento de la convergencia</h2>
<p>La humanidad afronta una policrisis. En primer término, una crisis medioambiental, donde peligra la vida del organismo tierra, nuestra madre. Una crisis monetaria, por un dinero sin respaldo, deuda infinita, desigualdad estructural y una lucha monetaria sin vencedores posibles. Una crisis energética, por la adicción a los combustibles fósiles, desperdicio masivo, contaminación del agua y el suelo que nos alimenta. Crisis de significado: debido al extremo individualismo, hay una pérdida de propósito y una desesperanza por el futuro. Estas no son crises separadas, sino una sola: <strong>El sistema económico actual nubló la conciencia y nos desconectó de la Naturaleza</strong>, es un sistema incompatible con la supervivencia ecológica y la dignidad humana. Debemos develar la ilusión de la separación.</p>

<h2>Primer principio: Integración de la voluntad y elevación de la conciencia</h2>
<p>Para superar la ilusión de la separación usaremos los cuatro principios de integración socio-política: <strong>La realidad es superior a la idea, el todo es superior a la parte, la unión es superior al conflicto, el tiempo es superior al espacio.</strong></p>

<p>Se propone con frecuencia el biocentrismo como ideología para afrontar la policrisis. La vida es demasiado vasta para definirla, pero debemos posicionar en el centro de la conciencia esta verdad: <strong>lo vivo —todo aquello que tiene textura, temperatura y duración— es lo real</strong>. Aunque la experiencia encarnada nos persuade de que el mundo y el yo son cosas separadas, no podemos olvidar lo primero si queremos avanzar hacia la integración, pues la realidad es siempre superior a la idea del yo. Desde esta perspectiva, se hace evidente que somos microcosmos del organismo Tierra y que, como ella, también estamos enfermos. Nuestra enfermedad exige escuchar al resto de la Naturaleza, porque es ella quien guarda los remedios más profundos.</p>

<p>Aislarse, intentando reproducir el pasado en aldeas autosustentables, no solo resulta imposible en un mundo globalizado; sino que es sobre todo una ilusión vana. Como lo demuestra el ciclo del agua y del CO2, no hay salvación individual. Los organismos en un bosque están todos interligados, las luchas están todas interligadas. Debemos cooperar para continuar, el Neoludismo sería aceptar que el capitalismo mutiló la imaginación humana.</p>

<p>Recordemos que estamos hechos de los mismos elementos que las estrellas y la madera. Que materia y energía son una sola sustancia, vibrando en distintas longitudes de onda, pues <strong>la energía no se crea ni se destruye, solo se transforma</strong>. Considerando esto, podemos ver que si bien las ideas existen fuera del espacio, nada existe fuera del tiempo, y por tanto, el tiempo es superior al espacio. Si el tiempo es infinito, entonces aquello que contiene —la existencia misma— no tiene un propósito externo, como no lo tienen el arte o el amor, que quizá son simples sinónimos. Quien se conmueve ante la vida intenta expresar esos enigmas, aún sabiendo que su belleza es indecible. Y así, en lugar de preguntarnos «¿por qué?» o «¿para qué?», hagámonos una pregunta más íntima y reveladora: <em>¿cómo se encarnó el tiempo en mí?</em></p>

<p>Vamos a elevar la conciencia colectiva modificando juntas economía y cultura. Las formas en que nos amamos, nos alimentamos, nos organizamos, nos expresamos, vamos a transformar todo, si y sólo si tenemos la valentía de confiar los unos en los otros, para hacer la paz, compartir recursos y reconectar entre organismos vivos. En este recomenzar, las matemáticas —esa gramática secreta de la Naturaleza— vuelven a ofrecernos una herramienta de integración, una armonía preexistente, como en la música. <strong>Imaginar y trabajar juntos para continuar esa divina historia de la Tierra, es el poema colectivo que devolverá la dignidad a nuestra especie.</strong></p>

<p>Debemos transformar nuestra relación con la muerte y el nacimiento. Así veremos en las nuevas generaciones, crecidas en una economía circular —de moneda social global—, el entendimiento de que lo que tiene masa decae, pero que <strong>no existe la muerte, sólo transformación</strong>. No es la muerte lo que debe aterrarnos, sino la obstinación por prolongar al individuo, además a costa de las generaciones futuras y la biodiversidad. Todo cuerpo, toda posesión material, es un instante fugaz en el flujo universal de la energía. Hoy, sin embargo, nuestro consumo son objetos que niegan su fugacidad: materiales que decaen tan lento están estancando la corriente. La Tierra se ahoga en cosas abandonadas; nos hemos convertido, sobre todo, en productores de basura. Poner el trabajo en lo primordial y no en el deseo es equilibrar el proceso, vamos a producir más lento y a asumir la responsabilidad del libre albedrío. Consumir es fácil (satisfacer el deseo), crear es difícil (hacer el amor). <strong>Ser valiente entonces es aceptar nuestra fugacidad y aún así elegir lo difícil. Reunamos, pues, la voluntad para el amor.</strong></p>

<h2>Segundo principio: El asunto del dinero</h2>
<p>Es un hecho que el dinero es anterior al capitalismo y surgió como herramienta para la cooperación. Comprenderlo como representación simbólica de energía es clave para entender que <strong>Bitcoin, que es acuñado matemáticamente, a través de una prueba de gasto energético —trabajo computacional—, es la solución de la humanidad para la arbitrariedad del poder de un banco central</strong>, pues hace más abierto y justo el juego del dinero. Ahora bien, con las leyes de la termodinámica en mente y conscientes de la finitud de nuestro planeta, sabemos que no podemos crear energía de la nada. Por ello, no pueden existir bitcoins infinitos, como tampoco deuda infinita. La herramienta es coherente con la Naturaleza.</p>

<p>Diremos además que <strong>Bitcoin es energía social congelada en el tiempo</strong>. Social, porque es producto del trabajo del computador —símbolo físico del progreso colectivo de la humanidad, símbolo de la magia, símbolo del poder del fuego—. Nadie puede declararse dueño de la red de Bitcoin, como nadie puede proclamarse dueño del planeta Tierra, pues ambos son sistemas entrópicos, organismos vivos que, siendo finitos, requieren compromiso individual para ser cuidados y mantenidos en equilibrio. Y es energía congelada en el tiempo porque Bitcoin es un bien digital cuyo valor y seguridad vienen de la transformación irreversible de trabajo colectivo y recursos comunes del mundo real, en un registro contable inmutable (la cadena de bloques), que preserva su valor a través del tiempo y no es limitado por el espacio.</p>

<p>Hay que ver Bitcoin como la arquitectura financiera para un nuevo sistema económico basado en el colectivismo. En su esencia, son los mineros y los nodos quienes validan y aseguran la red. Incluso, si fuera necesario en el futuro, su código podría modificarse por acuerdo de la mayoría —como en todo relato colectivo el consenso es la llave—. No obstante, en este tejido también reside la responsabilidad y la libertad irrevocable del individuo que participa. He ahí la confianza que respalda el valor de Bitcoin: poder computacional colectivo y libertad de elección. Podemos decir entonces que <strong>Bitcoin es la síntesis hegeliana (tesis: capitalismo, antítesis: comunismo)</strong> pues realiza un concilio filosófico en una herramienta práctica para la revolución. ¿Y qué es una revolución, sino una nueva y mejor forma de cooperación?</p>

<p>Enfatizamos que para solucionar la policrisis es fundamental atender la injusticia social. Abandonar otras monedas centralizadas (el dólar, el euro, el yuan, etc) fundadas en el extractivismo, la división y la explotación, posibilitará una cooperación internacional sin precedentes. Cualquier testigo de la guerra comprende que no se puede prosperar en un territorio violento. <strong>Para afrontar la policrisis, es imperativo detener el gasto en armas.</strong> Bitcoin, al ser descentralizado, de código abierto, fundado en el consenso y de contabilidad pública, puede servir como el instrumento para una economía circular global. Un sistema donde, al primar la superioridad del todo sobre la parte, se elimina la necesidad de ataque y defensa entre naciones. Así, incluye y redistribuye la riqueza para todos, como un sistema cerrado que busca el equilibrio térmico. La transparencia radical de su contabilidad y las prioridades del apoyo mutuo desmantelarán los negocios ilícitos y el lucro armamentista. <strong>Por primera vez, la paz mundial se vislumbra no como un anhelo, sino como una posibilidad técnica y ética en el horizonte.</strong></p>

<p>Para quienes temen que los milionários ya acumularon demasiado Bitcoin y que no hay remedio para el egoísmo humano: Llegado el punto donde Bitcoin sea la única moneda aceptada por los trabajadores, la acumulación de dinero se vuelve absurda termodinámicamente, es como almacenar electricidad en baterías gigantes para nunca usarla. Será crucial participar, comerciar bienes y servicios bajo el escrutinio público de la contabilidad. La responsabilidad con la comunidad consistirá, precisamente, en hacer que la energía circule y de potencia a las iniciativas más funcionales. He aquí el principio reductor de la desigualdad e inequidad: <strong>Bitcoin redistribuye la energía social</strong> y en la medida en que el sistema se vaya cerrando, tenderá naturalmente hacia la entropía —hacia el equilibrio que disuelve los acaparamientos estériles y abona el futuro de todos.</p>

<p>Por último, es crucial recordar que las soluciones reales para reconfigurar nuestras formas de vivir encuentran su traba más dura en lo financiero. Cualquiera que haya intentado lanzar una iniciativa de permacultura, de adaptación climática o de atención social puede testimoniarlo: el obstáculo principal siempre es hallar los recursos para materiales y trabajadores. Bitcoin, en su esencia, propone una emancipación financiera radical. Al eliminar la necesidad de un intermediario central —un banco, un Estado, una institución que conceda o niegue permiso—, desarma el mecanismo fundamental de la dominación. Porque toda dominación —de clase, estatal, monetaria, de género— se consolida, en última instancia, propiciando la coerción mediante el control del dinero. <strong>Bitcoin posibilita que el oprimido se libere, no mediante concesiones del opresor, sino mediante el apoyo mutuo y la acción directa.</strong> Sin pedir autorización, puede acceder y canalizar la energía social que precisa para su subsistencia y para su proyecto.</p>

<h2>Agenda política de acción y demandas</h2>
<p>Sabemos que el planeta está llegando al punto de inflexión. Los científicos lo advierten y los habitantes del mundo entero perciben cómo el clima es cada vez más extremo. Está claro que es el momento de la revolución; vamos a tomar acción ahora. <strong>La revolución será triple o no será.</strong> No basta con cambiar el dinero, no basta con cambiar la energía, no basta con cambiar la distribución del capital. Deben cambiarse las tres simultáneamente:</p>

<ol>
<li><strong>La revolución de la paz empieza con rehusarse en el diario vivir a alimentar el sistema capitalista;</strong> pues no es posible transformar el mundo reproduciendo la lógica del poder que lo organiza. Los trabajadores con poder adquisitivo deben cambiar su dinero a Bitcoin y usar solo este para el comercio. Los trabajadores sin poder adquisitivo deben exigir Bitcoin como única compensación justa de su trabajo. Juntos acabaremos la especulación con Bitcoin porque uno no cambia semillas fértiles por basura. Vamos a manifestar nuestro hastío saliendo del juego de la banca tradicional y del dinero infinito que no es más que irresponsabilidad de las generaciones anteriores.</li>

<li>Así como en la pandemia del Covid, demandamos que se aborde este asunto como lo que es: <strong>una crisis global.</strong> Se deben prohibir los vuelos comerciales que no tengan fines humanitarios y pedimos que se desmantelen y reutilicen aeronaves, buques, armas y maquinarias de gasolina para construir una infraestructura energética limpia. El objetivo será hallar utilidad a toda la basura que hemos dejado. Ya hay cientos de iniciativas al respecto; debemos destinarles fondos y mano de obra.</li>

<li><strong>Llamamos a la desobediencia civil,</strong> nadie pagará sus deudas a ningún banco, ni nadie pagará más impuestos a un sistema quebrado y corrupto. Se discutió por años como cobrar impuestos a los más ricos, esa pelea se acabó, que se queden los millonarios su dinero falso que ningún trabajador les aceptará más esa mentira. La energía social fluye donde se encuentra la voluntad de poder (el potencial de la vida).</li>

<li>Cambiamos de moneda para boicotear las instituciones y atacar el bolsillo de los poderosos. Pero es necesario apoderarse de los medios de emisión monetaria. <strong>Le exigimos a los gobiernos del mundo que utilicen Bitcoin para apalancar el financiamiento de la transición energética y que establezcan una Renta Básica Universal de Bitcoin</strong> con el excedente de energía producida, así también financiaremos los servicios públicos.</li>

<li>Aprovechando el trabajo computacional que sostiene el nuevo sistema cripto colectivista. <strong>Vamos a establecer una jornada de trabajo de cuatro días laborales por tres de descanso,</strong> esto para ralentizar la producción, y a su vez bajar la oferta de bienes; las personas tendrán que reutilizar lo que creían inutil —estamos desafiando nuestra creatividad.</li>

<li>Demandamos que se reconozcan y protejan los territorios de los pueblos originarios y comunidades tradicionales. Se debe demarcar y titular terrenos a nombre de comunidades y no de individuos. <strong>Haremos realidad la reforma agraria</strong> y la llevaremos a cabo desde la agroecología para alcanzar seguridad nutricional y soberanía alimentaria sin explotación ni maltrato animal.</li>

<li>Construiremos un <strong>feminismo interseccional, antirracista y anticolonial,</strong> para la diversidad étnica, sexual y de género. Ser feminista es una postura necesaria para cualquiera que aspire a vivir en un mundo más equitativo, libre y justo para todas las personas, incluyendo a las generaciones futuras. Es, finalmente, un acto de empatía y de responsabilidad social.</li>

<li>Vamos a reformar la educación básica para enfocarnos en el <strong>biocentrismo,</strong> que reconoce a la Naturaleza como sujeto de derechos y nos responsabiliza de proteger y conservar la biodiversidad. Recuperaremos el valor de los saberes y prácticas ancestrales para demostrar cómo la perspectiva del Buen Vivir no es una cosa de pobreza o lujo, sino de equilibrio con la Naturaleza.</li>

<li>Para evitar la concentración de poder, tanto el planeta como el ciberespacio deben ser lugares abiertos para todos. <strong>Estableceremos el derecho a la libre circulación de los pueblos</strong> y acabaremos la criminalización de las personas migrantes. También <strong>haremos del acceso a internet un derecho fundamental</strong>, garantizando así una gobernanza global y una democratización del conocimiento humano.</li>

<li>Fomentaremos la reutilización, la reparación, el reciclaje y el ecodiseño para maximizar la durabilidad de los productos y minimizar su impacto ambiental. <strong>Una economía de la funcionalidad</strong> impulsará una transición desde la posesión hacia el uso, donde el proveedor será responsable del bien durante todo su ciclo de vida y se encargará de su mantenimiento, desmantelamiento y reutilización al final de su vida útil.</li>

<li><strong>Reconectar con la Naturaleza y aprender de la permacultura revivirá el deseo de imaginar y crear.</strong> Libres del miedo al desempleo y con el derecho a una parte de la riqueza producida por los trabajadores durante siglos, pondremos la energía social en lo necesario; al menos hasta que la matriz energética sea del todo limpia y podamos decir que hemos construido una economía circular global.</li>
</ol>

<p>En síntesis, utilizaremos Bitcoin para inicialmente apoderarnos de los medios de emisión monetaria, descentralizar y descarbonizar la generación y distribución de energía y posteriormente apoderarnos de todos los medios de producción. <strong>Tendremos éxito por medios pacíficos.</strong></p>

<h2>Para los escépticos que aún no han estudiado Bitcoin:</h2>
<p><strong>¿Qué respalda Bitcoin?</strong><br>El poder computacional de la red, el cual brinda enorme seguridad criptográfica y en el futuro será el poder computacional de toda la humanidad.</p>

<ul>

<li><strong>"Los países más ricos se opondrán":</strong> EE.UU. ya es el mayor minero de Bitcoin del mundo. Ni China ni Rusia consiguen controlar el crecimiento de la red de Bitcoin. Está comprobado que ante la prohibición del minado, el Hash Power simplemente se traslada a otros lugares. Llegado el momento todas las naciones entrarán a cooperar pues, la unión es superior al conflicto.</li>

<li><strong>"Se requiere mucha agua para refrigerar a los mineros":</strong> Siendo propiedad colectiva de la humanidad, los mineros pueden ubicarse en lugares fríos donde la Naturaleza los refrigera gratis y con el calor que producen se pueden calentar invernaderos u hogares. También sumergir los dispositivos en un fluido dieléctrico puede proporcionar refrigeración sin depender del agua.</li>
</ul>

<p>Hay que confiar en las capacidades de la ciencia humana, con inversión libre del interés de lucro, los investigadores hallarán maneras de hacer más eficiente la matriz energética (energía de fusión e.g.) y de aprovechar materiales que se querían descartar. Debemos actuar ahora y ser osados, pues la gente pierde la esperanza y la imaginación. La ONU habla de un mapa de ruta, pero sabemos que nuestros ancestros viajaron a lo desconocido muchas veces sin mapa, apenas con instrumentos para avanzar, sin saber el destino, pero con valentía y siguiendo la brújula del instinto.</p>

<p><strong>Bitcoin es una herramienta más; podemos usarla para la creación de un mundo nuevo. Abre una billetera virtual y promueve el uso de Bitcoin para ayudar.</strong></p>`

        content: `<h2>Prelude: The moment of convergence</h2>
<p>Humanity faces a polycrisis. First, an environmental crisis, where the life of the organism Earth, our mother, is in peril. A monetary crisis, driven by fiat currency, infinite debt, structural inequality, and a monetary struggle with no possible victors. An energy crisis, fueled by addiction to fossil fuels, massive waste, and the pollution of the water and soil that feed us. A crisis of meaning: due to extreme individualism, there is a loss of purpose and despair for the future. These are not separate crises, but a single one: <strong>The current economic system has clouded our consciousness and disconnected us from Nature.</strong> It is a system incompatible with ecological survival and human dignity. We must unveil the illusion of separation.</p>

<h2>First Principle: Integration of will and elevation of consciousness</h2>
<p>To overcome the illusion of separation, we will use the four principles of socio-political integration: <strong>Reality is superior to the idea, the whole is superior to the part, unity is superior to conflict, time is superior to space.</strong></p>

<p>Biocentrism is often proposed as an ideology to address the polycrisis. Life is too vast to define, but we must place this truth at the center of our consciousness: <strong>the living—everything that has texture, temperature, and duration—is what is real.</strong> Although embodied experience persuades us that the world and the self are separate things, we cannot forget the former if we wish to advance toward integration, for reality is always superior to the idea of the self. From this perspective, it becomes evident that we are microcosms of the Earth organism and that, like her, we are also sick. Our sickness demands that we listen to the rest of Nature, for it is she who holds the deepest remedies.</p>

<p>Let us remember that we are made of the same elements as the stars and wood. That matter and energy are a single substance, vibrating at different wavelengths, for <strong>energy is neither created nor destroyed, only transformed.</strong> Considering this, we can see that while ideas exist outside of space, nothing exists outside of time, and therefore, time is superior to space. If time is infinite, then that which it contains—existence itself—has no external purpose, just as art or love do not, which are perhaps simple synonyms. Those moved by life try to express these enigmas, even knowing their beauty is ineffable. And so, instead of asking "why?" or "for what?", let us ask a more intimate and revealing question: <em>How has time incarnated itself in me?</em></p>

<p>We will also say that <strong>Bitcoin is social energy frozen in time.</strong> Social, because it is the product of the computer's work—a physical symbol of humanity's collective progress, a symbol of magic, a symbol of the power of fire. No one can declare themselves the owner of the Bitcoin network, just as no one can proclaim themselves the owner of planet Earth, for both are entropic systems, living organisms that, being finite, require individual commitment to be cared for and maintained in equilibrium. And it is energy frozen in time because Bitcoin is a digital asset whose value and security come from the irreversible transformation of collective work and common resources of the real world, into an immutable accounting ledger (the blockchain), which preserves its value through time and is not limited by space.</p>

<p>We emphasize that to solve the polycrisis, addressing social injustice is fundamental. Abandoning other centralized currencies (the dollar, euro, yuan, etc.) founded on extractivism, division, and exploitation will enable unprecedented international cooperation. Any witness to war understands that one cannot prosper in a violent territory. <strong>To address the polycrisis, it is imperative to stop spending on weapons.</strong> Bitcoin, being decentralized, open-source, founded on consensus, and with public accounting, can serve as the instrument for a global circular economy. A system where, by prioritizing the superiority of the whole over the part, the need for attack and defense between nations is eliminated. Thus, it includes and redistributes wealth for all, like a closed system seeking thermal equilibrium. The radical transparency of its accounting and the priorities of mutual aid will dismantle illicit businesses and the military-industrial complex. <strong>For the first time, world peace is glimpsed not as a yearning, but as a technical and ethical possibility on the horizon.</strong></p>

<p>Nous soulignons que pour résoudre la polycrise, il est fondamental de s'occuper de l'injustice sociale. Abandonner les autres monnaies centralisées (le dollar, l'euro, le yuan, etc.) fondées sur l'extractivisme, la division et l'exploitation, permettra une coopération internationale sans précédent. Tout témoin de la guerre comprend qu'on ne peut prospérer sur un territoire violent. <strong>Pour affronter la polycrise, il est impératif d'arrêter les dépenses d'armement.</strong> Le Bitcoin, en étant décentralisé, open source, fondé sur le consensus et avec une comptabilité publique, peut servir d'instrument pour une économie circulaire globale. Un système où, la supériorité du tout sur la partie étant primordiale, la nécessité d'attaque et de défense entre nations est éliminée. Ainsi, il inclut et redistribue la richesse pour tous, comme un système fermé qui cherche l'équilibre thermique. La transparence radicale de sa comptabilité et les priorités de l'entraide démantèleront les affaires illicites et le profit lié à l'armement. <strong>Pour la première fois, la paix mondiale apparaît non pas comme un vœu pieux, mais comme une possibilité technique et éthique à l'horizon.</strong></p>

<p>Pour ceux qui craignent que les millionnaires aient déjà accumulé trop de Bitcoin et qu'il n'y ait pas de remède à l'égoïsme humain : Arrivé au point où le Bitcoin sera la seule monnaie acceptée par les travailleurs, l'accumulation d'argent devient absurde thermodynamiquement, c'est comme stocker de l'électricité dans des batteries géantes pour ne jamais l'utiliser. Il sera crucial de participer, d'échanger biens et services sous le regard public de la comptabilité. La responsabilité envers la communauté consistera précisément à faire circuler l'énergie et à donner de la puissance aux initiatives les plus fonctionnelles. Voici le principe réducteur d'inégalité et d'iniquité : <strong>le Bitcoin redistribue l'énergie sociale</strong> et, à mesure que le système se refermera, il tendra naturellement vers l'entropie — vers l'équilibre qui dissout les accaparements stériles et fertilise l'avenir de tous.</p>

<p>Enfin, il est crucial de rappeler que les solutions réelles pour reconfigurer nos manières de vivre trouvent leur obstacle le plus dur dans le financier. Quiconque a tenté de lancer une initiative de permaculture, d'adaptation climatique ou d'attention sociale peut en témoigner : l'obstacle principal est toujours de trouver les ressources pour les matériaux et les travailleurs. Le Bitcoin, dans son essence, propose une émancipation financière radicale. En éliminant le besoin d'un intermédiaire central — une banque, un État, une institution qui accorde ou refuse la permission —, il désarme le mécanisme fondamental de la domination. Car toute domination — de classe, étatique, monétaire, de genre — se consolide, en dernière instance, en permettant la coercition par le contrôle de l'argent. <strong>Le Bitcoin permet à l'opprimé de se libérer, non par des concessions de l'oppresseur, mais par l'entraide et l'action directe.</strong> Sans demander d'autorisation, il peut accéder et canaliser l'énergie sociale dont il a besoin pour sa subsistance et son projet.</p>

<h2>Agenda politique d'action et revendications</h2>
<p>Nous savons que la planète atteint un point de basculement. Les scientifiques le préviennent et les habitants du monde entier perçoivent que le climat est de plus en plus extrême. Il est clair que c'est le moment de la révolution ; nous allons agir maintenant. <strong>La révolution sera triple ou ne sera pas.</strong> Il ne suffit pas de changer l'argent, il ne suffit pas de changer l'énergie, il ne suffit pas de changer la distribution du capital. Les trois doivent changer simultanément :</p>

<p>En synthèse, nous utiliserons le Bitcoin pour d'abord nous emparer des moyens d'émission monétaire, décentraliser et décarboniser la production et distribution d'énergie, puis nous emparer de tous les moyens de production. <strong>Nous réussirons par des moyens pacifiques.</strong></p>

      btn.classList.remove('bg-emerald-900/50', 'text-emerald-200');
    } else {
      btn.classList.remove('bg-emerald-600', 'text-white');
      btn.classList.add('bg-emerald-900/50', 'text-emerald-200');
    }
  });
}

let heroHidden = false;
let scrollLocked = false;

function hideHero() {
  if (heroHidden || scrollLocked) return;
  scrollLocked = true;
  heroHidden = true;
  document.getElementById('hero-section').classList.add('hidden');
  document.getElementById('hero-spacer').classList.add('collapsed');
  setTimeout(function() { scrollLocked = false; }, 600);
}

function showHero() {
  if (!heroHidden || scrollLocked) return;
  scrollLocked = true;
  heroHidden = false;
  document.getElementById('hero-section').classList.remove('hidden');
  document.getElementById('hero-spacer').classList.remove('collapsed');
  window.scrollTo({ top: 0, behavior: 'smooth' });
  setTimeout(function() { scrollLocked = false; }, 600);
}

// Scroll: solo para re-mostrar el hero al volver arriba del todo
window.addEventListener('scroll', function() {
  if (window.scrollY <= 5 && heroHidden && !scrollLocked) {
    showHero();
  }
}, { passive: true });

// Wheel: ocultar hero al hacer scroll down
window.addEventListener('wheel', function(e) {
  if (!heroHidden && e.deltaY > 30) {
    hideHero();
  }
}, { passive: true });

// Touch: swipe para ocultar hero
let touchStartY = 0;
window.addEventListener('touchstart', function(e) {
  touchStartY = e.touches[0].clientY;
}, { passive: true });

window.addEventListener('touchend', function(e) {
  var diff = touchStartY - e.changedTouches[0].clientY;
  if (!heroHidden && diff > 60) {
    hideHero();
  }
}, { passive: true });

// Override setLang to also update hero
const originalSetLang = setLang;
setLang = function(l) {
  originalSetLang(l);
  renderHero();
};

renderHero();

// Toroid animation
const canvas = document.getElementById('toroidCanvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

const R = 200, r = 160;
let flowOffset = 0;
const tiltX = Math.PI / 2;
const colors = [
  { h: 150, s: 70, l: 45 },
  { h: 160, s: 60, l: 55 },
  { h: 170, s: 50, l: 65 }
];

function drawToroid() {
  const width = canvas.width;
  const height = canvas.height;
  const cx = width / 2;
  const cy = height / 2;
  
  ctx.clearRect(0, 0, width, height);
  
  const cosX = Math.cos(tiltX);
  const sinX = Math.sin(tiltX);
  
  const lines = [];
  const numMeridians = 48;
  const numPoints = 64;
  
  for (let i = 0; i < numMeridians; i++) {
    const phi = (i / numMeridians) * Math.PI * 2;
    const linePoints = [];
    
    for (let j = 0; j <= numPoints; j++) {
      const theta = (j / numPoints) * Math.PI * 2;
      
      let x = (R + r * Math.cos(theta)) * Math.cos(phi);
      let y = (R + r * Math.cos(theta)) * Math.sin(phi);
      let z = r * Math.sin(theta);
      
      const x2 = x;
      const y2 = y * cosX - z * sinX;
      const z2 = y * sinX + z * cosX;
      
      const scale = 600 / (600 + z2);
      const px = cx + x2 * scale;
      const py = cy + y2 * scale;
      
      linePoints.push({ x: px, y: py, z: z2, theta });
    }
    
    const avgZ = linePoints.reduce((sum, p) => sum + p.z, 0) / linePoints.length;
    const colorIndex = i % 3;
    lines.push({ points: linePoints, avgZ, colorIndex });
  }
  
  lines.sort((a, b) => a.avgZ - b.avgZ);
  
  lines.forEach(line => {
    const depthFactor = (line.avgZ + R + r) / (2 * (R + r));
    const color = colors[line.colorIndex];
    
    const dashLength = 8;
    const gapLength = 12;
    const dashOffset = (flowOffset * 50) % (dashLength + gapLength);
    ctx.setLineDash([dashLength, gapLength]);
    ctx.lineDashOffset = -dashOffset;
    
    for (let i = 1; i < line.points.length; i++) {
      const p0 = line.points[i - 1];
      const p1 = line.points[i];
      
      const avgY = (p0.y + p1.y) / 2;
      const distFromCenter = Math.abs(avgY - cy);
      
      const tubeProximity = Math.max(0, distFromCenter - (R - r * 0.3)) / (r * 0.8);
      const glowIntensity = Math.min(1, tubeProximity);
      
      const baseAlpha = 0.1 + depthFactor * 0.4;
      const glowAlpha = baseAlpha + glowIntensity * 0.5;
      const baseWidth = 0.5 + depthFactor * 1;
      const glowWidth = baseWidth + glowIntensity * 2;
      const lightness = color.l + glowIntensity * 25;
      
      ctx.beginPath();
      ctx.moveTo(p0.x, p0.y);
      ctx.lineTo(p1.x, p1.y);
      
      if (glowIntensity > 0.2) {
        ctx.shadowColor = 'hsla(' + color.h + ', ' + color.s + '%, 80%, ' + (glowIntensity * 0.8) + ')';
        ctx.shadowBlur = 10 + glowIntensity * 15;
      } else {
        ctx.shadowBlur = 0;
      }
      
      ctx.strokeStyle = 'hsla(' + color.h + ', ' + color.s + '%, ' + lightness + '%, ' + glowAlpha + ')';
      ctx.lineWidth = glowWidth;
      ctx.stroke();
    }
    
    ctx.shadowBlur = 0;
  });
  
  ctx.setLineDash([]);
  flowOffset -= 0.02;
  
  requestAnimationFrame(drawToroid);
}

drawToroid();
