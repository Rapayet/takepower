    .vote-btn:disabled { opacity:0.4; cursor:default; }
    
    /* Barra de progreso */
    #progress-bar {
      position: fixed;
      top: 0;
      left: 0;
      width: 0%;
      height: 3px;
      background: linear-gradient(90deg, #f7931a, #10b981);
      z-index: 9999;
      transition: width 0.1s ease-out;

    async function voteProduct(id, cat, v, event, isPredefined = false) {
      if (event) event.stopPropagation();

      try {
        const res = await fetch('/api/energy/vote', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ product_id: id, vote: v, is_predefined: isPredefined, categoria: cat })
        });
        const data = await res.json();
        if (data.success) {
          misVotos[id] = v;
          if (isPredefined) { votosPredefinidos[id] = { up: data.votes_up, down: data.votes_down }; }
          else {
            const prod = comunidad.find(p => p.id === id);

            if (data.eliminated) { comunidad = comunidad.filter(p => p.id !== id); }
          }
          buildTodos(); render();
        }
      } catch (e) { console.error('Error votando:', e); }

    const REWARD_BTC = 3.125;
    const SATS_POR_BTC = 100000000;
    const BLOQUES_POR_HORA = 6;
    
    let networkData = {
      hashrate_ehs: 850, potencia_gw: 23.8,
      tasa_sats_mj: 156, tasa_sats_kwh: 562,
      loading: true, lastUpdate: null
    };

    function calcularTasa(hashrate_ehs) {
      const hashrate_ths = hashrate_ehs * 1000000;
      const potencia_w = hashrate_ths * EFICIENCIA_J_TH;
      const potencia_gw = potencia_w / 1000000000;
      const energia_mj_hora = (potencia_w * 3600) / 1000000;
      const sats_hora = REWARD_BTC * SATS_POR_BTC * BLOQUES_POR_HORA;
      const tasa_sats_mj = sats_hora / energia_mj_hora;
      const tasa_sats_kwh = tasa_sats_mj * 3.6;
      return { hashrate_ehs, potencia_gw: potencia_gw.toFixed(1), tasa_sats_mj: Math.round(tasa_sats_mj), tasa_sats_kwh: Math.round(tasa_sats_kwh) };
    }

    async function fetchNetworkData() {
      try {

        const data = await response.json();
        if (data.currentHashrate) {
          const hashrate_ehs = data.currentHashrate / 1e18;
          networkData = { ...calcularTasa(hashrate_ehs), loading: false, lastUpdate: new Date() };
        }
      } catch (error) {
        networkData = { ...calcularTasa(850), loading: false, lastUpdate: null };

            votosUp: voteData.up || 0, votosDown: voteData.down || 0,

        {n:{es:'⊕ Otro (MJ directo)',en:'⊕ Other (direct MJ)',br:'⊕ Outro (MJ direto)',fr:'⊕ Autre (MJ direct)'},mj:1,u:'MJ'}
      ]
    };
    const REF_WATER = [
      {n:{es:'Lluvia/río/pozo',en:'Rain/river/well',br:'Chuva/rio/poço',fr:'Pluie/rivière/puits'},mj:0},
      {n:{es:'Grifo/canilla',en:'Tap water',br:'Torneira',fr:'Robinet'},mj:0.01},
      {n:{es:'Embotellada',en:'Bottled',br:'Engarrafada',fr:'En bouteille'},mj:2},
      {n:{es:'Calentada',en:'Heated',br:'Aquecida',fr:'Chauffée'},mj:0.3}
    ];
    const REF_ENERGY = [
      {n:{es:'Electricidad',en:'Electricity',br:'Eletricidade',fr:'Électricité'},mj:3.6,u:'kWh'},
      {n:{es:'Leña',en:'Firewood',br:'Lenha',fr:'Bois de chauffage'},mj:16,u:'kg'},
      {n:{es:'Carbón',en:'Coal',br:'Carvão',fr:'Charbon'},mj:29,u:'kg'},
      {n:{es:'Gas (cocción)',en:'Gas (cooking)',br:'Gás (cocção)',fr:'Gaz (cuisson)'},mj:8,u:'h'},
      {n:{es:'Gasolina',en:'Gasoline',br:'Gasolina',fr:'Essence'},mj:34,u:'lt'}
    ];
    const REF_TOOLS = [
      {n:{es:'Manual',en:'Hand tools',br:'Manual',fr:'Manuel'},mj:0.3},
      {n:{es:'Animal',en:'Animal',br:'Animal',fr:'Animal'},mj:2},
      {n:{es:'Eléctrica',en:'Electric',br:'Elétrica',fr:'Électrique'},mj:2},
      {n:{es:'Motor',en:'Engine',br:'Motor',fr:'Moteur'},mj:15}
    ];
    const REF_TRANSPORT = [
      {n:{es:'A pie/bici',en:'Walking/bike',br:'A pé/bici',fr:'À pied/vélo'},mj:0},
      {n:{es:'Moto',en:'Motorcycle',br:'Moto',fr:'Moto'},mj:1.5},
      {n:{es:'Carro',en:'Car',br:'Carro',fr:'Voiture'},mj:3},
      {n:{es:'Camión',en:'Truck',br:'Caminhão',fr:'Camion'},mj:5},
      {n:{es:'Tren',en:'Train',br:'Trem',fr:'Train'},mj:0.5}
    ];

    function getCalcMJ() {
      if (!calcState.cat) return {total:0};
      const mats = REF_MAT[calcState.cat]||[];
      let matMJ=0; calcState.mats.forEach(m=>{const r=mats[m.idx];if(r) matMJ+=r.mj*(parseFloat(m.qty)||0);});
      const isCult = calcState.cat==='cultivo';
      const waterMJ = (parseFloat(calcState.waterQty)||0)*REF_WATER[calcState.waterType].mj*(isCult?(parseFloat(calcState.naturalDays)||1):1);
      let energyMJ=0; calcState.energyRows.forEach(e=>{const r=REF_ENERGY[e.idx];if(r) energyMJ+=r.mj*(parseFloat(e.qty)||0);});
      let toolMJ=0; calcState.tools.forEach((s,i)=>{if(s) toolMJ+=REF_TOOLS[i].mj;}); toolMJ*=(parseFloat(calcState.toolHours)||0);
      const expMJ=[25,30,35,40][calcState.expertIdx];
      const laborMJ=(parseFloat(calcState.laborHours)||0)*expMJ;
      const natD=parseFloat(calcState.naturalDays)||0,natA=parseFloat(calcState.naturalArea)||0,natS=parseFloat(calcState.naturalSunH)||0;
      const naturalMJ=isCult?natD*natA*natS*0.06:0;
      const transportMJ=REF_TRANSPORT[calcState.transportIdx].mj*(parseFloat(calcState.transportKm)||0)*2;
      const total=matMJ+waterMJ+energyMJ+toolMJ+laborMJ+naturalMJ+transportMJ;
      return {total,materials:matMJ,water:waterMJ,energy:energyMJ,tools:toolMJ,labor:laborMJ,natural:naturalMJ,transport:transportMJ};
    }

    function setCalcCat(c) { calcState.cat=c; calcState.mats=[{idx:0,qty:''}]; calcState.energyRows=[{idx:0,qty:''}]; calcState.tools=[false,false,false,false]; calcState.toolHours=''; calcState.naturalDays=''; calcState.naturalArea=''; calcState.naturalSunH=''; calcState.laborHours=''; calcState.expertIdx=0; calcState.transportIdx=0; calcState.transportKm=''; calcState.units='1'; calcState.margin=0; turnstileWidgetId=null; render(); }
    function addMatRow() { syncCalcState(); calcState.mats.push({idx:0,qty:''}); render(); }
    function rmMatRow(i) { syncCalcState(); calcState.mats.splice(i,1); render(); }
    function addEnergyRow() { syncCalcState(); calcState.energyRows.push({idx:0,qty:''}); render(); }
    function rmEnergyRow(i) { syncCalcState(); calcState.energyRows.splice(i,1); render(); }
    function toggleTool(i) { const el=document.querySelector(`.tool-pill[data-i="${i}"]`); if(el){if(el.classList.contains('selected')){el.classList.remove('selected','border-emerald-500','text-emerald-400');el.classList.add('border-gray-600','text-gray-400');}else{el.classList.remove('border-gray-600','text-gray-400');el.classList.add('selected','border-emerald-500','text-emerald-400');}calcState.tools[i]=el.classList.contains('selected');} recalc(); }
    function selPill(el,cls,key) { document.querySelectorAll('.'+cls).forEach(b=>{b.classList.remove('selected','border-emerald-500','text-emerald-400');b.classList.add('border-gray-600','text-gray-400');}); el.classList.remove('border-gray-600','text-gray-400'); el.classList.add('selected','border-emerald-500','text-emerald-400'); calcState[key]=parseInt(el.dataset.i); recalc(); }

    function syncCalcState() {
      document.querySelectorAll('.mat-row').forEach((row,i)=>{
        if(!calcState.mats[i]) calcState.mats[i]={idx:0,qty:''};
        calcState.mats[i].idx=parseInt(row.querySelector('.mat-sel')?.value||'0');
        calcState.mats[i].qty=row.querySelector('.mat-qty')?.value||'';
      });
      calcState.waterType=parseInt(document.querySelector('.water-pill.selected')?.dataset?.i||'0');
      calcState.waterQty=document.getElementById('c-water')?.value||'';
      document.querySelectorAll('.energy-row').forEach((row,i)=>{
        if(!calcState.energyRows[i]) calcState.energyRows[i]={idx:0,qty:''};
        calcState.energyRows[i].idx=parseInt(row.querySelector('.en-sel')?.value||'0');
        calcState.energyRows[i].qty=row.querySelector('.en-qty')?.value||'';
      });
      calcState.tools.forEach((_,i)=>{calcState.tools[i]=!!document.querySelector(`.tool-pill[data-i="${i}"].selected`);});
      calcState.toolHours=document.getElementById('c-toolh')?.value||'';
      calcState.naturalDays=document.getElementById('c-natd')?.value||'';
      calcState.naturalArea=document.getElementById('c-nata')?.value||'';
      calcState.naturalSunH=document.getElementById('c-nats')?.value||'';
      calcState.laborHours=document.getElementById('c-labh')?.value||'';
      calcState.expertIdx=parseInt(document.querySelector('.expert-pill.selected')?.dataset?.i||'0');
      calcState.transportIdx=parseInt(document.querySelector('.trans-pill.selected')?.dataset?.i||'0');
      calcState.transportKm=document.getElementById('c-trk')?.value||'';
      calcState.units=document.getElementById('c-units')?.value||'1';
    }

    function recalc() {
      syncCalcState();
      const d=getCalcMJ();
      const mats=REF_MAT[calcState.cat]||[];
      function updMJ(el, v, suffix) {
        if (!el) return;
        if (v > 0) {
          const display = v >= 1 ? v.toFixed(1) : v >= 0.01 ? v.toFixed(2) : v.toFixed(3);
          el.textContent = '= ' + display + ' MJ' + (suffix||'');
          el.style.cssText = 'color:#10b981;font-weight:700;font-size:12px;font-family:ui-monospace,monospace;background:rgba(16,185,129,0.1);padding:2px 6px;border-radius:4px;';
        } else {
          el.textContent = '';
          el.style.cssText = 'color:#4b5563;font-size:11px;font-family:ui-monospace,monospace;';
        }
      }
      calcState.mats.forEach((m,i)=>{const r=mats[m.idx];const v=r?r.mj*(parseFloat(m.qty)||0):0;updMJ(document.getElementById(`mmj${i}`),v);});
      // Update material placeholders
      document.querySelectorAll('.mat-row').forEach((row,i)=>{const sel=row.querySelector('.mat-sel');const qty=row.querySelector('.mat-qty');if(sel&&qty){const r=mats[parseInt(sel.value)];if(r) qty.placeholder=r.u;}});
      updMJ(document.getElementById('wmj'), d.water);
      document.querySelectorAll('.energy-row').forEach((row,i)=>{const el=row.querySelector('.enmj');const e=calcState.energyRows[i];const r=REF_ENERGY[e?.idx||0];const v=r?r.mj*(parseFloat(e?.qty)||0):0;updMJ(el,v);
        // Update energy placeholders
        const qty=row.querySelector('.en-qty');if(qty&&r) qty.placeholder=r.u;
      });
      updMJ(document.getElementById('nmj'), d.natural);
      updMJ(document.getElementById('tmj'), d.tools);
      updMJ(document.getElementById('lmj'), d.labor);
      updMJ(document.getElementById('trmj'), d.transport, d.transport>0?' (↔)':'');
      renderCalcResult(d);
    }

    function renderCalcResult(d) {
      const area=document.getElementById('calc-result-area'); if(!area) return;
      const t=texts[lang]||texts.es;
      const units=Math.max(1,parseFloat(calcState.units)||1);
      const mjU=d.total/units; const base=Math.round(mjU*TASA);
      if(d.total<=0){
        area.innerHTML=`<p class="text-gray-500 text-center py-6">${t.fillQ}</p>`;

      const parts=Object.entries(d).filter(([k,v])=>k!=='total'&&v>0);
      area.innerHTML=`

          <div class="flex h-3 rounded-full overflow-hidden mt-4">${parts.map(([k,v])=>`<div style="width:${(v/d.total*100).toFixed(1)}%;background:${colors[k]}" title="${t[lbKeys[k]]}"></div>`).join('')}</div>
          <div class="flex flex-wrap gap-3 mt-2 justify-center">${parts.map(([k,v])=>`<span class="text-xs text-gray-400 flex items-center gap-1"><span class="w-2 h-2 rounded-full inline-block" style="background:${colors[k]}"></span>${t[lbKeys[k]]} ${(v/units).toFixed(1)} MJ (${Math.round(v/d.total*100)}%)</span>`).join('')}</div>
        </div>`;
      // Show and update margin area (don't rebuild it)
      const ma=document.getElementById('calc-margin-area');
      if(ma) {
        ma.style.display='block';
        ma.setAttribute('data-base', base);
      }
      updateMarginDisplay();
      // Show suggest area
      const sugArea=document.getElementById('suggest-area');
      if(sugArea) { sugArea.style.display='block'; }
      const sugMJ=document.getElementById('sug-mj');
      if(sugMJ) { sugMJ.value=mjU.toFixed(1); }
      if(turnstileWidgetId===null) setTimeout(renderTurnstileWidget, 300);
    }

    function updateMarginDisplay() {
      const ma=document.getElementById('calc-margin-area'); if(!ma) return;
      const base=parseInt(ma.getAttribute('data-base'))||0;
      const margin=calcState.margin;
      const final_p=Math.round(base*(1+margin/100));

    // ========== RENDER ==========

      ).join('');

      let calcHTML = `

            <p class="text-amber-400 font-medium mb-2">① ${t.calcS0}</p>

          </div>

          <div class="bg-gradient-to-r from-[#0d2620] to-[#15403a] rounded-2xl p-6 mb-6 text-center border border-emerald-800">
            <h1 class="text-2xl md:text-3xl font-bold text-white mb-2">⚡ ${t.title} ₿</h1>
            <p class="text-emerald-200">${t.subtitle}</p>
          </div>

          <div class="bg-[#0d2620] border-l-4 border-sky-400 p-4 mb-6 flex flex-wrap justify-between items-center gap-2">
            <div>
              <span class="text-amber-500 font-bold text-xl">${T} sats/MJ</span>
              <span class="text-gray-400 ml-2">· ${networkData.tasa_sats_kwh} sats/kWh</span>
            </div>
            <div class="text-sky-300 text-sm">${hr} EH/s · ${networkData.potencia_gw} GW · mempool.space ${networkData.loading ? '⏳' : '✓'}</div>
          </div>

          <div class="flex flex-wrap gap-2 mb-6">${tabBtns}</div>

          <div class="panel ${tab==='catalog'?'active':''}">
            ${catActual === 'servicios' ? servicesPanel : `
            <div class="bg-[#0d2620] rounded-2xl p-6 border border-emerald-800">
              <h2 class="text-lg font-bold text-white mb-4">📦 ${t.catalogTitle}</h2>
              <div class="bg-amber-900/20 border border-amber-700/40 rounded-lg px-4 py-3 mb-4 text-sm text-amber-200/80"><span class="font-bold">⚠️ ${t.catalogDisclaimerTitle}</span> — ${t.catalogDisclaimer}</div>
              <div class="flex flex-wrap gap-2 mb-4">${catBtns}</div>
              <div class="relative mb-4">
                <input type="text" id="search-input" placeholder="${t.searchPlaceholder}" oninput="renderProducts()"
                  class="w-full px-4 py-3 pl-10 bg-[#071510] border border-emerald-800 rounded-lg text-white placeholder-gray-500 focus:border-emerald-500 focus:outline-none">
                <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-500">🔍</span>
              </div>
              <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">${productsGrid}</div>
            </div>`}
          </div>

          <div class="panel ${tab==='calc'?'active':''}">${calcHTML}</div>
          <div class="panel ${tab==='how'?'active':''}">${howHTML}</div>

          <footer class="text-center py-8 mt-8 border-t border-emerald-900">
            <p class="text-gray-400">⚡ ${t.title} — Open Source</p>
            <p class="text-gray-500 italic text-sm mt-2">${t.footerQuote}</p>
            <div class="mt-4"><a href="/privacy/" class="text-emerald-400/50 hover:text-emerald-300 text-xs">Privacy Policy</a></div>
          </footer>
        </div>
      `;
      if (tab === 'calc' && calcState.cat) setTimeout(recalc, 30);
      // Always try to render Turnstile when calc tab is active
      if (tab === 'calc') setTimeout(() => {
        const sa = document.getElementById('suggest-area');
        if (sa && sa.style.display === 'none') return; // Only if visible
        if (turnstileWidgetId === null) renderTurnstileWidget();
      }, 500);
    }

    function setCat(c) { catActual = c; render(); }

    function renderProducts() {
      const t = texts[lang] || texts.es;
      const filtered = filterProducts();
      const el = document.getElementById('products-grid');
      if (!el) return;
      if (!filtered.length) { el.innerHTML = `<p class="text-gray-400 col-span-full">${t.noProducts}</p>`; return; }
      el.innerHTML = filtered.map(p => {
        const totalVotos = (p.votosUp || 0) + (p.votosDown || 0);
        const pctDown = totalVotos > 0 ? Math.round((p.votosDown || 0) / totalVotos * 100) : 0;
        const showWarning = pctDown >= 50;
        const communityBadge = p.fromCommunity ? '<span class="ml-2 text-xs bg-purple-900/50 text-purple-300 px-2 py-0.5 rounded">👥</span>' : '';
        return `
        <div class="product bg-[#071510] rounded-lg p-4 border border-transparent hover:border-amber-500 transition">
          <div class="flex justify-between items-start">
            <div class="font-medium text-white cursor-pointer flex-1" onclick="selectProduct(${p.mj})">${p.nombre}${communityBadge}</div>
            <button onclick="copyProductPrice(${p.sats}, event)" class="text-gray-500 hover:text-amber-400 p-1">${iconCopy}</button>
          </div>
          <div class="text-gray-400 text-sm">${p.mj} MJ · ${(p.mj/3.6).toFixed(2)} kWh</div>
          <div class="text-emerald-400 font-bold text-xl mt-2">${p.sats.toLocaleString()} sats</div>
          <div class="flex items-center gap-2 mt-3 pt-3 border-t border-gray-800">
            <button onclick="voteProduct('${p.id}', '${p.cat}', 1, event, ${p.isPredefined || false})" class="vote-btn flex items-center gap-1 px-2 py-1 rounded text-sm ${p.voted ? 'text-gray-600' : 'text-gray-400 hover:text-emerald-400'}" ${p.voted ? 'disabled' : ''}>${iconThumbUp} <span>${p.votosUp || 0}</span></button>
            <button onclick="voteProduct('${p.id}', '${p.cat}', -1, event, ${p.isPredefined || false})" class="vote-btn flex items-center gap-1 px-2 py-1 rounded text-sm ${p.voted ? 'text-gray-600' : 'text-gray-400 hover:text-red-400'}" ${p.voted ? 'disabled' : ''}>${iconThumbDown} <span>${p.votosDown || 0}</span></button>
            ${showWarning ? `<span class="text-red-400 text-xs ml-auto">${pctDown}% ⚠️</span>` : ''}
          </div>
        </div>`;
      }).join('');
      document.querySelectorAll('.cat-btn').forEach(btn => {
        const cat = btn.onclick?.toString().match(/setCat\('(\w+)'\)/)?.[1];
        if (cat === catActual || (cat === undefined && catActual === 'todas')) {
          btn.classList.remove('border-gray-600', 'text-gray-400');
          btn.classList.add('border-emerald-500', 'text-emerald-400');
        } else {
          btn.classList.remove('border-emerald-500', 'text-emerald-400');
          btn.classList.add('border-gray-600', 'text-gray-400');
        }
      });
    }

    // Init
    initProducts();
    render();
    loadCommunityProducts();
    fetchNetworkData();
    setInterval(fetchNetworkData, 5 * 60 * 1000);
    setInterval(() => loadCommunityProducts(tab === 'calc'), 30 * 1000);
    
    function updateProgressBar() {
      const scrollTop = window.scrollY;
      const docHeight = document.documentElement.scrollHeight - window.innerHeight;
      const progress = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
      document.getElementById('progress-bar').style.width = progress + '%';
    }
    window.addEventListener('scroll', updateProgressBar);
    updateProgressBar();
  </script>
</body>
</html>
