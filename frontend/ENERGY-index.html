: "Fator social (amplificador opcional)", "social1": "A fórmula base já favorece as renováveis pela eficiência física: cozinhar com indução solar exige 1 MJ e com um fogão a lenha aberto 10,6 MJ para o mesmo resultado. Mas as comunidades podem decidir ir além.", "social2": "O fator social é um multiplicador opcional que premia ou penaliza conforme a fonte de energia (a eficiência já está nos MJ). É transparente e ajustável: cada comunidade decide o seu de acordo com seus valores, como o impacto ambiental, a saúde pública, o desmatamento ou seus compromissos internacionais.", "colSource": "Fonte de energia", "colFactor": "Fator", "colEffect": "Efeito", "rows": [["Solar direta", "×1,1", "Prêmio"], ["Renovável / nuclear", "×1,0", "Neutro"], ["Gás natural", "×0,9", "Penalização leve"], ["Diesel", "×0,8", "Penalização"], ["Carvão", "×0,6", "Penalização forte"]], "socialEq": "Preço (sats) = MJ × Fator social × Taxa (sats/MJ)", "socialNote": "A calculadora desta página não aplica nenhum fator social: é uma decisão de cada comunidade, não nossa.", "polTitle": "Por que funciona politicamente?", "a1": "Ao individualista", "q1": "Veja os números: cozinhar com indução custa {ind} sats; com lenha, {lena} sats. Seu dinheiro rende mais com renováveis. E, a longo prazo, o dólar perde poder de compra frente aos sats.", "a2": "Ao coletivista", "q2": "Além da eficiência física, podemos acrescentar um fator social que penalize ainda mais os combustíveis fósseis, transparente e decidido democraticamente por cada comunidade. O registro público do Bitcoin permite rastreabilidade e permite pensar a infraestrutura do Bitcoin e a produção de energia como bens comuns.", "a3": "Ao cético", "q3": "A diferença de eficiência vem de Boltzmann e Carnot: física do século XIX, não uma agenda política. O fator social é opcional e transparente.", "a4": "Aos governos e ao Tratado sobre Combustíveis Fósseis", "q4": "O investimento em renováveis é termodinamicamente superior e o espaço fiscal se otimiza com física. O fator social pode se alinhar com os compromissos internacionais.", "key": "A chave: a fórmula base já incentiva as renováveis por termodinâmica e eficiência física (exergia). O fator social amplifica esse incentivo para as comunidades que quiserem ir além.", "closeTitle": "Nenhuma fórmula substitui os acordos", "close1": "Os números desta página são uma ferramenta para conversar, comparar e decidir. A transição é feita pelas pessoas: cooperativas que começam a cobrar em sats, comunidades que escolhem seu fator social, produtores que compartilham seus custos reais.", "close2": "Não há atalhos: são necessários acordos e imaginação."}, "en": {"tab": "💾 Step-by-step migration", "introTitle": "A process, not a magic solution", "intro1": "The sat prices on this page are a floor reference, not the price something «should» have. Until energy is priced in Bitcoin, the calculator is for estimating and comparing, not for setting final prices.", "intro2": "The underlying proposal is to migrate the economic system to Bitcoin. That does not happen by decree or thanks to a formula: it happens gradually, as producers, communities and governments reach agreements. What matters is making agreements and using our imagination.", "phasesTitle": "The three phases of the transition", "phasesIntro": "The Energy Standard does not aim for absolute precision from day one. It is a process that improves with adoption.", "now": "We are here", "lblData": "Data source", "lblPrec": "Precision", "p1t": "Phase 1 · Estimates", "p1s": "Now", "p1d": "Rate computed from the hashrate + MJ estimated from the scientific literature.", "p1p": "Approximate, but useful for comparing products with each other.", "p1x": "Until electricity is priced in Bitcoin, prices based on embodied energy are floor references.", "p2t": "Phase 2 · Mixed markets", "p2s": "Transition", "p2d": "Real energy costs paid in sats.", "p2p": "Improved: partial but real data.", "p2x": "As more energy producers accept Bitcoin, y"], ["Diesel", "×0.8", "Penalty"], ["Coal", "×0.6", "Strong penalty"]], "socialEq": "Price (sats) = MJ × Social factor × Rate (sats/MJ)", "socialNote": "The calculator on this page applies no social factor: that decision belongs to each community, not to us.", "polTitle": "Why does it work politically?", "a1": "To the individualist", "q1": "Look at the numbers: cooking with induction costs {ind} sats; with firewood, {lena} sats. Your money goes further with renewables. And in the long run, the dollar loses purchasing power against sats.", "a2": "To the collectivist", "q2": "Beyond physical efficiency, we can add a social factor that penalizes fossil fuels even more, transparent and decided democratically by each community. Bitcoin's public ledger allows traceability and lets us think of Bitcoin infrastructure and energy production as commons.", "a3": "To the skeptic", "q3": "The efficiency difference comes from Boltzmann and Carnot: 19th-century physics, not a political agenda. The social factor is optional and transparent.", "a4": "To governments and the Fossil Fuel Treaty", "q4": "Investing in renewables is thermodynamically superior, and fiscal space is optimized with physics. The social factor can be aligned with international commitments.", "key": "The key: the base formula already rewards renewables through thermodynamics and physical efficiency (exergy). The social factor amplifies that incentive for communities that want to go further.", "closeTitle": "No formula replaces agreements", "close1": "The figures on this page are a tool for talking, comparing and deciding. People make the transition: cooperatives that start charging in sats, communities that choose their social factor, producers that share their real costs.", "close2": "There are no shortcuts: it takes agreements and imagination."}, "fr": {"tab": "💾 Migration par étapes", "introTitle": "Un processus, pas une solution magique", "intro1": "Les prix en sats affichés sur cette page sont une référence plancher, pas le prix qu’une chose « devrait » avoir. Tant que l’énergie n’est pas cotée en Bitcoin, la calculatrice sert à estimer et à comparer, pas à fixer des prix définitifs.", "intro2": "La proposition de fond est de faire migrer le système économique vers Bitcoin. Cela n’arrive ni par décret ni grâce à une formule : cela se fait peu à peu, à mesure que producteurs, communautés et gouvernements trouvent des accords. L’essentiel est de passer des accords et de faire preuve d’imagination.", "phasesTitle": "Les trois phases de la transition", "phasesIntro": "Le Standard Énergétique ne vise pas une précision absolue dès le premier jour. C’est un processus qui s’améliore avec l’adoption.", "now": "Nous sommes ici", "lblData": "Source des données", "lblPrec": "Précision", "p1t": "Phase 1 · Estimations", "p1s": "Maintenant", "p1d": "Taux calculé à partir du hashrate + MJ estimés à partir de la littérature scientifique.", "p1p": "Approximative, mais utile pour comparer les produits entre eux.", "p1x": "Tant que l’électricité n’est pas cotée en Bitcoin, les prix fondés sur l’énergie incorporée sont des références plancher.", "p2t": "Phase 2 · Marchés mixtes", "p2s": "Transition", "p2d": "Coûts énergétiques réels payés en sats.", "p2p": "Améliorée : données partielles, mais réelles.", "p2x": "À mesure que davantage de producteurs d’énergie acceptent Bitcoin, les prix cessent d’être des estimations. Un agriculteur n’estime plus les MJ : il additionne ce qu’il a réellement payé en sats à la coopérative solaire, au fournisseur de diesel, etc.", "p3t": "Phase 3 · Maturité", "p3s": "Dénominateur commun", "p3d": "Les marchés de l’énergie sont cotés directement en Bitcoin.", "p3p": "Élevée : prix réels du marché.", "p3x": "Le pétrole est coté en sats par baril, le gaz en sats par m³ et l’électricité en sats par kWh. Le taux sats/MJ émerge du marché, et non d’estimations.", "analogy": "Bitcoin a déjà parcouru ce chemin avec la monnaie : il a commencé à valoir zéro, quelqu’un a payé deux pizzas avec 10 000 BTC, et son prix s’est découvert au fil de millions de transactions. Le Standard Énergétique suit le même chemin.", "exTitle": "Exemple illustratif : un producteur de café (1 kg)", "ex1": "Phase 1, par estimation : culture 8 MJ + transformation 4 MJ + transport local 3 MJ = 15 MJ.", "ex2": "Phase 2, avec des coûts réels en sats : pompage de l’eau (coopérative solaire) 200 sats + séchage (panneau personnel) 0 sat + transport (diesel, de fiat à sats) 150 sats = 350 sats de prix plancher.", "ex3": "En phase 2, le producteur n’estime plus : il additionne ce qu’il a réellement payé, puis fixe sa marge selon le marché local.", "socialTitle": "Facteur social (amplificateur optionnel)", "social1": "La formule de base favorise déjà les renouvelables par l’efficacité physique : cuisiner à l’induction solaire demande 1 MJ, contre 10,6 MJ sur un feu de bois ouvert, pour le même résultat. Mais les communautés peuvent décider d’aller plus loin.", "social2": "Le facteur social est un multiplicateur optionnel qui récompense ou pénalise selon la source d’énergie (l’efficacité est déjà dans les MJ). Il est transparent et ajustable : chaque communauté fixe le sien selon ses valeurs, comme l’impact environnemental, la santé publique, la déforestation ou ses engagements internationaux.", "colSource": "Source d’énergie", "colFactor": "Facteur", "colEffect": "Effet", "rows": [["Solaire direct", "×1,1", "Prime"], ["Renouvelable / nucléaire", "×1,0", "Neutre"], ["Gaz naturel", "×0,9", "Pénalité légère"], ["Diesel", "×0,8", "Pénalité"], ["Charbon", "×0,6", "Pénalité forte"]], "socialEq": "Prix (sats) = MJ × Facteur social × Taux (sats/MJ)", "socialNote": "La calculatrice de cette page n’applique aucun facteur social : c’est une décision qui revient à chaque communauté, pas à nous.", "polTitle": "Pourquoi cela fonctionne-t-il politiquement ?", "a1": "À l’individualiste", "q1": "Regarde les chiffres : cuisiner à l’induction coûte {ind} sats ; au bois, {lena} sats.     function migEsc(x) { return String(x).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
    function migHTML() {
      const m = MIG[lang] || MIG.es;
      const T = networkData.tasa_sats_mj;
      const loc = { es: 'es', en: 'en', br: 'pt-BR', fr: 'fr' }[lang] || 'es';
      const n = (x) => Math.round(x).toLocaleString(loc);
      const q1 = migEsc(m.q1).replace('{ind}', n(1 * T)).replace('{lena}', n(10.6 * T));
      const fase = (i, cur) => `
            <div class="bg-[#071510] border-l-4 ${cur ? 'border-emerald-400' : 'border-gray-600'} p-4 rounded-r-lg" data-fase="${i}">
              <div class="flex flex-wrap items-baseline justify-between gap-2 mb-2">
                <h3 class="${cur ? 'text-emerald-300' : 'text-gray-200'} font-semibold">${migEsc(m['p' + i + 't'])} <span class="text-gray-500 font-normal text-sm">· ${migEsc(m['p' + i + 's'])}</span></h3>
                ${cur ? `<span class="text-xs px-2 py-0.5 rounded-full bg-emerald-700/60 text-emerald-100">${migEsc(m.now)}</span>` : ''}
              </div>
              <p class="text-gray-400 text-sm"><span class="text-gray-300">${migEsc(m.lblData)}:</span> ${migEsc(m['p' + i + 'd'])}</p>
              <p class="text-gray-400 text-sm mt-1"><span class="text-gray-300">${migEsc(m.lblPrec)}:</span> ${migEsc(m['p' + i + 'p'])}</p>
              <p class="text-gray-400 text-sm mt-2">${migEsc(m['p' + i + 'x'])}</p>
            </div>`;
      const filas = m.rows.map(r => `
              <div class="grid grid-cols-3 gap-2 py-2 border-b border-gray-800 text-sm"><span class="text-gray-300">${migEsc(r[0])}</span><span class="text-amber-400 font-mono text-center">${migEsc(r[1])}</span><span class="text-gray-400 text-right">${migEsc(r[2])}</span></div>`).join('');
      const voz = (a, q) => `
            <div class="bg-[#071510] border-l-4 border-sky-400 p-4 rounded-r-lg">
              <h3 class="text-sky-300 font-medium mb-2">${migEsc(a)}</h3>
              <p class="text-gray-400 text-sm italic">«${q}»</p>
            </div>`;
      return `
        <div class="space-y-6" id="mig-panel">
          <div class="bg-[#0d2620] rounded-2xl p-6 border border-emerald-800">
            <h2 class="text-lg font-bold text-white mb-4">💾 ${migEsc(m.introTitle)}</h2>
            <p class="text-gray-300 text-sm mb-3">${migEsc(m.intro1)}</p>
            <p class="text-amber-200 text-sm font-medium">${migEsc(m.intro2)}</p>
          </div>

          <div class="bg-[#0d2620] rounded-2xl p-6 border border-emerald-800">
            <h2 class="text-lg font-bold text-white mb-2">${migEsc(m.phasesTitle)}</h2>
            <p class="text-gray-400 text-sm mb-4">${migEsc(m.phasesIntro)}</p>
            <div class="space-y-3">${fase(1, true)}${fase(2, false)}${fase(3, false)}</div>
            <p class="text-gray-300 text-sm mt-4">${migEsc(m.analogy)}</p>
            <div class="bg-[#071510] border-l-4 border-amber-500 p-4 rounded-r-lg mt-4">
              <h3 class="text-amber-400 font-medium mb-2">☕ ${migEsc(m.exTitle)}</h3>
              <p class="text-gray-400 text-sm">${migEsc(m.ex1)} 15 × ${n(T)} = <strong class="text-emerald-400">${n(15 * T)} sats</strong></p>
              <p class="text-gray-400 text-sm mt-2">${migEsc(m.ex2)}</p>
              <p class="text-gray-500 text-sm mt-2">${migEsc(m.ex3)}</p>
            </div>
          </div>

          <div class="bg-[#0d2620] rounded-2xl p-6 border border-emerald-800">
            <h2 class="text-lg font-bold text-white mb-3">${migEsc(m.socialTitle)}</h2>
            <p class="text-gray-400 text-sm mb-2">${migEsc(m.social1)}</p>
            <p class="text-gray-400 text-sm mb-4">${migEsc(m.social2)}</p>
            <div class="bg-[#071510] rounded-lg px-4 py-2 mb-4">
              <div class="grid grid-cols-3 gap-2 py-2 border-b border-emerald-800 text-xs uppercase tracking-wide text-gray-500"><span>${migEsc(m.colSource)}</span><span class="text-center">${migEsc(m.colFactor)}</span><span class="text-right">${migEsc(m.colEffect)}</span></div>${filas}
            </div>
            <p class="text-emerald-300 font-mono text-sm bg-black/30 p-3 rounded break-words">${migEsc(m.socialEq)}</p>
            <p class="text-gray-500 text-xs mt-3">${migEsc(m.socialNote)}</p>
          </div>

          <div class="bg-[#0d2620] rounded-2xl p-6 border border-emerald-800">
            <h2 class="text-lg font-bold text-white mb-4">${migEsc(m.polTitle)}</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">${voz(m.a1, q1)}${voz(m.a2, migEsc(m.q2))}${voz(m.a3, migEsc(m.q3))}${voz(m.a4, migEsc(m.q4))}</div>
            <p class="text-white text-sm font-medium mt-4 bg-emerald-900/30 border border-emerald-700 rounded-lg p-4">🔑 ${migEsc(m.key)}</p>
          </div>

          <div class="bg-gradient-to-r from-[#0d2620] to-[#15403a] rounded-2xl p-6 border border-amber-600/60 text-center">
            <h2 class="text-lg font-bold text-amber-300 mb-3">🤝 ${migEsc(m.closeTitle)}</h2>
            <p class="text-gray-300 text-sm mb-3">${migEsc(m.close1)}</p>
            <p class="text-white font-semibold">✨ ${migEsc(m.close2)}</p>

    function buildTodos() {
      todos = [];
      updateTASA();
      const prods = buildProductsData();
      for (const [k,v] of Object.entries(prods)) {
        for (const p of v.items) {
          const id = getProductId(p.nombre, p.mj);
          const voteData = votosPredefinidos[id] || { up: 0, down: 0 };
          todos.push({
            ...p, id, cat: k, catNombre: v.nombre,
            sats: Math.round(p.mj * TASA),
            votosUp: voteData.up || 0, votosDown: voteData.down || 0,
            voted: !!misVotos[id], fromCommunity: false, isPredefined: true
          });
        }
      }
      for (const p of comunidad) {
        todos.push({
          ...p, cat: p.cat || 'alimentos',
          catNombre: getCatName(p.cat) || '👥',
          sats: Math.round(p.mj * TASA),
          votosUp: p.votosUp || 0, votosDown: p.votosDown || 0,
          voted: !!misVotos[p.id], fromCommunity: true, isPredefined: false
        });
      }
    }

    function filterProducts() {
      const search = document.getElementById('search-input')?.value?.toLowerCase() || '';
      let filtered = catActual === 'todas' ? todos : todos.filter(p => p.cat === catActual);
      if (search.length >= 2) {
        filtered = filtered.filter(p => p.nombre.toLowerCase().includes(search) || (p.desc||'').toLowerCase().includes(search));
      }
      return filtered;
    }

      const nombre = document.getElementById('sug-name')?.value?.trim() || '';
      const mj = parseFloat(document.getElementById('sug-mj')?.value) || 0;
      const cat = calcState.cat || 'alimentos';
      function showMsg(cls, text) { if (msg) { msg.className = 'mt-3 p-3 rounded-lg text-sm ' + cls; msg.innerHTML = text; msg.scrollIntoView({behavior:'smooth',block:'nearest'}); } }
      if (!nombre || nombre.length < 3) { showMsg('bg-red-900/40 text-red-300', t.sugErrName); return; }
      if (!mj || mj <= 0) { showMsg('bg-red-900/40 text-red-300', t.sugErrEnergy); return; }
      if (btn) { btn.disabled = true; btn.textContent = '⏳...'; }
      showMsg('bg-sky-900/40 text-sky-300', lang==='en'?'Sending...':'Enviando...');
      try {
        const res = await fetch('/api/energy/products', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nombre, categoria: cat, mj, descripcion: 'Calc: ' + mj + ' MJ', turnstile_token: turnstileToken || '' })
        });

    function getCalcMJ() {
      if (!calcState.cat) return {total:0};
      const mats = REF_MAT[calcState.cat]||[];
      let matMJ=0; calcState.mats.forEach(m=>{const r=mats[m.idx];if(r) matMJ+=r.mj*(parseFloat(m.qty)||0);});
      const isCult = calcState.cat==='cultivo';
      const waterMJ = (parseFloat(calcState.waterQty)||0)*REF_WATER[calcState.waterType].mj*(isCult?(parseFloat(calcState.naturalDays)||1):1);
      let energyMJ=0; calcState.energyRows.forEach(e=>{const r=REF_ENERGY[e.idx];if(r) energyMJ+=r.mj*(parseFloat(e.qty)||0);});
      let toolMJ=0; calcState.tools.forEach((s,i)=>{if(s) toolMJ+=REF_TOOLS[i].mj;}); toolMJ*=(parseFloat(calcState.toolHours)||0);
      const expMJ=[25,30,35,40][calcState.expertIdx];
      const laborMJ=(parseFloat(calcState.laborHours)||0)*expMJ;
      const natD=parseFloat(calcState.naturalDays)||0,natA=parseFloat(calcState.naturalArea)||0,natS=parseFloat(calcState.naturalSunH)||0;
      const naturalMJ=isCult?natD*natA*natS*0.06:0;
      const transportMJ=REF_TRANSPORT[calcState.transportIdx].mj*(parseFloat(calcState.transportKm)||0)*2;
      const total=matMJ+waterMJ+energyMJ+toolMJ+laborMJ+naturalMJ+transportMJ;
      return {total,materials:matMJ,water:waterMJ,energy:energyMJ,tools:toolMJ,labor:laborMJ,natural:naturalMJ,transport:transportMJ};

    function recalc() {
      syncCalcState();
      const d=getCalcMJ();

      function updMJ(el, v, suffix) {
        if (!el) return;
        if (v > 0) {
          const display = v >= 1 ? v.toFixed(1) : v >= 0.01 ? v.toFixed(2) : v.toFixed(3);
          el.textContent = '= ' + display + ' MJ' + (suffix||'');
          el.style.cssText = 'color:#10b981;font-weight:700;font-size:12px;font-family:ui-monospace,monospace;background:rgba(16,185,129,0.1);padding:2px 6px;border-radius:4px;';
        } else {
          el.textContent = '';
          el.style.cssText = 'color:#4b5563;font-size:11px;font-family:ui-monospace,monospace;';
        }
      }
      calcState.mats.forEach((m,i)=>{const r=mats[m.idx];const v=r?r.mj*(parseFloat(m.qty)||0):0;updMJ(document.getElementById(`mmj${i}`),v);});
      // Update material placeholders
      document.querySelectorAll('.mat-row').forEach((row,i)=>{const sel=row.querySelector('.mat-sel');const qty=row.querySelector('.mat-qty');if(sel&&qty){const r=mats[parseInt(sel.value)];if(r) qty.placeholder=r.u;}});
      updMJ(document.getElementById('wmj'), d.water);
      document.querySelectorAll('.energy-row').forEach((row,i)=>{const el=row.querySelector('.enmj');const e=calcState.energyRows[i];const r=REF_ENERGY[e?.idx||0];const v=r?r.mj*(parseFloat(e?.qty)||0):0;updMJ(el,v);
        // Update energy placeholders
        const qty=row.querySelector('.en-qty');if(qty&&r) qty.placeholder=r.u;
      });
      updMJ(document.getElementById('nmj'), d.natural);
      updMJ(document.getElementById('tmj'), d.tools);
      updMJ(document.getElementById('lmj'), d.labor);
      updMJ(document.getElementById('trmj'), d.transport, d.transport>0?' (↔)':'');
      renderCalcResult(d);
    }
